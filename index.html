*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--bg) 87%,#173452));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;min-height:100vh}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(16px);padding:20px 15px;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:3px 5px 16px}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#07111f}.brand h1{font-size:16px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}.nav,.filters{display:grid;gap:4px}.nav button,.filters button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:11px;cursor:pointer}.nav button:hover,.nav button.active,.filters button:hover,.filters button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}.main{min-width:0}.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px)}.search{flex:1;position:relative}.search input{width:100%;padding:11px 38px 11px 39px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.search input:focus{border-color:var(--accent)}.search .mag{position:absolute;left:14px;top:10px;color:var(--muted)}.search .key{position:absolute;right:9px;top:8px;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 6px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 11px;cursor:pointer}.content{padding:23px;max-width:1400px;margin:auto}.hero{display:grid;grid-template-columns:1.4fr .7fr;gap:14px;margin-bottom:17px}.box,.card,.topic{border:1px solid var(--line);background:linear-gradient(155deg,var(--panel),color-mix(in srgb,var(--panel2) 55%,var(--panel)));border-radius:17px;box-shadow:var(--shadow)}.hero .box{padding:22px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h2{margin:8px 0 8px;font-size:28px}.hero p,.muted{color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:15px}.stat b{font-size:25px;display:block}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 10px;border-radius:999px;cursor:pointer;font-size:12px}.chip.active{color:var(--text);border-color:var(--accent);background:var(--panel2)}.count{margin-left:auto;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:15px;cursor:pointer;min-height:178px;transition:.15s;position:relative}.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}.card h3{font-size:15px;line-height:1.25;margin:7px 28px 7px 0}.card p{font-size:12px;color:var(--muted);line-height:1.45;margin:0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.badges span{font-size:9px;color:var(--muted);background:var(--panel2);padding:4px 6px;border-radius:999px}.star{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer}.star.on{color:var(--warn)}.detail{display:none}.detail.active{display:block}.back{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;margin:0 0 12px}.detailhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.detailhead h2{font-size:27px;margin:4px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dcard{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:15px}.dcard.full{grid-column:1/-1}.dcard h3{font-size:14px;margin:0 0 9px;color:var(--accent2)}.dcard ul{padding-left:19px;margin:0}.dcard li{font-size:12px;color:var(--muted);line-height:1.5;margin:5px 0}.callout{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel));padding:12px 13px;border-radius:9px;color:var(--muted);font-size:12px;line-height:1.5}.section{display:none}.section.active{display:block}.topic{padding:17px;margin-bottom:12px}.topic h3{margin:0 0 8px;font-size:16px}.topic p,.topic li{font-size:12px;color:var(--muted);line-height:1.5}.checklist{display:grid;gap:7px;margin-top:10px}.check{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);background:var(--panel2);padding:10px;border-radius:11px}.check input{margin-top:3px;accent-color:var(--accent)}.check.done span{text-decoration:line-through;opacity:.6}.quiz{max-width:820px}.quizq{font-size:20px;line-height:1.4;margin:10px 0 16px}.answer{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);line-height:1.55}.answer.show{display:block}.progress{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:7px}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2))}.notearea{width:100%;min-height:480px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical}.empty{border:1px dashed var(--line);border-radius:15px;padding:32px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 12px;border-radius:11px;display:none;z-index:100}.toast.show{display:block}.mobile{display:none}

⁹/l for ir procedures; correct inr if >2 for low-bleeding-risk procedures and if >1.5 for moderate/high-risk procedures. haemostasis / antithrombotics cirse clinical practice manual example: platelet count at least 50 × 10⁹/l for ir procedures; correct inr if >2 for low-bleeding-risk procedures and if >1.5 for moderate/high-risk procedures. these are framework values, not a substitute for your hospital anticoagulation policy. procedure risk, thrombotic risk, drug half-life, renal function and urgency all matter. bridging/reversal decisions should be made with the relevant treating team when thrombotic risk is substantial.","oncall":false,"high":false},{"id":"proc-3","cat":"A","title":"Contrast & kidney safety","sub":"Section A · Fundamentals","summary":"For intravascular iodinated contrast, review renal function and risk of contrast-associated AKI; use current ESUR/local guidance for high-risk patients.","blocks":[{"h":"Contrast & kidney safety","items":["For intravascular iodinated contrast, review renal function and risk of contrast-associated AKI; use current ESUR/local guidance for high-risk patients.","Use the lowest contrast volume that still achieves a safe result; consider US, CO₂ angiography or other contrast-sparing strategies where appropriate.","Previous hypersensitivity requires mechanism/severity review and a local premedication/alternative-agent pathway—not a generic “contrast allergy” label."],"text":"Contrast & kidney safety For intravascular iodinated contrast, review renal function and risk of contrast-associated AKI; use current ESUR/local guidance for high-risk patients. Use the lowest contrast volume that still achieves a safe result; consider US, CO₂ angiography or other contrast-sparing strategies where appropriate. Previous hypersensitivity requires mechanism/severity review and a local premedication/alternative-agent pathway—not a generic “contrast allergy” label."}],"text":"contrast & kidney safety section a · fundamentals for intravascula d rescue risk. deep sedation and general anaesthesia require appropriate anaesthetic expertise and monitoring; moderate sedation still requires airway/resuscitation capability. plan post-procedure analgesia before starting a painful procedure (embolisation/ablation), not after the patient is already in crisis.","oncall":false,"high":false},{"id":"proc-5","cat":"A","title":"Antibiotics & infection","sub":"Section A · Fundamentals","summary":"Most clean vascular procedures do not require routine prophylaxis, while instrumentation of obstructed biliary/urinary systems carries higher bacteraemia risk and often requires prophylaxis/therapy.","blocks":[{"h":"Antibiotics & infection","items":["Most clean vascular procedures do not require routine prophylaxis, while instrumentation of obstructed biliary/urinary systems carries higher bacteraemia risk and often requires prophylaxis/therapy.","If sepsis is the indication, obtain cultures when feasible without delaying source control and ensure antibiotics are active before/around intervention.","Prior bilioenteric anastomosis or biliary instrumentation markedly changes infection risk for liver embolisation/ablation."],"text":"Antibiotics & infection Most clean vascular procedures do not require routine prophylaxis, while instrumentation of obstructed biliary/urinary systems carries higher bacteraemia risk and often requires prophylaxis/therapy. If sepsis is the indication, obtain cultures when feasible without delaying source control and ensure antibiotics are active before/around intervention. Prior bilioenteric anastomosis or biliary instrumentation markedly changes infection risk for liver embolisation/ablation."}],"text":"antibiotics & infection section a · fundamentals most clean vascular procedures do not require routine prophylaxis, while instrumentation of obstructed biliary/urinary systems carries higher bacteraemia risk and often requires prophylaxis/therapy. antibiotics & infection most clean vascular procedures do e and shielding deliberately; collimate, lower pulse/frame rates, use last-image hold and avoid unnecessary magnification. optimise geometry: detector close to patient, x-ray tube as far as practical; be especially cautious with steep obliques and lateral projections. track dose during prolonged procedures and follow your institutional patient-dose follow-up threshold. occupational eye/hand protection and dosimetry are syllabus topics.","oncall":false,"high":false},{"id":"proc-7","cat":"A","title":"Access & bailout planning","sub":"Section A · Fundamentals","summary":"Ultrasound-guided vascular access should be default where feasible.","blocks":[{"h":"Access & bailout planning","items":["Ultrasound-guided vascular access should be default where feasible.","Before puncture, decide the access vessel, sheath size, closure method and how you will control bleeding if the vessel ruptures.","For any embolisation: identify the target, dangerous collaterals, desired endpoint and what embolic behaviour you need (temporary/permanent, proximal/distal, liquid/particle/coil/plug)."],"text":"Access & bailout planning Ultrasound-guided vascular access should be default where feasible. Before puncture, decide the access vessel, sheath size, closure method and how you will control bleeding if the vessel ruptures. For any embolisation: identify the target, dangerous collaterals, desired endpoint and what embolic behaviour you need (temporary/permanent, proximal/distal, liquid/particle/coil/plug)."}],"text":"access & bailout planning section a · fundamentals ultrasound-guided vascular access should be default where feasible. access & bailout planning ultrasound-guided vascular access should be default where feasible. before puncture, decide the access vessel, sheath size, closure method and how you will control bleeding if the vessel ruptures. for any embolisation: identify the target, dangerous collaterals, desired endpoint and what embolic behaviour you need (temporary/permanent, proximal/distal, liquid/particle/coil/plug).","oncall":false,"high":false},{"id":"proc-8","cat":"A","title":"Modified CIRSE complication classification","sub":"Section A · Fundamentals","summary":"1a: complication resolved during the same procedure and intended therapy completed. 1b: resolved during the same procedure but intended therapy not completed.","blocks":[{"h":"Modified CIRSE complication classification","items":["1a: complication resolved during the same procedure and intended therapy completed. 1b: resolved during the same procedure but intended therapy not completed.","2: unplanned prolonged hospitalisation &lt;48 h without additional therapy.","3a: additional therapy and/or hospitalisation &gt;48 h but &lt;2 weeks, with no permanent sequelae. 3b: hospitalisation &gt;2 weeks, no permanent sequelae.","4: mild permanent sequelae; 5: severe sequelae requiring assistance in daily life; 6: death.","Record timing (intra-, peri- or delayed; late &gt;30 days) and the actual patient impact."],"text":"Modified CIRSE complication classification 1a: complication resolved during the same procedure and intended therapy completed. 1b: resolved during the same procedure but intended therapy not completed. 2: unplanned prolonged hospitalisation <48 h without additional therapy. 3a: additional therapy and/or hospitalisation >48 h but <2 weeks, with no permanent sequelae. 3b: hospitalisation >2 weeks, no permanent sequelae. 4: mild permanent sequelae; 5: severe sequelae requiring assistance in daily life; 6: death. Record timing (intra-, peri- or delayed; late >30 days) and the actual patient impact."}],"text":"modified cirse complication classification section a · fundamentals 1a: complication resolved during the same procedure and intended therapy completed. 1b: resolved during the same procedure but intended therapy not completed. modified cirse complication classification 1a: complication resolved during the same procedure and intended therapy completed. 1b: resolved during the same procedure but intended therapy not completed. 2: unplanned prolonged hospitalisation <48 h without additional therapy. 3a: additional therapy and/or hospitalisation >48 h but <2 weeks, with no permanent sequelae. 3b: hospitalisation >2 weeks, no permanent sequelae. 4: mild permanent sequelae; 5: severe sequelae requiring assistance in daily life; 6: death. record timing (intra-, peri- or delayed; late >30 days) and the actual patient impact.","oncall":false,"high":false},{"id":"p-B-0","cat":"B","title":"Lower-limb angioplasty / stenting","sub":"B · Vascular · 2.2.1.1.1 · HIGH-YIELD","summary":"Endovascular revascularisation for lifestyle-limiting PAD or chronic limb-threatening ischaemia after clinical, haemodynamic and anatomic assessment.","blocks":[{"h":"Indications","items":["Chronic limb-threatening ischaemia (rest pain, tissue loss) when revascularisation is appropriate.","Lifestyle-limiting claudication despite best medical therapy/exercise in selected patients.","Focal or multilevel stenotic/occlusive disease suitable for an endovascular strategy."],"text":"Indications Chronic limb-threatening ischaemia (rest pain, tissue loss) when revascularisation is appropriate. Lifestyle-limiting claudication despite best medical therapy/exercise in selected patients. Focal or multilevel stenotic/occlusive disease suitable for an endovascular strategy."},{"h":"Contraindications / cautions","items":["No meaningful clinical indication or symptoms explained by non-vascular disease.","Uncorrectable severe coagulopathy or uncontrolled sepsis at the access/treatment site.","Caution: severe renal dysfunction, contrast allergy, poor distal runoff, no viable limb, inability to tolerate antithrombotic therapy."],"text":"Contraindications / cautions No meaningful clinical indication or symptoms explained by non-vascular disease. Uncorrectable severe coagulopathy or uncontrolled sepsis at the access/treatment site. Caution: severe renal dysfunction, contrast allergy, poor distal runoff, no viable limb, inability to tolerate antithrombotic therapy."},{"h":"Work-up","items":["History: walking distance, rest pain, wounds, smoking, diabetes, cardiovascular risk, prior bypass/stents.","Exam: pulses, wounds/infection, capillary refill; ABI/TBI where reliable.","Duplex and/or CTA/MRA for anatomy; assess inflow, target lesion, runoff and bypass options.","FBC, renal function, coagulation as clinically indicated; reconcile antiplatelet/anticoagulant therapy."],"text":"Work-up History: walking distance, rest pain, wounds, smoking, diabetes, cardiovascular risk, prior bypass/stents. Exam: pulses, wounds/infection, capillary refill; ABI/TBI where reliable. Duplex and/or CTA/MRA for anatomy; assess inflow, target lesion, runoff and bypass options. FBC, renal function, coagulation as clinically indicated; reconcile antiplatelet/anticoagulant therapy."},{"h":"Planning & technique","items":["Plan access (ipsilateral antegrade, contralateral crossover, radial/brachial or pedal in selected cases).","Cross lesion intraluminally where feasible; subintimal recanalisation is often appropriate for CTOs.","Balloon sizing to reference vessel; stent for recoil, flow-limiting dissection, residual stenosis or selected primary-stent territories.","Completion angiography: brisk inline flow, no significant residual stenosis, embolus, dissection or perforation."],"text":"Planning & technique Plan access (ipsilateral antegrade, contralateral crossover, radial/brachial or pedal in selected cases). Cross lesion intraluminally where feasible; subintimal recanalisation is often appropriate for CTOs. Balloon sizing to reference vessel; stent for recoil, flow-limiting dissection, residual stenosis or selected primary-stent territories. Completion angiography: brisk inline flow, no significant residual stenosis, embolus, dissection or perforation."},{"h":"Immediate post-care","items":["Access-site and limb neurovascular observations; analgesia and hydration as appropriate.","Best medical therapy: smoking cessation, lipid/diabetes/BP control, antithrombotic regimen per local vascular protocol.","Wound/podiatry pathway for CLTI."],"text":"Immediate post-care Access-site and limb neurovascular observations; analgesia and hydration as appropriate. Best medical therapy: smoking cessation, lipid/diabetes/BP control, antithrombotic regimen per local vascular protocol. Wound/podiatry pathway for CLTI."},{"h":"Follow-up","items":["Clinical + pulse/wound review; ABI/TBI or duplex according to territory/device and local surveillance pathway.","Escalate early for recurrent symptoms, falling ABI, tissue deterioration or suspected stent failure."],"text":"Follow-up Clinical + pulse/wound review; ABI/TBI or duplex according to territory/device and local surveillance pathway. Escalate early for recurrent symptoms, falling ABI, tissue deterioration or suspected stent failure."},{"h":"Complications & rescue","items":["Access bleeding/pseudoaneurysm → compression, thrombin injection, covered stent or surgery as required.","Distal embolisation / acute thrombosis → aspiration/thrombectomy, lysis or embolic retrieval; restore runoff.","Perforation → prolonged balloon tamponade ± covered stent/embolisation.","Contrast-associated AKI, cholesterol embolisation, dissection, compartment syndrome."],"text":"Complications & rescue Access bleeding/pseudoaneurysm → compression, thrombin injection, covered stent or surgery as required. Distal embolisation / acute thrombosis → aspiration/thrombectomy, lysis or embolic retrieval; restore runoff. Perforation → prolonged balloon tamponade ± covered stent/embolisation. Contrast-associated AKI, cholesterol embolisation, dissection, compartment syndrome."},{"h":"EBIR pearls","items":["EBIR answers should start with clinical indication and best medical therapy, not the device.","Always describe inflow + lesion + runoff and have a bailout plan before crossing."],"text":"EBIR pearls EBIR answers should start with clinical indication and best medical therapy, not the device. Always describe inflow + lesion + runoff and have a bailout plan before crossing."}],"text":"lower-limb angioplasty / stenting b · vascular · 2.2.1.1.1 · high-yield endovascular revascularisation for lifestyle-limiting pad or chronic limb-threatening ischaemia after clinical, haemodynamic and anatomic assessment. indications chronic limb-threatening ischaemia (rest pain, tissue loss) when revascularisation is appropriate. lifestyle-limiting claudication despite best medical therapy/exercise in selected patients. focal or multilevel stenotic/occlusive disease suitable for an endovascular strategy. contraindications / cautions no meaningful clinical indication or symptoms explained by non-vascular disease. uncorrectable severe coagulopathy or uncontrolled sepsis at the access/treatment site. caution: severe renal dysfunction, contrast allergy, poor distal runoff, no viable limb, inability to tolerate antithrombotic therapy. work-up history: walking distance, rest pain, wounds, smoking, diabetes, cardiovascular risk, prior bypass/stents. exam: pulses, wounds/infection, capillary refill; abi/tbi where reliable. duplex and/or cta/mra for anatomy; assess inflow, target lesion, runoff and bypass options. fbc, renal function, coagulation as clinically indicated; reconcile antiplatelet/anticoagulant therapy. planning & technique plan access (ipsilateral antegrade, contralateral crossover, radial/brachial or pedal in selected cases). cross lesion intraluminally where feasible; subintimal recanalisation is often appropriate for ctos. balloon sizing to reference vessel; stent for recoil, flow-limiting dissection, residual stenosis or selected primary-stent territories. completion angiography: brisk inline flow, no significant residual stenosis, embolus, dissection or perforation. immediate post-care access-site and limb neurovascular observations; analgesia and hydration as appropriate. best medical therapy: smoking cessation, lipid/diabetes/bp control, antithrombotic regimen per local vascular protocol. wound/podiatry pathway for clti. follow-up clinical + pulse/wound review; abi/tbi or duplex according to territory/device and local surveillance pathway. escalate early for recurrent symptoms, falling abi, tissue deterioration or suspected stent failure. complications & rescue access bleeding/pseudoaneurysm → compression, thrombin injection, covered stent or surgery as required. distal embolisation / acute thrombosis → aspiration/thrombectomy, lysis or embolic retrieval; restore runoff. perforation → prolonged balloon tamponade ± covered stent/embolisation. contrast-associated aki, cholesterol embolisation, dissection, compartment syndrome. ebir pearls ebir answers should start with clinical indication and best medical therapy, not the device. always describe inflow + lesion + runoff and have a bailout plan before crossing.","oncall":false,"high":true},{"id":"p-B-1","cat":"B","title":"Acute limb ischaemia: thrombectomy / thrombolysis","sub":"B · Vascular · 2.2.1.1.1 · HIGH-YIELD · ON-CALL","summary":"Urgent limb-salvage pathway integrating Rutherford severity, embolic vs thrombotic cause, anticoagulation and revascularisation.","blocks":[{"h":"Indications","items":["Rutherford I–IIa: endovascular thrombolysis/thrombectomy often appropriate depending on cause and anatomy.","Selected IIb limbs may undergo rapid percutaneous thrombectomy when reperfusion can be achieved immediately; surgical input is essential."],"text":"Indications Rutherford I–IIa: endovascular thrombolysis/thrombectomy often appropriate depending on cause and anatomy. Selected IIb limbs may undergo rapid percutaneous thrombectomy when reperfusion can be achieved immediately; surgical input is essential."},{"h":"Contraindications / cautions","items":["Irreversible limb (Rutherford III) → revascularisation is generally inappropriate and potentially harmful.","Major absolute/relative thrombolysis contraindications if lytic therapy is contemplated; mechanical options may remain possible.","Caution: prolonged ischaemia, renal failure, severe reperfusion risk."],"text":"Contraindications / cautions Irreversible limb (Rutherford III) → revascularisation is generally inappropriate and potentially harmful. Major absolute/relative thrombolysis contraindications if lytic therapy is contemplated; mechanical options may remain possible. Caution: prolonged ischaemia, renal failure, severe reperfusion risk."},{"h":"Work-up","items":["Immediate limb exam: pain, pallor, pulselessness, paraesthesia, paralysis, temperature; document Doppler signals.","IV heparin unless contraindicated; analgesia, resuscitation, urgent vascular/IR coordination.","CTA if it will not delay necessary treatment; identify embolus, thrombosed aneurysm/stent/bypass and distal runoff.","FBC/coagulation/fibrinogen/renal function and group &amp; screen when time permits."],"text":"Work-up Immediate limb exam: pain, pallor, pulselessness, paraesthesia, paralysis, temperature; document Doppler signals. IV heparin unless contraindicated; analgesia, resuscitation, urgent vascular/IR coordination. CTA if it will not delay necessary treatment; identify embolus, thrombosed aneurysm/stent/bypass and distal runoff. FBC/coagulation/fibrinogen/renal function and group & screen when time permits."},{"h":"Planning & technique","items":["Choose aspiration/mechanical thrombectomy, catheter-directed lysis, angioplasty/stenting or hybrid strategy.","Treat the underlying lesion after thrombus clearance.","Completion assessment must include distal runoff and clinical reperfusion, not just an angiographic lumen."],"text":"Planning & technique Choose aspiration/mechanical thrombectomy, catheter-directed lysis, angioplasty/stenting or hybrid strategy. Treat the underlying lesion after thrombus clearance. Completion assessment must include distal runoff and clinical reperfusion, not just an angiographic lumen."},{"h":"Immediate post-care","items":["Monitor limb, access site, haemoglobin/coagulation if lysis, renal function and systemic reperfusion markers.","Watch for compartment syndrome and hyperkalaemia/acidosis after prolonged ischaemia."],"text":"Immediate post-care Monitor limb, access site, haemoglobin/coagulation if lysis, renal function and systemic reperfusion markers. Watch for compartment syndrome and hyperkalaemia/acidosis after prolonged ischaemia."},{"h":"Follow-up","items":["Determine aetiology (AF/embolism, PAD, aneurysm, graft/stent failure, thrombophilia where appropriate).","Secondary prevention and surveillance of treated lesion/graft."],"text":"Follow-up Determine aetiology (AF/embolism, PAD, aneurysm, graft/stent failure, thrombophilia where appropriate). Secondary prevention and surveillance of treated lesion/graft."},{"h":"Complications & rescue","items":["Major bleeding / intracranial haemorrhage with thrombolysis → stop lytic, urgent resuscitation and specialist reversal pathway.","Distal embolisation or no-reflow → aspiration, local lysis, vasodilator or further revascularisation.","Reperfusion injury/compartment syndrome → urgent surgical fasciotomy assessment."],"text":"Complications & rescue Major bleeding / intracranial haemorrhage with thrombolysis → stop lytic, urgent resuscitation and specialist reversal pathway. Distal embolisation or no-reflow → aspiration, local lysis, vasodilator or further revascularisation. Reperfusion injury/compartment syndrome → urgent surgical fasciotomy assessment."},{"h":"EBIR pearls","items":["The key first question is Rutherford class: viable, threatened or irreversible?","For IIb, speed matters more than elegance."],"text":"EBIR pearls The key first question is Rutherford class: viable, threatened or irreversible? For IIb, speed matters more than elegance."}],"text":"acute limb ischaemia: thrombectomy / thrombolysis b · vascular · 2.2.1.1.1 · high-yield · on-call urgent limb-salvage pathway integrating rutherford severity, embolic vs thrombotic cause, anticoagulation and revascularisation. indications rutherford i–iia: endovascular thrombolysis/thrombectomy often appropriate depending on cause and anatomy. selected iib limbs may undergo rapid percutaneous thrombectomy when reperfusion can be achieved immediately; surgical input is essential. contraindications / cautions irreversible limb (rutherford iii) → revascularisation is generally inappropriate and potentially harmful. major absolute/relative thrombolysis contraindications if lytic therapy is contemplated; mechanical options may remain possible. caution: prolonged ischaemia, renal failure, severe reperfusion risk. work-up immediate limb exam: pain, pallor, pulselessness, paraesthesia, paralysis, temperature; document doppler signals. iv heparin unless contraindicated; analgesia, resuscitation, urgent vascular/ir coordination. cta if it will not delay necessary treatment; identify embolus, thrombosed aneurysm/stent/bypass and distal runoff. fbc/coagulation/fibrinogen/renal function and group & screen when time permits. planning & technique choose aspiration/mechanical thrombectomy, catheter-directed lysis, angioplasty/stenting or hybrid strategy. treat the underlying lesion after thrombus clearance. completion assessment must include distal runoff and clinical reperfusion, not just an angiographic lumen. immediate post-care monitor limb, access site, haemoglobin/coagulation if lysis, renal function and systemic reperfusion markers. watch for compartment syndrome and hyperkalaemia/acidosis after prolonged ischaemia. follow-up determine aetiology (af/embolism, pad, aneurysm, graft/stent failure, thrombophilia where appropriate). secondary prevention and surveillance of treated lesion/graft. complications & rescue major bleeding / intracranial haemorrhage with thrombolysis → stop lytic, urgent resuscitation and specialist reversal pathway. distal embolisation or no-reflow → aspiration, local lysis, vasodilator or further revascularisation. reperfusion injury/compartment syndrome → urgent surgical fasciotomy assessment. ebir pearls the key first question is rutherford class: viable, threatened or irreversible? for iib, speed matters more than elegance.","oncall":true,"high":true},{"id":"p-B-2","cat":"B","title":"EVAR / TEVAR","sub":"B · Vascular · 2.2.1.1.3 · HIGH-YIELD","summary":"Endograft treatment of aortic aneurysmal and selected acute aortic syndromes with anatomy-driven planning and lifelong surveillance.","blocks":[{"h":"Indications","items":["Aneurysm/dissection/traumatic aortic injury meeting guideline- and patient-specific intervention criteria.","Complicated type B dissection (e.g. rupture, malperfusion, refractory pain/hypertension) generally favours intervention."],"text":"Indications Aneurysm/dissection/traumatic aortic injury meeting guideline- and patient-specific intervention criteria. Complicated type B dissection (e.g. rupture, malperfusion, refractory pain/hypertension) generally favours intervention."},{"h":"Contraindications / cautions","items":["Anatomy incompatible with safe proximal/distal seal or access without a feasible adjunctive strategy.","Uncorrectable infection/mycotic process is a major concern for standard endografting.","Caution: renal impairment, hostile access, short/angulated neck, branch-vessel coverage, connective tissue disease."],"text":"Contraindications / cautions Anatomy incompatible with safe proximal/distal seal or access without a feasible adjunctive strategy. Uncorrectable infection/mycotic process is a major concern for standard endografting. Caution: renal impairment, hostile access, short/angulated neck, branch-vessel coverage, connective tissue disease."},{"h":"Work-up","items":["Thin-slice arterial CTA from relevant supra-aortic/visceral branches through femoral access vessels.","Measure landing zones, diameters, angulation, thrombus/calcification, branch origins and access calibre.","FBC, renal function, coagulation; cardiac/anaesthetic risk; assess need for CSF/spinal protection in extensive thoracic coverage."],"text":"Work-up Thin-slice arterial CTA from relevant supra-aortic/visceral branches through femoral access vessels. Measure landing zones, diameters, angulation, thrombus/calcification, branch origins and access calibre. FBC, renal function, coagulation; cardiac/anaesthetic risk; assess need for CSF/spinal protection in extensive thoracic coverage."},{"h":"Planning & technique","items":["Ultrasound-guided access; pre-close where appropriate; confirm device orientation and landing zones.","Preserve/plan branch perfusion; consider debranching/fenestrated/branched strategy when needed.","Completion angiography: seal, branch patency, limb patency, endoleak assessment."],"text":"Planning & technique Ultrasound-guided access; pre-close where appropriate; confirm device orientation and landing zones. Preserve/plan branch perfusion; consider debranching/fenestrated/branched strategy when needed. Completion angiography: seal, branch patency, limb patency, endoleak assessment."},{"h":"Immediate post-care","items":["Haemodynamic, access and limb monitoring; renal function.","After TEVAR/extensive coverage: frequent neurological/leg examination and spinal-cord-ischaemia pathway."],"text":"Immediate post-care Haemodynamic, access and limb monitoring; renal function. After TEVAR/extensive coverage: frequent neurological/leg examination and spinal-cord-ischaemia pathway."},{"h":"Follow-up","items":["Cross-sectional or duplex-based surveillance per device/local protocol for migration, sac size and endoleak.","Differentiate endoleak type before treatment; type I/III generally demand repair, type II management depends on sac behaviour."],"text":"Follow-up Cross-sectional or duplex-based surveillance per device/local protocol for migration, sac size and endoleak. Differentiate endoleak type before treatment; type I/III generally demand repair, type II management depends on sac behaviour."},{"h":"Complications & rescue","items":["Type I/III endoleak → ballooning, extension cuffs, relining or branch/adjunctive repair.","Limb occlusion → thrombectomy/relining.","Access rupture → balloon control/covered stent/surgery.","Spinal cord ischaemia, stroke, renal injury, bowel/limb ischaemia, infection."],"text":"Complications & rescue Type I/III endoleak → ballooning, extension cuffs, relining or branch/adjunctive repair. Limb occlusion → thrombectomy/relining. Access rupture → balloon control/covered stent/surgery. Spinal cord ischaemia, stroke, renal injury, bowel/limb ischaemia, infection."},{"h":"EBIR pearls","items":["Know the endoleak types and which ones are high-pressure failures.","TEVAR viva: explicitly mention left subclavian and spinal cord strategy."],"text":"EBIR pearls Know the endoleak types and which ones are high-pressure failures. TEVAR viva: explicitly mention left subclavian and spinal cord strategy."}],"text":"evar / tevar b · vascular · 2.2.1.1.3 · high-yield endograft treatment of aortic aneurysmal and selected acute aortic syndromes with anatomy-driven planning and lifelong surveillance. indications aneurysm/dissection/traumatic aortic injury meeting guideline- and patient-specific intervention criteria. complicated type b dissection (e.g. rupture, malperfusion, refractory pain/hypertension) generally favours intervention. contraindications / cautions anatomy incompatible with safe proximal/distal seal or access without a feasible adjunctive strategy. uncorrectable infection/mycotic process is a major concern for standard endografting. caution: renal impairment, hostile access, short/angulated neck, branch-vessel coverage, connective tissue disease. work-up thin-slice arterial cta from relevant supra-aortic/visceral branches through femoral access vessels. measure landing zones, diameters, angulation, thrombus/calcification, branch origins and access calibre. fbc, renal function, coagulation; cardiac/anaesthetic risk; assess need for csf/spinal protection in extensive thoracic coverage. planning & technique ultrasound-guided access; pre-close where appropriate; confirm device orientation and landing zones. preserve/plan branch perfusion; consider debranching/fenestrated/branched strategy when needed. completion angiography: seal, branch patency, limb patency, endoleak assessment. immediate post-care haemodynamic, access and limb monitoring; renal function. after tevar/extensive coverage: frequent neurological/leg examination and spinal-cord-ischaemia pathway. follow-up cross-sectional or duplex-based surveillance per device/local protocol for migration, sac size and endoleak. differentiate endoleak type before treatment; type i/iii generally demand repair, type ii management depends on sac behaviour. complications & rescue type i/iii endoleak → ballooning, extension cuffs, relining or branch/adjunctive repair. limb occlusion → thrombectomy/relining. access rupture → balloon control/covered stent/surgery. spinal cord ischaemia, stroke, renal injury, bowel/limb ischaemia, infection. ebir pearls know the endoleak types and which ones are high-pressure failures. tevar viva: explicitly mention left subclavian and spinal cord strategy.","oncall":false,"high":true},{"id":"p-B-3","cat":"B","title":"Carotid artery stenting","sub":"B · Vascular · 2.2.1.1.4","summary":"Selected carotid revascularisation using cerebral protection, careful antiplatelet planning and peri-procedural neurological monitoring.","blocks":[{"h":"Indications","items":["Symptomatic or selected asymptomatic carotid stenosis when stenting is favoured over endarterectomy based on anatomy, comorbidity and MDT assessment."],"text":"Indications Symptomatic or selected asymptomatic carotid stenosis when stenting is favoured over endarterectomy based on anatomy, comorbidity and MDT assessment."},{"h":"Contraindications / cautions","items":["Inability to safely use required antiplatelet therapy.","Unfavourable arch/lesion anatomy, heavy calcification or thrombus may favour surgery/medical therapy.","Caution: marked bradyarrhythmia, recent large infarct/haemorrhagic risk."],"text":"Contraindications / cautions Inability to safely use required antiplatelet therapy. Unfavourable arch/lesion anatomy, heavy calcification or thrombus may favour surgery/medical therapy. Caution: marked bradyarrhythmia, recent large infarct/haemorrhagic risk."},{"h":"Work-up","items":["Neurological history/exam; quantify stenosis on duplex/CTA/MRA; evaluate intracranial circulation and arch anatomy.","DAPT plan, FBC/coagulation/renal function; review blood pressure and cardiac status."],"text":"Work-up Neurological history/exam; quantify stenosis on duplex/CTA/MRA; evaluate intracranial circulation and arch anatomy. DAPT plan, FBC/coagulation/renal function; review blood pressure and cardiac status."},{"h":"Planning & technique","items":["Use embolic protection when appropriate; minimise catheter/wire manipulation in arch and lesion.","Predilate selectively; deploy appropriately sized self-expanding stent; post-dilate only as needed.","Monitor HR/BP and neurological status throughout."],"text":"Planning & technique Use embolic protection when appropriate; minimise catheter/wire manipulation in arch and lesion. Predilate selectively; deploy appropriately sized self-expanding stent; post-dilate only as needed. Monitor HR/BP and neurological status throughout."},{"h":"Immediate post-care","items":["Close neurological and haemodynamic observation; treat hypotension/bradycardia.","Continue antiplatelet therapy per carotid protocol."],"text":"Immediate post-care Close neurological and haemodynamic observation; treat hypotension/bradycardia. Continue antiplatelet therapy per carotid protocol."},{"h":"Follow-up","items":["Clinical/neurological review and duplex surveillance for restenosis."],"text":"Follow-up Clinical/neurological review and duplex surveillance for restenosis."},{"h":"Complications & rescue","items":["Embolic stroke → immediate stroke pathway; intracranial imaging and thrombectomy where appropriate.","Hyperperfusion syndrome/ICH → urgent BP control and neurocritical care.","Bradycardia/hypotension from carotid sinus stimulation; access complications."],"text":"Complications & rescue Embolic stroke → immediate stroke pathway; intracranial imaging and thrombectomy where appropriate. Hyperperfusion syndrome/ICH → urgent BP control and neurocritical care. Bradycardia/hypotension from carotid sinus stimulation; access complications."},{"h":"EBIR pearls","items":["Patient selection versus endarterectomy is the core exam issue.","Preventing embolisation is more important than achieving a perfect angiographic waist."],"text":"EBIR pearls Patient selection versus endarterectomy is the core exam issue. Preventing embolisation is more important than achieving a perfect angiographic waist."}],"text":"carotid artery stenting b · vascular · 2.2.1.1.4 selected carotid revascularisation using cerebral protection, careful antiplatelet planning and peri-procedural neurological monitoring. indications symptomatic or selected asymptomatic carotid stenosis when stenting is favoured over endarterectomy based on anatomy, comorbidity and mdt assessment. contraindications / cautions inability to safely use required antiplatelet therapy. unfavourable arch/lesion anatomy, heavy calcification or thrombus may favour surgery/medical therapy. caution: marked bradyarrhythmia, recent large infarct/haemorrhagic risk. work-up neurological history/exam; quantify stenosis on duplex/cta/mra; evaluate intracranial circulation and arch anatomy. dapt plan, fbc/coagulation/renal function; review blood pressure and cardiac status. planning & technique use embolic protection when appropriate; minimise catheter/wire manipulation in arch and lesion. predilate selectively; deploy appropriately sized self-expanding stent; post-dilate only as needed. monitor hr/bp and neurological status throughout. immediate post-care close neurological and haemodynamic observation; treat hypotension/bradycardia. continue antiplatelet therapy per carotid protocol. follow-up clinical/neurological review and duplex surveillance for restenosis. complications & rescue embolic stroke → immediate stroke pathway; intracranial imaging and thrombectomy where appropriate. hyperperfusion syndrome/ich → urgent bp control and neurocritical care. bradycardia/hypotension from carotid sinus stimulation; access complications. ebir pearls patient selection versus endarterectomy is the core exam issue. preventing embolisation is more important than achieving a perfect angiographic waist.","oncall":false,"high":false},{"id":"p-B-4","cat":"B","title":"Mechanical thrombectomy for stroke","sub":"B · Vascular · 2.2.1.1.5 · ON-CALL","summary":"Syllabus-level stroke thrombectomy knowledge for body IR services that support neurointervention.","blocks":[{"h":"Indications","items":["Eligible large-vessel occlusion based on clinical severity, vascular imaging, time window and tissue imaging according to current stroke protocol."],"text":"Indications Eligible large-vessel occlusion based on clinical severity, vascular imaging, time window and tissue imaging according to current stroke protocol."},{"h":"Contraindications / cautions","items":["No treatable occlusion or imaging/clinical scenario where procedural risk outweighs expected benefit.","Do not delay reperfusion therapy for non-essential testing."],"text":"Contraindications / cautions No treatable occlusion or imaging/clinical scenario where procedural risk outweighs expected benefit. Do not delay reperfusion therapy for non-essential testing."},{"h":"Work-up","items":["Activate stroke team; NIHSS/last-known-well; non-contrast CT ± CTA and perfusion/tissue selection according to pathway.","Check anticoagulation, platelets/glucose/renal function only insofar as they do not cause avoidable delay."],"text":"Work-up Activate stroke team; NIHSS/last-known-well; non-contrast CT ± CTA and perfusion/tissue selection according to pathway. Check anticoagulation, platelets/glucose/renal function only insofar as they do not cause avoidable delay."},{"h":"Planning & technique","items":["Fast, atraumatic access; aspiration and/or stent-retriever strategy.","Aim for rapid complete reperfusion while limiting passes and distal embolisation."],"text":"Planning & technique Fast, atraumatic access; aspiration and/or stent-retriever strategy. Aim for rapid complete reperfusion while limiting passes and distal embolisation."},{"h":"Immediate post-care","items":["Neurocritical/stroke unit monitoring; BP targets and post-procedure imaging per stroke service."],"text":"Immediate post-care Neurocritical/stroke unit monitoring; BP targets and post-procedure imaging per stroke service."},{"h":"Follow-up","items":["Secondary stroke aetiology work-up and prevention."],"text":"Follow-up Secondary stroke aetiology work-up and prevention."},{"h":"Complications & rescue","items":["ICH/SAH, vessel perforation/dissection, distal embolisation, access complications."],"text":"Complications & rescue ICH/SAH, vessel perforation/dissection, distal embolisation, access complications."},{"h":"EBIR pearls","items":["Time-to-reperfusion is a treatment variable.","Know TICI conceptually and the importance of first-pass effect."],"text":"EBIR pearls Time-to-reperfusion is a treatment variable. Know TICI conceptually and the importance of first-pass effect."}],"text":"mechanical thrombectomy for stroke b · vascular · 2.2.1.1.5 · on-call syllabus-level stroke thrombectomy knowledge for body ir services that support neurointervention. indications eligible large-vessel occlusion based on clinical severity, vascular imaging, time window and tissue imaging according to current stroke protocol. contraindications / cautions no treatable occlusion or imaging/clinical scenario where procedural risk outweighs expected benefit. do not delay reperfusion therapy for non-essential testing. work-up activate stroke team; nihss/last-known-well; non-contrast ct ± cta and perfusion/tissue selection according to pathway. check anticoagulation, platelets/glucose/renal function only insofar as they do not cause avoidable delay. planning & technique fast, atraumatic access; aspiration and/or stent-retriever strategy. aim for rapid complete reperfusion while limiting passes and distal embolisation. immediate post-care neurocritical/stroke unit monitoring; bp targets and post-procedure imaging per stroke service. follow-up secondary stroke aetiology work-up and prevention. complications & rescue ich/sah, vessel perforation/dissection, distal embolisation, access complications. ebir pearls time-to-reperfusion is a treatment variable. know tici conceptually and the importance of first-pass effect.","oncall":true,"high":false},{"id":"p-B-5","cat":"B","title":"Vascular malformation embolotherapy","sub":"B · Vascular · 2.2.1.1.6","summary":"Flow- and anatomy-based treatment of vascular malformations using embolic/sclerosant agents within a multidisciplinary plan.","blocks":[{"h":"Indications","items":["Pain, bleeding, functional compromise, ulceration, high-output effects or pre-operative devascularisation in appropriately classified malformations."],"text":"Indications Pain, bleeding, functional compromise, ulceration, high-output effects or pre-operative devascularisation in appropriately classified malformations."},{"h":"Contraindications / cautions","items":["Incorrect lesion classification or no clear therapeutic endpoint.","Caution: lesions adjacent to critical nerves/skin, coagulopathy such as localised intravascular coagulopathy in venous malformations."],"text":"Contraindications / cautions Incorrect lesion classification or no clear therapeutic endpoint. Caution: lesions adjacent to critical nerves/skin, coagulopathy such as localised intravascular coagulopathy in venous malformations."},{"h":"Work-up","items":["Clinical exam including skin, limb overgrowth and functional symptoms.","US + MRI for low-flow lesions; CTA/angiography for high-flow anatomy as indicated.","FBC/coagulation; consider fibrinogen/D-dimer in extensive venous malformations."],"text":"Work-up Clinical exam including skin, limb overgrowth and functional symptoms. US + MRI for low-flow lesions; CTA/angiography for high-flow anatomy as indicated. FBC/coagulation; consider fibrinogen/D-dimer in extensive venous malformations."},{"h":"Planning & technique","items":["Treat the nidus/pathologic compartment, not merely proximal feeders.","Choose sclerosant/embolus based on flow and target; protect non-target arteries, skin and nerves.","Stage large lesions rather than pursuing unsafe single-session eradication."],"text":"Planning & technique Treat the nidus/pathologic compartment, not merely proximal feeders. Choose sclerosant/embolus based on flow and target; protect non-target arteries, skin and nerves. Stage large lesions rather than pursuing unsafe single-session eradication."},{"h":"Immediate post-care","items":["Analgesia, swelling/airway or compartment monitoring where relevant; thrombosis prophylaxis strategy in selected venous malformations."],"text":"Immediate post-care Analgesia, swelling/airway or compartment monitoring where relevant; thrombosis prophylaxis strategy in selected venous malformations."},{"h":"Follow-up","items":["Clinical + imaging assessment; repeat staged treatment if symptoms/target persist."],"text":"Follow-up Clinical + imaging assessment; repeat staged treatment if symptoms/target persist."},{"h":"Complications & rescue","items":["Skin necrosis, nerve injury, thrombosis/PE, haemoglobinuria with some sclerosants, non-target embolisation, cardiopulmonary collapse."],"text":"Complications & rescue Skin necrosis, nerve injury, thrombosis/PE, haemoglobinuria with some sclerosants, non-target embolisation, cardiopulmonary collapse."},{"h":"EBIR pearls","items":["First classify: tumour vs malformation, then high-flow vs low-flow.","For AVMs, proximal feeder occlusion alone invites recruitment."],"text":"EBIR pearls First classify: tumour vs malformation, then high-flow vs low-flow. For AVMs, proximal feeder occlusion alone invites recruitment."}],"text":"vascular malformation embolotherapy b · vascular · 2.2.1.1.6 flow- and anatomy-based treatment of vascular malformations using embolic/sclerosant agents within a multidisciplinary plan. indications pain, bleeding, functional compromise, ulceration, high-output effects or pre-operative devascularisation in appropriately classified malformations. contraindications / cautions incorrect lesion classification or no clear therapeutic endpoint. caution: lesions adjacent to critical nerves/skin, coagulopathy such as localised intravascular coagulopathy in venous malformations. work-up clinical exam including skin, limb overgrowth and functional symptoms. us + mri for low-flow lesions; cta/angiography for high-flow anatomy as indicated. fbc/coagulation; consider fibrinogen/d-dimer in extensive venous malformations. planning & technique treat the nidus/pathologic compartment, not merely proximal feeders. choose sclerosant/embolus based on flow and target; protect non-target arteries, skin and nerves. stage large lesions rather than pursuing unsafe single-session eradication. immediate post-care analgesia, swelling/airway or compartment monitoring where relevant; thrombosis prophylaxis strategy in selected venous malformations. follow-up clinical + imaging assessment; repeat staged treatment if symptoms/target persist. complications & rescue skin necrosis, nerve injury, thrombosis/pe, haemoglobinuria with some sclerosants, non-target embolisation, cardiopulmonary collapse. ebir pearls first classify: tumour vs malformation, then high-flow vs low-flow. for avms, proximal feeder occlusion alone invites recruitment.","oncall":false,"high":false},{"id":"p-B-6","cat":"B","title":"Trauma / pelvic arterial embolisation","sub":"B · Vascular · 2.2.1.1.7 · HIGH-YIELD · ON-CALL","summary":"Damage-control transarterial haemorrhage management integrated with resuscitation, surgery and trauma imaging.","blocks":[{"h":"Indications","items":["Active arterial haemorrhage, pseudoaneurysm, AV fistula or ongoing bleeding in a territory amenable to embolisation.","Pelvic fracture with arterial bleeding or persistent haemodynamic concern after appropriate trauma resuscitation."],"text":"Indications Active arterial haemorrhage, pseudoaneurysm, AV fistula or ongoing bleeding in a territory amenable to embolisation. Pelvic fracture with arterial bleeding or persistent haemodynamic concern after appropriate trauma resuscitation."},{"h":"Contraindications / cautions","items":["No absolute contraindication when life-saving; coagulopathy/renal impairment are managed in parallel rather than used to deny necessary embolisation."],"text":"Contraindications / cautions No absolute contraindication when life-saving; coagulopathy/renal impairment are managed in parallel rather than used to deny necessary embolisation."},{"h":"Work-up","items":["Parallel massive-haemorrhage resuscitation; review arterial-phase CT and clinical bleeding source.","FBC/coagulation/fibrinogen, group &amp; crossmatch, renal function if time permits.","Agree damage-control endpoint with trauma/surgical team."],"text":"Work-up Parallel massive-haemorrhage resuscitation; review arterial-phase CT and clinical bleeding source. FBC/coagulation/fibrinogen, group & crossmatch, renal function if time permits. Agree damage-control endpoint with trauma/surgical team."},{"h":"Planning & technique","items":["Fast access; target selective embolisation when stable and anatomy permits, broader empiric embolisation when shock demands speed.","Choose temporary vs permanent embolic according to vessel, injury and collateral supply.","Always perform a final angiographic survey for additional bleeding and collateral sources."],"text":"Planning & technique Fast access; target selective embolisation when stable and anatomy permits, broader empiric embolisation when shock demands speed. Choose temporary vs permanent embolic according to vessel, injury and collateral supply. Always perform a final angiographic survey for additional bleeding and collateral sources."},{"h":"Immediate post-care","items":["ICU/trauma monitoring, haemoglobin/coagulation, transfusion response, access site and organ ischaemia."],"text":"Immediate post-care ICU/trauma monitoring, haemoglobin/coagulation, transfusion response, access site and organ ischaemia."},{"h":"Follow-up","items":["Re-image for recurrent bleeding, falling Hb or new organ dysfunction."],"text":"Follow-up Re-image for recurrent bleeding, falling Hb or new organ dysfunction."},{"h":"Complications & rescue","items":["Non-target ischaemia/necrosis, rebleeding, access injury, contrast injury.","Pelvic embolisation: gluteal/skin/organ ischaemia and sexual dysfunction are uncommon but recognised."],"text":"Complications & rescue Non-target ischaemia/necrosis, rebleeding, access injury, contrast injury. Pelvic embolisation: gluteal/skin/organ ischaemia and sexual dysfunction are uncommon but recognised."},{"h":"EBIR pearls","items":["In shock, the correct answer often prioritises speed and physiology over superselectivity.","Negative angiography does not exclude intermittent bleeding—use CT/anatomic clues."],"text":"EBIR pearls In shock, the correct answer often prioritises speed and physiology over superselectivity. Negative angiography does not exclude intermittent bleeding—use CT/anatomic clues."}],"text":"trauma / pelvic arterial embolisation b · vascular · 2.2.1.1.7 · high-yield · on-call damage-control transarterial haemorrhage management integrated with resuscitation, surgery and trauma imaging. indications active arterial haemorrhage, pseudoaneurysm, av fistula or ongoing bleeding in a territory amenable to embolisation. pelvic fracture with arterial bleeding or persistent haemodynamic concern after appropriate trauma resuscitation. contraindications / cautions no absolute contraindication when life-saving; coagulopathy/renal impairment are managed in parallel rather than used to deny necessary embolisation. work-up parallel massive-haemorrhage resuscitation; review arterial-phase ct and clinical bleeding source. fbc/coagulation/fibrinogen, group & crossmatch, renal function if time permits. agree damage-control endpoint with trauma/surgical team. planning & technique fast access; target selective embolisation when stable and anatomy permits, broader empiric embolisation when shock demands speed. choose temporary vs permanent embolic according to vessel, injury and collateral supply. always perform a final angiographic survey for additional bleeding and collateral sources. immediate post-care icu/trauma monitoring, haemoglobin/coagulation, transfusion response, access site and organ ischaemia. follow-up re-image for recurrent bleeding, falling hb or new organ dysfunction. complications & rescue non-target ischaemia/necrosis, rebleeding, access injury, contrast injury. pelvic embolisation: gluteal/skin/organ ischaemia and sexual dysfunction are uncommon but recognised. ebir pearls in shock, the correct answer often prioritises speed and physiology over superselectivity. negative angiography does not exclude intermittent bleeding—use ct/anatomic clues.","oncall":true,"high":true},{"id":"p-B-7","cat":"B","title":"Visceral haemorrhage embolisation","sub":"B · Vascular · 2.2.1.1.8 · HIGH-YIELD · ON-CALL","summary":"Endovascular control of upper/lower GI, postoperative, pancreatic, renal and other visceral arterial bleeding.","blocks":[{"h":"Indications","items":["Active extravasation, pseudoaneurysm, arterial fistula or suspected arterial bleeding after failed/unsuitable endoscopic or surgical management."],"text":"Indications Active extravasation, pseudoaneurysm, arterial fistula or suspected arterial bleeding after failed/unsuitable endoscopic or surgical management."},{"h":"Contraindications / cautions","items":["No absolute contraindication in life-threatening bleeding. Caution with severe diffuse vasculopathy or when embolisation would sacrifice an end-artery without acceptable collateral supply."],"text":"Contraindications / cautions No absolute contraindication in life-threatening bleeding. Caution with severe diffuse vasculopathy or when embolisation would sacrifice an end-artery without acceptable collateral supply."},{"h":"Work-up","items":["Resuscitate first; review multiphase CTA for site and vessel.","FBC/coagulation/fibrinogen, renal function, crossmatch; correct coagulopathy in parallel if possible.","Understand prior surgery and altered arterial anatomy."],"text":"Work-up Resuscitate first; review multiphase CTA for site and vessel. FBC/coagulation/fibrinogen, renal function, crossmatch; correct coagulopathy in parallel if possible. Understand prior surgery and altered arterial anatomy."},{"h":"Planning & technique","items":["Catheterise culprit territory; use superselective microcatheter when stable.","For pseudoaneurysm with accessible inflow/outflow, “sandwich” embolisation prevents retrograde collateral filling.","Empiric embolisation can be appropriate when CTA/endoscopy localises a lesion but angiography is negative."],"text":"Planning & technique Catheterise culprit territory; use superselective microcatheter when stable. For pseudoaneurysm with accessible inflow/outflow, “sandwich” embolisation prevents retrograde collateral filling. Empiric embolisation can be appropriate when CTA/endoscopy localises a lesion but angiography is negative."},{"h":"Immediate post-care","items":["Monitor Hb, vitals, pain, lactate and organ-specific ischaemia; resume antithrombotics when haemostasis permits."],"text":"Immediate post-care Monitor Hb, vitals, pain, lactate and organ-specific ischaemia; resume antithrombotics when haemostasis permits."},{"h":"Follow-up","items":["Repeat CTA/angiography if recurrent haemorrhage. Treat underlying cause (ulcer, tumour, pancreatitis, iatrogenic injury)."],"text":"Follow-up Repeat CTA/angiography if recurrent haemorrhage. Treat underlying cause (ulcer, tumour, pancreatitis, iatrogenic injury)."},{"h":"Complications & rescue","items":["Bowel/solid-organ ischaemia or infarction, non-target embolisation, recurrent bleeding, coil migration, access injury."],"text":"Complications & rescue Bowel/solid-organ ischaemia or infarction, non-target embolisation, recurrent bleeding, coil migration, access injury."},{"h":"EBIR pearls","items":["Pseudoaneurysm: think inflow + outflow, not simply packing the sac.","In GI bleeding, prior endoscopic clips can be valuable fluoroscopic landmarks."],"text":"EBIR pearls Pseudoaneurysm: think inflow + outflow, not simply packing the sac. In GI bleeding, prior endoscopic clips can be valuable fluoroscopic landmarks."}],"text":"visceral haemorrhage embolisation b · vascular · 2.2.1.1.8 · high-yield · on-call endovascular control of upper/lower gi, postoperative, pancreatic, renal and other visceral arterial bleeding. indications active extravasation, pseudoaneurysm, arterial fistula or suspected arterial bleeding after failed/unsuitable endoscopic or surgical management. contraindications / cautions no absolute contraindication in life-threatening bleeding. caution with severe diffuse vasculopathy or when embolisation would sacrifice an end-artery without acceptable collateral supply. work-up resuscitate first; review multiphase cta for site and vessel. fbc/coagulation/fibrinogen, renal function, crossmatch; correct coagulopathy in parallel if possible. understand prior surgery and altered arterial anatomy. planning & technique catheterise culprit territory; use superselective microcatheter when stable. for pseudoaneurysm with accessible inflow/outflow, “sandwich” embolisation prevents retrograde collateral filling. empiric embolisation can be appropriate when cta/endoscopy localises a lesion but angiography is negative. immediate post-care monitor hb, vitals, pain, lactate and organ-specific ischaemia; resume antithrombotics when haemostasis permits. follow-up repeat cta/angiography if recurrent haemorrhage. treat underlying cause (ulcer, tumour, pancreatitis, iatrogenic injury). complications & rescue bowel/solid-organ ischaemia or infarction, non-target embolisation, recurrent bleeding, coil migration, access injury. ebir pearls pseudoaneurysm: think inflow + outflow, not simply packing the sac. in gi bleeding, prior endoscopic clips can be valuable fluoroscopic landmarks.","oncall":true,"high":true},{"id":"p-B-8","cat":"B","title":"Bronchial artery embolisation","sub":"B · Vascular · 2.2.1.1.8 · HIGH-YIELD · ON-CALL","summary":"Life-saving treatment of significant haemoptysis with meticulous search for bronchial and non-bronchial systemic supply.","blocks":[{"h":"Indications","items":["Life-threatening or recurrent clinically significant haemoptysis with a systemic arterial source."],"text":"Indications Life-threatening or recurrent clinically significant haemoptysis with a systemic arterial source."},{"h":"Contraindications / cautions","items":["No absolute contraindication in life-threatening haemoptysis.","Caution: unsafe spinal arterial supply arising from the target branch; severe contrast reaction/renal dysfunction balanced against urgency."],"text":"Contraindications / cautions No absolute contraindication in life-threatening haemoptysis. Caution: unsafe spinal arterial supply arising from the target branch; severe contrast reaction/renal dysfunction balanced against urgency."},{"h":"Work-up","items":["Airway and haemodynamic stabilisation; identify bleeding side if possible.","CTA chest to map hypertrophied bronchial and non-bronchial systemic arteries, culprit lesion and pulmonary arterial causes.","FBC/coagulation/crossmatch; treat infection/coagulopathy in parallel."],"text":"Work-up Airway and haemodynamic stabilisation; identify bleeding side if possible. CTA chest to map hypertrophied bronchial and non-bronchial systemic arteries, culprit lesion and pulmonary arterial causes. FBC/coagulation/crossmatch; treat infection/coagulopathy in parallel."},{"h":"Planning & technique","items":["Interrogate bronchial and relevant non-bronchial systemic arteries.","Superselect beyond spinal branches; avoid particulate sizes/agents associated with unsafe passage into critical collaterals according to local SOP.","Embolise abnormal hypervascularity, shunting, aneurysm or extravasation to stasis/near-stasis."],"text":"Planning & technique Interrogate bronchial and relevant non-bronchial systemic arteries. Superselect beyond spinal branches; avoid particulate sizes/agents associated with unsafe passage into critical collaterals according to local SOP. Embolise abnormal hypervascularity, shunting, aneurysm or extravasation to stasis/near-stasis."},{"h":"Immediate post-care","items":["Monitor respiratory status, chest pain, dysphagia and neurological symptoms."],"text":"Immediate post-care Monitor respiratory status, chest pain, dysphagia and neurological symptoms."},{"h":"Follow-up","items":["Treat underlying disease; recurrence warrants repeat CTA/angiography and search for missed non-bronchial supply."],"text":"Follow-up Treat underlying disease; recurrence warrants repeat CTA/angiography and search for missed non-bronchial supply."},{"h":"Complications & rescue","items":["Spinal cord ischaemia is the feared complication → stop immediately, urgent neuro assessment/supportive pathway.","Non-target oesophageal/bronchial ischaemia, stroke (rare), chest pain/dysphagia, recurrence."],"text":"Complications & rescue Spinal cord ischaemia is the feared complication → stop immediately, urgent neuro assessment/supportive pathway. Non-target oesophageal/bronchial ischaemia, stroke (rare), chest pain/dysphagia, recurrence."},{"h":"EBIR pearls","items":["Before injecting, actively look for spinal supply.","Recurrent haemoptysis often reflects collateral recruitment or untreated non-bronchial systemic arteries."],"text":"EBIR pearls Before injecting, actively look for spinal supply. Recurrent haemoptysis often reflects collateral recruitment or untreated non-bronchial systemic arteries."}],"text":"bronchial artery embolisation b · vascular · 2.2.1.1.8 · high-yield · on-call life-saving treatment of significant haemoptysis with meticulous search for bronchial and non-bronchial systemic supply. indications life-threatening or recurrent clinically significant haemoptysis with a systemic arterial source. contraindications / cautions no absolute contraindication in life-threatening haemoptysis. caution: unsafe spinal arterial supply arising from the target branch; severe contrast reaction/renal dysfunction balanced against urgency. work-up airway and haemodynamic stabilisation; identify bleeding side if possible. cta chest to map hypertrophied bronchial and non-bronchial systemic arteries, culprit lesion and pulmonary arterial causes. fbc/coagulation/crossmatch; treat infection/coagulopathy in parallel. planning & technique interrogate bronchial and relevant non-bronchial systemic arteries. superselect beyond spinal branches; avoid particulate sizes/agents associated with unsafe passage into critical collaterals according to local sop. embolise abnormal hypervascularity, shunting, aneurysm or extravasation to stasis/near-stasis. immediate post-care monitor respiratory status, chest pain, dysphagia and neurological symptoms. follow-up treat underlying disease; recurrence warrants repeat cta/angiography and search for missed non-bronchial supply. complications & rescue spinal cord ischaemia is the feared complication → stop immediately, urgent neuro assessment/supportive pathway. non-target oesophageal/bronchial ischaemia, stroke (rare), chest pain/dysphagia, recurrence. ebir pearls before injecting, actively look for spinal supply. recurrent haemoptysis often reflects collateral recruitment or untreated non-bronchial systemic arteries.","oncall":true,"high":true},{"id":"p-B-9","cat":"B","title":"Uterine artery embolisation (fibroids)","sub":"B · Vascular · 2.2.1.1.9 · HIGH-YIELD","summary":"Uterine-preserving treatment of symptomatic leiomyomata with pre-procedure gynaecologic assessment and post-embolisation care.","blocks":[{"h":"Indications","items":["Bulk symptoms and/or heavy menstrual bleeding from fibroids in an appropriately counselled patient."],"text":"Indications Bulk symptoms and/or heavy menstrual bleeding from fibroids in an appropriately counselled patient."},{"h":"Contraindications / cautions","items":["Pregnancy, active pelvic infection, suspected uterine/adnexal malignancy.","Relative: asymptomatic fibroids, severe contrast allergy, uncorrectable coagulopathy; fertility goals require nuanced counselling."],"text":"Contraindications / cautions Pregnancy, active pelvic infection, suspected uterine/adnexal malignancy. Relative: asymptomatic fibroids, severe contrast allergy, uncorrectable coagulopathy; fertility goals require nuanced counselling."},{"h":"Work-up","items":["Gynaecology review and up-to-date cervical/endometrial assessment as clinically indicated.","Pelvic MRI (or high-quality ultrasound) to confirm fibroids, exclude alternative pathology and assess adenomyosis/pedunculated morphology.","FBC, pregnancy test, renal/coagulation testing as appropriate."],"text":"Work-up Gynaecology review and up-to-date cervical/endometrial assessment as clinically indicated. Pelvic MRI (or high-quality ultrasound) to confirm fibroids, exclude alternative pathology and assess adenomyosis/pedunculated morphology. FBC, pregnancy test, renal/coagulation testing as appropriate."},{"h":"Planning & technique","items":["Bilateral uterine artery catheterisation; embolise fibroid vascularity to accepted angiographic endpoint while avoiding cervicovaginal/ovarian non-target embolisation."],"text":"Planning & technique Bilateral uterine artery catheterisation; embolise fibroid vascularity to accepted angiographic endpoint while avoiding cervicovaginal/ovarian non-target embolisation."},{"h":"Immediate post-care","items":["Aggressive multimodal analgesia/antiemetic plan; monitor post-embolisation syndrome, urinary retention and infection."],"text":"Immediate post-care Aggressive multimodal analgesia/antiemetic plan; monitor post-embolisation syndrome, urinary retention and infection."},{"h":"Follow-up","items":["Clinical review around 1–3 months; MRI/US if symptoms persist or local protocol requires."],"text":"Follow-up Clinical review around 1–3 months; MRI/US if symptoms persist or local protocol requires."},{"h":"Complications & rescue","items":["Post-embolisation syndrome, infection/endometritis, fibroid expulsion, transient/permanent amenorrhoea, non-target ovarian embolisation, rare uterine necrosis."],"text":"Complications & rescue Post-embolisation syndrome, infection/endometritis, fibroid expulsion, transient/permanent amenorrhoea, non-target ovarian embolisation, rare uterine necrosis."},{"h":"EBIR pearls","items":["MRI is valuable because not every “fibroid symptom” is a fibroid problem.","Consent must include the possibility of amenorrhoea/ovarian dysfunction and fibroid expulsion."],"text":"EBIR pearls MRI is valuable because not every “fibroid symptom” is a fibroid problem. Consent must include the possibility of amenorrhoea/ovarian dysfunction and fibroid expulsion."}],"text":"uterine artery embolisation (fibroids) b · vascular · 2.2.1.1.9 · high-yield uterine-preserving treatment of symptomatic leiomyomata with pre-procedure gynaecologic assessment and post-embolisation care. indications bulk symptoms and/or heavy menstrual bleeding from fibroids in an appropriately counselled patient. contraindications / cautions pregnancy, active pelvic infection, suspected uterine/adnexal malignancy. relative: asymptomatic fibroids, severe contrast allergy, uncorrectable coagulopathy; fertility goals require nuanced counselling. work-up gynaecology review and up-to-date cervical/endometrial assessment as clinically indicated. pelvic mri (or high-quality ultrasound) to confirm fibroids, exclude alternative pathology and assess adenomyosis/pedunculated morphology. fbc, pregnancy test, renal/coagulation testing as appropriate. planning & technique bilateral uterine artery catheterisation; embolise fibroid vascularity to accepted angiographic endpoint while avoiding cervicovaginal/ovarian non-target embolisation. immediate post-care aggressive multimodal analgesia/antiemetic plan; monitor post-embolisation syndrome, urinary retention and infection. follow-up clinical review around 1–3 months; mri/us if symptoms persist or local protocol requires. complications & rescue post-embolisation syndrome, infection/endometritis, fibroid expulsion, transient/permanent amenorrhoea, non-target ovarian embolisation, rare uterine necrosis. ebir pearls mri is valuable because not every “fibroid symptom” is a fibroid problem. consent must include the possibility of amenorrhoea/ovarian dysfunction and fibroid expulsion.","oncall":false,"high":true},{"id":"p-B-10","cat":"B","title":"Prostatic artery embolisation","sub":"B · Vascular · 2.2.1.2 · HIGH-YIELD","summary":"Endovascular BPH therapy requiring urologic selection, pelvic arterial mapping and careful non-target protection.","blocks":[{"h":"Indications","items":["Moderate/severe lower urinary tract symptoms due to BPH with inadequate/undesired medical therapy and preference or risk profile favouring PAE.","Selected catheter-dependent retention or haematuria related to BPH."],"text":"Indications Moderate/severe lower urinary tract symptoms due to BPH with inadequate/undesired medical therapy and preference or risk profile favouring PAE. Selected catheter-dependent retention or haematuria related to BPH."},{"h":"Contraindications / cautions","items":["Prostate cancer or alternative pathology not adequately evaluated.","Severe arterial anatomy precluding safe catheterisation; active UTI; uncorrectable coagulopathy."],"text":"Contraindications / cautions Prostate cancer or alternative pathology not adequately evaluated. Severe arterial anatomy precluding safe catheterisation; active UTI; uncorrectable coagulopathy."},{"h":"Work-up","items":["Urology assessment: symptom score, QoL, PSA/DRE ± further cancer work-up, prostate volume, flow/PVR as applicable.","CTA/MRA or cone-beam CT strategy for pelvic arterial anatomy; renal/coagulation/FBC and urine infection assessment."],"text":"Work-up Urology assessment: symptom score, QoL, PSA/DRE ± further cancer work-up, prostate volume, flow/PVR as applicable. CTA/MRA or cone-beam CT strategy for pelvic arterial anatomy; renal/coagulation/FBC and urine infection assessment."},{"h":"Planning & technique","items":["Superselect prostatic arteries, confirm territory with angiography/CBCT when available.","Protect rectal, bladder and penile collaterals; slow embolisation to near-stasis using locally accepted particle strategy.","Treat bilaterally where feasible."],"text":"Planning & technique Superselect prostatic arteries, confirm territory with angiography/CBCT when available. Protect rectal, bladder and penile collaterals; slow embolisation to near-stasis using locally accepted particle strategy. Treat bilaterally where feasible."},{"h":"Immediate post-care","items":["Analgesia/NSAID if appropriate, urinary symptoms, dysuria/haematuria, infection and retention monitoring."],"text":"Immediate post-care Analgesia/NSAID if appropriate, urinary symptoms, dysuria/haematuria, infection and retention monitoring."},{"h":"Follow-up","items":["Symptom score, flow/PVR and medication/catheter status at interval urologic/IR follow-up."],"text":"Follow-up Symptom score, flow/PVR and medication/catheter status at interval urologic/IR follow-up."},{"h":"Complications & rescue","items":["Post-embolisation pelvic pain/dysuria, UTI, urinary retention, haematuria/haematospermia.","Non-target rectal/bladder/penile ischaemia is the key preventable complication."],"text":"Complications & rescue Post-embolisation pelvic pain/dysuria, UTI, urinary retention, haematuria/haematospermia. Non-target rectal/bladder/penile ischaemia is the key preventable complication."},{"h":"EBIR pearls","items":["PAE is a clinical service, not just bilateral embolisation: exclude cancer and quantify symptoms.","CBCT can be more valuable for avoiding non-target embolisation than for showing off anatomy."],"text":"EBIR pearls PAE is a clinical service, not just bilateral embolisation: exclude cancer and quantify symptoms. CBCT can be more valuable for avoiding non-target embolisation than for showing off anatomy."}],"text":"prostatic artery embolisation b · vascular · 2.2.1.2 · high-yield endovascular bph therapy requiring urologic selection, pelvic arterial mapping and careful non-target protection. indications moderate/severe lower urinary tract symptoms due to bph with inadequate/undesired medical therapy and preference or risk profile favouring pae. selected catheter-dependent retention or haematuria related to bph. contraindications / cautions prostate cancer or alternative pathology not adequately evaluated. severe arterial anatomy precluding safe catheterisation; active uti; uncorrectable coagulopathy. work-up urology assessment: symptom score, qol, psa/dre ± further cancer work-up, prostate volume, flow/pvr as applicable. cta/mra or cone-beam ct strategy for pelvic arterial anatomy; renal/coagulation/fbc and urine infection assessment. planning & technique superselect prostatic arteries, confirm territory with angiography/cbct when available. protect rectal, bladder and penile collaterals; slow embolisation to near-stasis using locally accepted particle strategy. treat bilaterally where feasible. immediate post-care analgesia/nsaid if appropriate, urinary symptoms, dysuria/haematuria, infection and retention monitoring. follow-up symptom score, flow/pvr and medication/catheter status at interval urologic/ir follow-up. complications & rescue post-emb
