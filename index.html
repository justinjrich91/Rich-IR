 const items=[['procedures','Procedures','▦'],['oncall','On-call','⚡'],['viva','EBIR viva','?'],['notes','Note builder','✎'],['about','About','i']];

 $('#mobile').innerHTML=items.map(x=>`<button data-view="${x[0]}" class="${state.view===x[0]?'active':''}"><b style="font-size:17px;display:block">${x[2]}</b>${x[1]}</button>`).join('');
 $$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

 $$('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;state.special=null;state.selected=null;renderProcedures();navs()});
 $$('[data-special]').forEach(b=>b.onclick=()=>{state.special=b.dataset.special;state.cat='all';state.selected=null;renderProcedures();navs()});
}
function setView(v){state.view=v;state.selected=null;$$('.section').forEach(s=>s.classList.toggle('active',s.id===v));navs(); if(v==='procedures')renderProcedures();if(v==='oncall')renderOncall();if(v==='viva')renderViva();if(v==='notes')renderNotes();if(v==='about')renderAbout()}
function filtered(){return state.procedures.filter(p=>{
 if(state.cat!=='all'&&p.cat!==state.cat)return false;
 if(state.special==='oncall'&&!p.oncall)return false;if(state.special==='high'&&!p.high)return false;if(state.special==='fav'&&!fav.has(p.id))return false;if(state.special==='studied'&&!studied.has(p.id))return false;
 return !state.q||p.text.includes(state.q.toLowerCase());
})}
function card(p){return `<article class="card" data-open="${esc(p.id)}"><button class="star ${fav.has(p.id)?'on':''}" data-star="${esc(p.id)}">★</button><div class="tag">${esc(p.cat)} · ${esc(CATS[p.cat])}</div><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="badges">${p.high?'<span>HIGH-YIELD</span>':''}${p.oncall?'<span>ON-CALL</span>':''}${studied.has(p.id)?'<span>STUDIED</span>':''}</div></article>`}
function renderProcedures(){
 $('#procedureDetail').classList.remove('active');$('#procedureHome').style.display='block';
 const list=filtered(), pct=Math.round(studied.size/Math.max(1,state.procedures.length)*100);
 $('#procedureHome').innerHTML=`<div class="hero"><div class="box"><div class="eyebrow">IR fellow · EBIR fieldbook</div><h2>Clinical pathways built around how you actually manage the case.</h2><p>Work-up → indication → contraindications → planning → technique → endpoint → complications → follow-up, aligned to the CIRSE/EBIR syllabus.</p></div><div class="stats"><div class="box stat"><b>${state.procedures.length}</b><span>reference cards</span></div><div class="box stat"><b>${fav.size}</b><span>favourites</span></div><div class="box stat"><b>${studied.size}</b><span>studied</span></div><div class="box stat"><b>${pct}%</b><span>study coverage</span></div></div></div><div class="toolbar"><button class="chip ${state.special===null&&state.cat==='all'?'active':''}" data-quick="all">All</button><button class="chip ${state.special==='oncall'?'active':''}" data-quick="oncall">⚡ On-call</button><button class="chip ${state.special==='high'?'active':''}" data-quick="high">◆ High-yield</button><button class="chip ${state.special==='fav'?'active':''}" data-quick="fav">★ Favourites</button><button class="chip ${state.special==='studied'?'active':''}" data-quick="studied">✓ Studied</button><span class="count">${list.length} shown</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">No procedures match this filter/search.</div>'}`;
 $$('[data-open]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-star]'))return;openDetail(x.dataset.open)});$$('[data-star]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleFav(x.dataset.star);renderProcedures()});$$('[data-quick]').forEach(b=>b.onclick=()=>{const v=b.dataset.quick;state.cat='all';state.special=v==='all'?null:v;renderProcedures();navs()});
}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);save()}
function openDetail(id){const p=state.procedures.find(x=>x.id===id);if(!p)return;state.selected=id;$('#procedureHome').style.display='none';const d=$('#procedureDetail');d.classList.add('active');d.innerHTML=`<button class="back" id="back">← Back to procedures</button><div class="detailhead"><div><div class="eyebrow">${esc(CATS[p.cat])} · ${esc(p.sub)}</div><h2>${esc(p.title)}</h2><div class="muted" style="font-size:12px">${esc(p.summary)}</div></div><div class="actions"><button class="btn" id="favBtn">${fav.has(p.id)?'★ Favourite':'☆ Favourite'}</button><button class="btn" id="studyBtn">${studied.has(p.id)?'✓ Studied':'Mark studied'}</button></div></div><div class="detailgrid">${p.blocks.map((b,i)=>`<section class="dcard ${p.blocks.length%2&&i===p.blocks.length-1?'full':''}"><h3>${esc(b.h)}</h3>${b.items.length?`<ul>${b.items.map(li=>`<li>${li}</li>`).join('')}</ul>`:''}</section>`).join('')}</div>`;$('#back').onclick=renderProcedures;$('#favBtn').onclick=()=>{toggleFav(p.id);openDetail(p.id)};$('#studyBtn').onclick=()=>{studied.has(p.id)?studied.delete(p.id):studied.add(p.id);save();openDetail(p.id)};window.scrollTo({top:0,behavior:'smooth'})}
function renderOncall(){const em=state.procedures.filter(p=>p.oncall);const checks=['Confirm the exact clinical problem, urgency and whether IR is the correct treatment now.','Review the actual imaging yourself: target, access, culprit vessel/duct, anatomy and pitfalls.','Assess haemodynamic/respiratory stability; coordinate resuscitation, airway, surgery or endoscopy in parallel when required.','Check relevant Hb/platelets/coagulation, renal function/electrolytes and crossmatch; do not delay life-saving treatment for non-essential tests.','Reconcile anticoagulants/antiplatelets and the reversal strategy while balancing thrombosis risk.','If infection is involved: cultures when feasible, effective antibiotics and a source-control plan.','Consent/capacity or emergency treatment basis; document major procedure-specific risks.','Plan anaesthesia/sedation, analgesia, monitoring and post-procedure destination.','Name the bailout equipment before starting: covered stent, balloon, embolics, larger sheath, drain/chest tube, resuscitation support.','Define ownership and follow-up before leaving IR.'];$('#oncall').innerHTML=`<div class="topic"><div class="eyebrow">On-call mode</div><h3>One-minute acceptance checklist</h3><div class="checklist">${checks.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}"><span>${x}</span></label>`).join('')}</div><button class="btn" id="resetChecks" style="margin-top:10px">Reset</button></div><div class="topic"><h3>Emergency procedure cards</h3><div class="grid">${em.map(card).join('')}</div></div>`;$$('[data-check]').forEach(x=>x.onchange=()=>x.closest('.check').classList.toggle('done',x.checked));$('#resetChecks').onclick=()=>$$('[data-check]').forEach(x=>{x.checked=false;x.closest('.check').classList.remove('done')});$$('[data-open]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-star]'))return;setView('procedures');openDetail(x.dataset.open)});$$('[data-star]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleFav(x.dataset.star);renderOncall()})}
function renderViva(){if(!state.vivas.length){$('#viva').innerHTML='<div class="empty">No viva prompts found.</div>';return}const q=state.vivas[Math.floor(Math.random()*state.vivas.length)],pct=Math.round(studied.size/Math.max(1,state.procedures.length)*100);$('#viva').innerHTML=`<div class="topic quiz"><div class="eyebrow">EBIR viva mode</div><div class="quizq">${esc(q[0])}</div><button class="btn" id="showAnswer">Show answer</button> <button class="btn" id="nextQuestion">New question</button><div class="answer" id="answer">${q[1]}</div></div><div class="topic"><h3>Study coverage</h3><p>${studied.size} of ${state.procedures.length} procedure cards marked studied.</p><div class="progress"><span style="width:${pct}%"></span></div></div><div class="topic"><h3>Six-part EBIR answer structure</h3><ol><li><b>Problem + indication:</b> define the syndrome and reason to intervene.</li><li><b>Selection:</b> alternatives, contraindications, physiology, staging and MDT context.</li><li><b>Work-up:</b> imaging and labs that change the plan.</li><li><b>Technique:</b> access, key technical principles and intended endpoint.</li><li><b>Complications:</b> recognise the major complication and state the rescue manoeuvre.</li><li><b>Aftercare:</b> monitoring, medicines, imaging and who owns follow-up.</li></ol></div>`;$('#showAnswer').onclick=()=>$('#answer').classList.toggle('show');$('#nextQuestion').onclick=renderViva}
function noteTemplate(){return `INTERVENTIONAL RADIOLOGY PROCEDURE NOTE\n\nProcedure:\nIndication / clinical question:\nReferring team / discussion:\nConsent:\n\nPRE-PROCEDURE\n- Imaging reviewed:\n- Relevant labs / renal function / coagulation:\n- Anticoagulants / antiplatelets:\n- Allergies / infection / antibiotics:\n- Sedation / anaesthesia plan:\n\nTECHNIQUE\n- Guidance:\n- Access / side:\n- Key catheters / wires / devices / embolic / drain:\n- Findings:\n- Treatment performed:\n- Technical endpoint / completion imaging:\n\nComplications:\nEstimated blood loss:\nSpecimens:\n\nPOST-PROCEDURE PLAN\n- Observations / bedrest / neurovascular checks:\n- Analgesia / antibiotics / antithrombotics:\n- Labs / imaging:\n- Drain / line instructions:\n- Escalation triggers:\n\nFOLLOW-UP / OWNERSHIP:\n`}
function renderNotes(){const saved=safeGet('irNote',noteTemplate());$('#notes').innerHTML=`<div class="topic"><div class="eyebrow">Procedure note builder</div><h3>Reusable IR procedure note</h3><p>Draft locally in your browser. Do not enter identifiable patient information on a personal device unless permitted by your institution.</p><textarea class="notearea" id="noteArea">${esc(saved)}</textarea><div style="margin-top:9px"><button class="btn" id="copyNote">Copy</button> <button class="btn" id="resetNote">Reset</button></div></div>`;const a=$('#noteArea');a.oninput=()=>safeSet('irNote',a.value);$('#resetNote').onclick=()=>{a.value=noteTemplate();safeSet('irNote',a.value)};$('#copyNote').onclick=async()=>{try{await navigator.clipboard.writeText(a.value);toast('Note copied')}catch(e){a.select();document.execCommand('copy');toast('Note copied')}}}
function renderAbout(){$('#about').innerHTML=`<div class="topic"><div class="eyebrow">Scope</div><h3>EBIR-aligned clinical fieldbook</h3><p>This hosted app uses the procedure content from the preview-safe fieldbook and adds browser-side search, filtering and local study tools. It is designed for rapid fellow-level revision and case preparation, not as a substitute for local SOPs, multidisciplinary judgement, current CIRSE Standards of Practice or device IFUs.</p></div><div class="topic"><h3>Privacy & local storage</h3><p>Favourites, studied status, theme and the note-builder text are stored in this browser using localStorage. No server or database is used by this app.</p></div><div class="topic"><h3>Source framework</h3><p>Primary structure: CIRSE European Curriculum and Syllabus for Interventional Radiology, Third Edition, with the clinical-practice framework and procedure-specific standards referenced in the underlying fieldbook.</p></div>`}
function initSearch(){const s=$('#search');s.oninput=()=>{state.q=s.value.trim();if(state.view!=='procedures')setView('procedures');else renderProcedures()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();s.focus()}if(e.key==='Escape'&&state.selected)renderProcedures()})}
async function init(){document.documentElement.dataset.theme=safeGet('irTheme','dark');$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;safeSet('irTheme',n)};try{await loadSource();navs();renderProcedures();renderOncall();renderViva();renderNotes();renderAbout();initSearch()}catch(e){$('#procedureHome').innerHTML=`<div class="empty"><b>Could not load the fieldbook source.</b><br>${esc(e.message)}<br><br><a href="./" style="color:var(--accent)">Reload app</a></div>`;navs()}}
init();
</script>
</body>
</html>
