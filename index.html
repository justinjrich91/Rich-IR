ection. fbc, inr/platelets, lft/bilirubin, renal function, sepsis markers/blood cultures; antibiotic coverage. decide external vs internal-external vs primary stenting and which segments actually require drainage. planning & technique us-guided peripheral duct puncture; avoid central hilar puncture where possible. cross obstruction when safe; cholangiography should be limited in infected obstruction to avoid pressurising undrained ducts. secure drain with sideholes spanning intended segments; staged metallic stenting for malignant obstruction when indicated. immediate post-care monitor sepsis, bile output, fluid/electrolyte loss, haemobilia and drain position. flush/cap only according to documented protocol and clinical condition. follow-up trend bilirubin/lfts and symptoms; cholangiogram/exchange/stent pathway. persistent fever after unilateral hilar drainage may mean an undrained infected segment. complications & rescue sepsis/cholangitis, haemobilia/arterial injury, bile leak/peritonitis, pleural transgression, drain dislodgement, pancreatitis. ebir pearls in hilar obstruction, “drain the liver” is too simplistic—drain functional segments and avoid contaminating undrained ducts.","oncall":true,"high":true},{"id":"p-C-7","cat":"C","title":"Percutaneous cholecystostomy","sub":"C · Non-vascular · 2.2.2.5 · ON-CALL","summary":"Gallbladder decompression for selected acute cholecystitis patients who are poor immediate surgical candidates.","blocks":[{"h":"Indications","items":["Acute cholecystitis with sepsis/organ dysfunction or failure of conservative therapy when urgent cholecystectomy is not suitable."],"text":"Indications Acute cholecystitis with sepsis/organ dysfunction or failure of conservative therapy when urgent cholecystectomy is not suitable."},{"h":"Contraindications / cautions","items":["No clear clinical cholecystitis; correctable surgical indication may be better served by surgery.","Caution: severe coagulopathy, massive ascites."],"text":"Contraindications / cautions No clear clinical cholecystitis; correctable surgical indication may be better served by surgery. Caution: severe coagulopathy, massive ascites."},{"h":"Work-up","items":["US/CT confirmation; surgical/medical assessment of operative risk.","FBC/coagulation/LFTs, blood cultures/antibiotics; assess gallstones, perforation and biliary obstruction."],"text":"Work-up US/CT confirmation; surgical/medical assessment of operative risk. FBC/coagulation/LFTs, blood cultures/antibiotics; assess gallstones, perforation and biliary obstruction."},{"h":"Planning & technique","items":["Transhepatic route often provides stability/tamponade; transperitoneal may be appropriate depending on anatomy.","Aspirate bile for culture and confirm intraluminal position."],"text":"Planning & technique Transhepatic route often provides stability/tamponade; transperitoneal may be appropriate depending on anatomy. Aspirate bile for culture and confirm intraluminal position."},{"h":"Immediate post-care","items":["Monitor sepsis response and bile output; flush/secure drain."],"text":"Immediate post-care Monitor sepsis response and bile output; flush/secure drain."},{"h":"Follow-up","items":["Cholangiogram and tube-removal strategy after clinical resolution; plan definitive cholecystectomy or long-term drain strategy with surgery."],"text":"Follow-up Cholangiogram and tube-removal strategy after clinical resolution; plan definitive cholecystectomy or long-term drain strategy with surgery."},{"h":"Complications & rescue","items":["Bleeding, bile leak/peritonitis, catheter dislodgement, sepsis, bowel injury."],"text":"Complications & rescue Bleeding, bile leak/peritonitis, catheter dislodgement, sepsis, bowel injury."},{"h":"EBIR pearls","items":["The procedure is a bridge or destination therapy only after you define what happens to the gallbladder next."],"text":"EBIR pearls The procedure is a bridge or destination therapy only after you define what happens to the gallbladder next."}],"text":"percutaneous cholecystostomy c · non-vascular · 2.2.2.5 · on-call gallbladder decompression for selected acute cholecystitis patients who are poor immediate surgical candidates. indications acute cholecystitis with sepsis/organ dysfunction or failure of conservative therapy when urgent cholecystectomy is not suitable. contraindications / cautions no clear clinical cholecystitis; correctable surgical indication may be better served by surgery. caution: severe coagulopathy, massive ascites. work-up us/ct confirmation; surgical/medical assessment of operative risk. fbc/coagulation/lfts, blood cultures/antibiotics; assess gallstones, perforation and biliary obstruction. planning & technique transhepatic route often provides stability/tamponade; transperitoneal may be appropriate depending on anatomy. aspirate bile for culture and confirm intraluminal position. immediate post-care monitor sepsis response and bile output; flush/secure drain. follow-up cholangiogram and tube-removal strategy after clinical resolution; plan definitive cholecystectomy or long-term drain strategy with surgery. complications & rescue bleeding, bile leak/peritonitis, catheter dislodgement, sepsis, bowel injury. ebir pearls the procedure is a bridge or destination therapy only after you define what happens to the gallbladder next.","oncall":true,"high":false},{"id":"p-D-0","cat":"D","title":"Percutaneous nephrostomy","sub":"D · GU / transplant · 2.2.3.1 · HIGH-YIELD · ON-CALL","summary":"Urgent or elective upper-tract decompression with infection-aware technique, safe calyceal access and planned conversion/exchange.","blocks":[{"h":"Indications","items":["Obstructed infected system/pyonephrosis (urgent decompression).","Malignant/benign obstruction, urinary diversion, access for stone/ureteric intervention, urinary leak."],"text":"Indications Obstructed infected system/pyonephrosis (urgent decompression). Malignant/benign obstruction, urinary diversion, access for stone/ureteric intervention, urinary leak."},{"h":"Contraindications / cautions","items":["No absolute contraindication in life-threatening infected obstruction; bleeding risk should be corrected when possible.","Caution: uncooperative patient without safe anaesthesia, complex renal anatomy."],"text":"Contraindications / cautions No absolute contraindication in life-threatening infected obstruction; bleeding risk should be corrected when possible. Caution: uncooperative patient without safe anaesthesia, complex renal anatomy."},{"h":"Work-up","items":["US/CT for hydronephrosis, stone/mass level, kidney position and bowel/pleura.","FBC, INR/platelets, renal function/electrolytes, urine/blood cultures; antibiotics for infected system."],"text":"Work-up US/CT for hydronephrosis, stone/mass level, kidney position and bowel/pleura. FBC, INR/platelets, renal function/electrolytes, urine/blood cultures; antibiotics for infected system."},{"h":"Planning & technique","items":["Posterolateral calyceal puncture, ideally via a posterior calyx; avoid direct pelvic puncture where possible.","Minimal manipulation/contrast in pyonephrosis; secure pigtail with all sideholes in collecting system."],"text":"Planning & technique Posterolateral calyceal puncture, ideally via a posterior calyx; avoid direct pelvic puncture where possible. Minimal manipulation/contrast in pyonephrosis; secure pigtail with all sideholes in collecting system."},{"h":"Immediate post-care","items":["Monitor urine output, haematuria, sepsis and post-obstructive diuresis/electrolytes.","Clear nephrostomy-care and flushing instructions."],"text":"Immediate post-care Monitor urine output, haematuria, sepsis and post-obstructive diuresis/electrolytes. Clear nephrostomy-care and flushing instructions."},{"h":"Follow-up","items":["Plan nephrostogram, antegrade stent or definitive stone/oncologic treatment; scheduled exchange for long-term tubes."],"text":"Follow-up Plan nephrostogram, antegrade stent or definitive stone/oncologic treatment; scheduled exchange for long-term tubes."},{"h":"Complications & rescue","items":["Sepsis, haemorrhage/pseudoaneurysm/AVF, pleural injury, bowel injury, catheter dislodgement/blockage."],"text":"Complications & rescue Sepsis, haemorrhage/pseudoaneurysm/AVF, pleural injury, bowel injury, catheter dislodgement/blockage."},{"h":"EBIR pearls","items":["In an infected obstructed system, decompress gently—do not perform a heroic diagnostic pyelogram."],"text":"EBIR pearls In an infected obstructed system, decompress gently—do not perform a heroic diagnostic pyelogram."}],"text":"percutaneous nephrostomy d · gu / transplant · 2.2.3.1 · high-yield · on-call urgent or elective upper-tract decompression with infection-aware technique, safe calyceal access and planned conversion/exchange. indications obstructed infected system/pyonephrosis (urgent decompression). malignant/benign obstruction, urinary diversion, access for stone/ureteric intervention, urinary leak. contraindications / cautions no absolute contraindication in life-threatening infected obstruction; bleeding risk should be corrected when possible. caution: uncooperative patient without safe anaesthesia, complex renal anatomy. work-up us/ct for hydronephrosis, stone/mass level, kidney position and bowel/pleura. fbc, inr/platelets, renal function/electrolytes, urine/blood cultures; antibiotics for infected system. planning & technique posterolateral calyceal puncture, ideally via a posterior calyx; avoid direct pelvic puncture where possible. minimal manipulation/contrast in pyonephrosis; secure pigtail with all sideholes in collecting system. immediate post-care monitor urine output, haematuria, sepsis and post-obstructive diuresis/electrolytes. clear nephrostomy-care and flushing instructions. follow-up plan nephrostogram, antegrade stent or definitive stone/oncologic treatment; scheduled exchange for long-term tubes. complications & rescue sepsis, haemorrhage/pseudoaneurysm/avf, pleural injury, bowel injury, catheter dislodgement/blockage. ebir pearls in an infected obstructed system, decompress gently—do not perform a heroic diagnostic pyelogram.","oncall":true,"high":true},{"id":"p-D-1","cat":"D","title":"Antegrade ureteric stent / nephroureteric stent","sub":"D · GU / transplant · 2.2.3.1","summary":"Internalisation of upper-tract drainage after or during percutaneous access with attention to crossing the obstruction and ensuring drainage.","blocks":[{"h":"Indications","items":["Benign or malignant ureteric obstruction where internal drainage is desired and retrograde access failed/is unsuitable.","Urinary leak/fistula requiring diversion."],"text":"Indications Benign or malignant ureteric obstruction where internal drainage is desired and retrograde access failed/is unsuitable. Urinary leak/fistula requiring diversion."},{"h":"Contraindications / cautions","items":["Active uncontrolled urosepsis may favour simple nephrostomy first, with staged internalisation."],"text":"Contraindications / cautions Active uncontrolled urosepsis may favour simple nephrostomy first, with staged internalisation."},{"h":"Work-up","items":["Define obstruction length/cause and renal function; urine culture/antibiotic plan.","Review bladder access and ureteric anatomy."],"text":"Work-up Define obstruction length/cause and renal function; urine culture/antibiotic plan. Review bladder access and ureteric anatomy."},{"h":"Planning & technique","items":["Cross obstruction atraumatically; ensure distal loop in bladder and proximal loop in renal pelvis for JJ stent.","For NUS, sideholes must bridge intended collecting system and urinary tract."],"text":"Planning & technique Cross obstruction atraumatically; ensure distal loop in bladder and proximal loop in renal pelvis for JJ stent. For NUS, sideholes must bridge intended collecting system and urinary tract."},{"h":"Immediate post-care","items":["Monitor sepsis, haematuria, flank/bladder symptoms and urine output."],"text":"Immediate post-care Monitor sepsis, haematuria, flank/bladder symptoms and urine output."},{"h":"Follow-up","items":["Exchange interval and removal/definitive treatment plan; assess encrustation risk."],"text":"Follow-up Exchange interval and removal/definitive treatment plan; assess encrustation risk."},{"h":"Complications & rescue","items":["Urosepsis, ureteric perforation, malposition/migration, encrustation/occlusion, haemorrhage."],"text":"Complications & rescue Urosepsis, ureteric perforation, malposition/migration, encrustation/occlusion, haemorrhage."},{"h":"EBIR pearls","items":["In septic obstruction, “drain first, internalise later” is often the safest sequencing."],"text":"EBIR pearls In septic obstruction, “drain first, internalise later” is often the safest sequencing."}],"text":"antegrade ureteric stent / nephroureteric stent d · gu / transplant · 2.2.3.1 internalisation of upper-tract drainage after or during percutaneous access with attention to crossing the obstruction and ensuring drainage. indications benign or malignant ureteric obstruction where internal drainage is desired and retrograde access failed/is unsuitable. urinary leak/fistula requiring diversion. contraindications / cautions active uncontrolled urosepsis may favour simple nephrostomy first, with staged internalisation. work-up define obstruction length/cause and renal function; urine culture/antibiotic plan. review bladder access and ureteric anatomy. planning & technique cross obstruction atraumatically; ensure distal loop in bladder and proximal loop in renal pelvis for jj stent. for nus, sideholes must bridge intended collecting system and urinary tract. immediate post-care monitor sepsis, haematuria, flank/bladder symptoms and urine output. follow-up exchange interval and removal/definitive treatment plan; assess encrustation risk. complications & rescue urosepsis, ureteric perforation, malposition/migration, encrustation/occlusion, haemorrhage. ebir pearls in septic obstruction, “drain first, internalise later” is often the safest sequencing.","oncall":false,"high":false},{"id":"p-D-2","cat":"D","title":"Renal transplant intervention","sub":"D · GU / transplant · 2.2.3.5","summary":"Image-guided treatment of transplant ureteric obstruction and vascular complications with anatomy distinct from native kidneys.","blocks":[{"h":"Indications","items":["Transplant renal artery stenosis with clinical graft dysfunction/hypertension and supportive imaging.","Transplant ureteric obstruction/leak requiring decompression or stenting.","Selected post-biopsy vascular complications."],"text":"Indications Transplant renal artery stenosis with clinical graft dysfunction/hypertension and supportive imaging. Transplant ureteric obstruction/leak requiring decompression or stenting. Selected post-biopsy vascular complications."},{"h":"Contraindications / cautions","items":["No haemodynamically/clinically significant lesion; graft dysfunction due to rejection/toxicity rather than treatable obstruction/stenosis."],"text":"Contraindications / cautions No haemodynamically/clinically significant lesion; graft dysfunction due to rejection/toxicity rather than treatable obstruction/stenosis."},{"h":"Work-up","items":["Doppler US first-line; CTA/MRA or nuclear studies selectively.","Renal function, electrolytes, FBC/coagulation, urine infection status.","Know surgical anastomosis and ureteric implantation."],"text":"Work-up Doppler US first-line; CTA/MRA or nuclear studies selectively. Renal function, electrolytes, FBC/coagulation, urine infection status. Know surgical anastomosis and ureteric implantation."},{"h":"Planning & technique","items":["Arterial: selective angiography, pressure gradient where useful, angioplasty ± stent.","Urinary: US-guided anterior transplant calyx access; nephrostomy then antegrade ureteric intervention."],"text":"Planning & technique Arterial: selective angiography, pressure gradient where useful, angioplasty ± stent. Urinary: US-guided anterior transplant calyx access; nephrostomy then antegrade ureteric intervention."},{"h":"Immediate post-care","items":["Graft function, urine output, haematuria, BP and access monitoring."],"text":"Immediate post-care Graft function, urine output, haematuria, BP and access monitoring."},{"h":"Follow-up","items":["Doppler/renal function surveillance; transplant nephrology/urology follow-up."],"text":"Follow-up Doppler/renal function surveillance; transplant nephrology/urology follow-up."},{"h":"Complications & rescue","items":["Arterial dissection/rupture, graft infarction, haemorrhage, urosepsis, ureteric injury."],"text":"Complications & rescue Arterial dissection/rupture, graft infarction, haemorrhage, urosepsis, ureteric injury."},{"h":"EBIR pearls","items":["Transplant nephrostomy access is anterior and superficial—do not apply native-kidney geometry blindly."],"text":"EBIR pearls Transplant nephrostomy access is anterior and superficial—do not apply native-kidney geometry blindly."}],"text":"renal transplant intervention d · gu / transplant · 2.2.3.5 image-guided treatment of transplant ureteric obstruction and vascular complications with anatomy distinct from native kidneys. indications transplant renal artery stenosis with clinical graft dysfunction/hypertension and supportive imaging. transplant ureteric obstruction/leak requiring decompression or stenting. selected post-biopsy vascular complications. contraindications / cautions no haemodynamically/clinically significant lesion; graft dysfunction due to rejection/toxicity rather than treatable obstruction/stenosis. work-up doppler us first-line; cta/mra or nuclear studies selectively. renal function, electrolytes, fbc/coagulation, urine infection status. know surgical anastomosis and ureteric implantation. planning & technique arterial: selective angiography, pressure gradient where useful, angioplasty ± stent. urinary: us-guided anterior transplant calyx access; nephrostomy then antegrade ureteric intervention. immediate post-care graft function, urine output, haematuria, bp and access monitoring. follow-up doppler/renal function surveillance; transplant nephrology/urology follow-up. complications & rescue arterial dissection/rupture, graft infarction, haemorrhage, urosepsis, ureteric injury. ebir pearls transplant nephrostomy access is anterior and superficial—do not apply native-kidney geometry blindly.","oncall":false,"high":false},{"id":"p-D-3","cat":"D","title":"Renal / perirenal collection drainage","sub":"D · GU / transplant · 2.2.3.3","summary":"Drainage of urinoma, renal/perirenal abscess or symptomatic collection integrated with urinary diversion when a leak persists.","blocks":[{"h":"Indications","items":["Infected or symptomatic perirenal collection; urinoma with ongoing leak requiring source control."],"text":"Indications Infected or symptomatic perirenal collection; urinoma with ongoing leak requiring source control."},{"h":"Contraindications / cautions","items":["Small sterile asymptomatic collection likely to resolve; unsafe access."],"text":"Contraindications / cautions Small sterile asymptomatic collection likely to resolve; unsafe access."},{"h":"Work-up","items":["Contrast imaging to distinguish abscess, urinoma, haematoma and relationship to collecting system.","FBC/coagulation/renal function; culture plan."],"text":"Work-up Contrast imaging to distinguish abscess, urinoma, haematoma and relationship to collecting system. FBC/coagulation/renal function; culture plan."},{"h":"Planning & technique","items":["Safe retroperitoneal route; drain dependent component.","If urinoma persists, address the leak with nephrostomy/ureteric stent rather than simply upsizing the drain."],"text":"Planning & technique Safe retroperitoneal route; drain dependent component. If urinoma persists, address the leak with nephrostomy/ureteric stent rather than simply upsizing the drain."},{"h":"Immediate post-care","items":["Output volume/creatinine if urine leak suspected; sepsis and renal function."],"text":"Immediate post-care Output volume/creatinine if urine leak suspected; sepsis and renal function."},{"h":"Follow-up","items":["Drain study or cross-sectional imaging for persistent output."],"text":"Follow-up Drain study or cross-sectional imaging for persistent output."},{"h":"Complications & rescue","items":["Bleeding, renal/pleural/bowel injury, persistent fistula, infection."],"text":"Complications & rescue Bleeding, renal/pleural/bowel injury, persistent fistula, infection."},{"h":"EBIR pearls","items":["A urinoma drain treats the collection; urinary diversion treats the cause."],"text":"EBIR pearls A urinoma drain treats the collection; urinary diversion treats the cause."}],"text":"renal / perirenal collection drainage d · gu / transplant · 2.2.3.3 drainage of urinoma, renal/perirenal abscess or symptomatic collection integrated with urinary diversion when a leak persists. indications infected or symptomatic perirenal collection; urinoma with ongoing leak requiring source control. contraindications / cautions small sterile asymptomatic collection likely to resolve; unsafe access. work-up contrast imaging to distinguish abscess, urinoma, haematoma and relationship to collecting system. fbc/coagulation/renal function; culture plan. planning & technique safe retroperitoneal route; drain dependent component. if urinoma persists, address the leak with nephrostomy/ureteric stent rather than simply upsizing the drain. immediate post-care output volume/creatinine if urine leak suspected; sepsis and renal function. follow-up drain study or cross-sectional imaging for persistent output. complications & rescue bleeding, renal/pleural/bowel injury, persistent fistula, infection. ebir pearls a urinoma drain treats the collection; urinary diversion treats the cause.","oncall":false,"high":false},{"id":"p-E-0","cat":"E","title":"MSK bone / soft-tissue biopsy","sub":"E · MSK · 2.2.4.1 · HIGH-YIELD","summary":"Oncologically planned biopsy respecting compartments and the future surgical resection plane.","blocks":[{"h":"Indications","items":["Indeterminate bone/soft-tissue lesion where histology will change management."],"text":"Indications Indeterminate bone/soft-tissue lesion where histology will change management."},{"h":"Contraindications / cautions","items":["Biopsy before adequate imaging/staging or without surgical oncology planning when primary sarcoma is possible.","Unsafe route through neurovascular structures or uninvolved compartments."],"text":"Contraindications / cautions Biopsy before adequate imaging/staging or without surgical oncology planning when primary sarcoma is possible. Unsafe route through neurovascular structures or uninvolved compartments."},{"h":"Work-up","items":["MRI/CT review and MDT plan; select viable enhancing target, avoiding necrosis.","Confirm pathology/microbiology needs; FBC/coagulation."],"text":"Work-up MRI/CT review and MDT plan; select viable enhancing target, avoiding necrosis. Confirm pathology/microbiology needs; FBC/coagulation."},{"h":"Planning & technique","items":["Coaxial approach where useful; traverse the compartment that would be resected with tumour.","Avoid crossing joints, neurovascular bundles and multiple compartments; label samples correctly."],"text":"Planning & technique Coaxial approach where useful; traverse the compartment that would be resected with tumour. Avoid crossing joints, neurovascular bundles and multiple compartments; label samples correctly."},{"h":"Immediate post-care","items":["Pain/bleeding monitoring; neurovascular exam where relevant."],"text":"Immediate post-care Pain/bleeding monitoring; neurovascular exam where relevant."},{"h":"Follow-up","items":["Track adequacy and MDT review; ensure biopsy tract is documented for surgical planning."],"text":"Follow-up Track adequacy and MDT review; ensure biopsy tract is documented for surgical planning."},{"h":"Complications & rescue","items":["Haemorrhage, fracture, infection, neurovascular injury, tumour contamination of inappropriate biopsy tract."],"text":"Complications & rescue Haemorrhage, fracture, infection, neurovascular injury, tumour contamination of inappropriate biopsy tract."},{"h":"EBIR pearls","items":["The safest geometric route is not necessarily the oncologically correct route—coordinate with the surgeon."],"text":"EBIR pearls The safest geometric route is not necessarily the oncologically correct route—coordinate with the surgeon."}],"text":"msk bone / soft-tissue biopsy e · msk · 2.2.4.1 · high-yield oncologically planned biopsy respecting compartments and the future surgical resection plane. indications indeterminate bone/soft-tissue lesion where histology will change management. contraindications / cautions biopsy before adequate imaging/staging or without surgical oncology planning when primary sarcoma is possible. unsafe route through neurovascular structures or uninvolved compartments. work-up mri/ct review and mdt plan; select viable enhancing target, avoiding necrosis. confirm pathology/microbiology needs; fbc/coagulation. planning & technique coaxial approach where useful; traverse the compartment that would be resected with tumour. avoid crossing joints, neurovascular bundles and multiple compartments; label samples correctly. immediate post-care pain/bleeding monitoring; neurovascular exam where relevant. follow-up track adequacy and mdt review; ensure biopsy tract is documented for surgical planning. complications & rescue haemorrhage, fracture, infection, neurovascular injury, tumour contamination of inappropriate biopsy tract. ebir pearls the safest geometric route is not necessarily the oncologically correct route—coordinate with the surgeon.","oncall":false,"high":true},{"id":"p-E-1","cat":"E","title":"Vertebroplasty / cementoplasty","sub":"E · MSK · 2.2.4.4–5","summary":"Percutaneous cement augmentation for selected painful structural lesions with careful clinical-radiologic correlation and cement-leak prevention.","blocks":[{"h":"Indications","items":["Selected painful vertebral compression fractures refractory to appropriate conservative care.","Painful osteolytic lesions requiring structural augmentation, often combined with ablation."],"text":"Indications Selected painful vertebral compression fractures refractory to appropriate conservative care. Painful osteolytic lesions requiring structural augmentation, often combined with ablation."},{"h":"Contraindications / cautions","items":["Asymptomatic fracture, uncontrolled infection, uncorrectable coagulopathy.","Relative: unstable burst fracture with significant retropulsion/neurologic compromise, severe canal compromise."],"text":"Contraindications / cautions Asymptomatic fracture, uncontrolled infection, uncorrectable coagulopathy. Relative: unstable burst fracture with significant retropulsion/neurologic compromise, severe canal compromise."},{"h":"Work-up","items":["MRI/CT to confirm symptomatic level, acuity, posterior wall and neural anatomy.","Clinical localisation of pain; FBC/coagulation and infection assessment."],"text":"Work-up MRI/CT to confirm symptomatic level, acuity, posterior wall and neural anatomy. Clinical localisation of pain; FBC/coagulation and infection assessment."},{"h":"Planning & technique","items":["Transpedicular/parapedicular access as appropriate; high-viscosity cement under continuous imaging.","Stop for epidural/venous/discal extraosseous leak or adequate fill—do not chase complete vertebral opacification."],"text":"Planning & technique Transpedicular/parapedicular access as appropriate; high-viscosity cement under continuous imaging. Stop for epidural/venous/discal extraosseous leak or adequate fill—do not chase complete vertebral opacification."},{"h":"Immediate post-care","items":["Neurological exam and pain assessment; mobilise according to local protocol."],"text":"Immediate post-care Neurological exam and pain assessment; mobilise according to local protocol."},{"h":"Follow-up","items":["Clinical response; image for new neurological symptoms or recurrent pain."],"text":"Follow-up Clinical response; image for new neurological symptoms or recurrent pain."},{"h":"Complications & rescue","items":["Cement leak causing radiculopathy/spinal cord compression, pulmonary cement emboli, infection, bleeding, adjacent fracture."],"text":"Complications & rescue Cement leak causing radiculopathy/spinal cord compression, pulmonary cement emboli, infection, bleeding, adjacent fracture."},{"h":"EBIR pearls","items":["Treat the patient’s pain generator, not an MRI finding."],"text":"EBIR pearls Treat the patient’s pain generator, not an MRI finding."}],"text":"vertebroplasty / cementoplasty e · msk · 2.2.4.4–5 percutaneous cement augmentation for selected painful structural lesions with careful clinical-radiologic correlation and cement-leak prevention. indications selected painful vertebral compression fractures refractory to appropriate conservative care. painful osteolytic lesions requiring structural augmentation, often combined with ablation. contraindications / cautions asymptomatic fracture, uncontrolled infection, uncorrectable coagulopathy. relative: unstable burst fracture with significant retropulsion/neurologic compromise, severe canal compromise. work-up mri/ct to confirm symptomatic level, acuity, posterior wall and neural anatomy. clinical localisation of pain; fbc/coagulation and infection assessment. planning & technique transpedicular/parapedicular access as appropriate; high-viscosity cement under continuous imaging. stop for epidural/venous/discal extraosseous leak or adequate fill—do not chase complete vertebral opacification. immediate post-care neurological exam and pain assessment; mobilise according to local protocol. follow-up clinical response; image for new neurological symptoms or recurrent pain. complications & rescue cement leak causing radiculopathy/spinal cord compression, pulmonary cement emboli, infection, bleeding, adjacent fracture. ebir pearls treat the patient’s pain generator, not an mri finding.","oncall":false,"high":false},{"id":"p-E-2","cat":"E","title":"Spinal injection / nerve root / facet intervention","sub":"E · MSK · 2.2.4.5.2","summary":"Targeted diagnostic or therapeutic spinal injection with strict attention to level, needle position and drug safety.","blocks":[{"h":"Indications","items":["Selected radicular or facet-mediated pain where image-guided injection is clinically appropriate."],"text":"Indications Selected radicular or facet-mediated pain where image-guided injection is clinically appropriate."},{"h":"Contraindications / cautions","items":["Local/systemic infection, uncorrectable coagulopathy, no clinical-radiologic target.","Caution with particulate steroid in high-risk arterial territories according to local safety practice."],"text":"Contraindications / cautions Local/systemic infection, uncorrectable coagulopathy, no clinical-radiologic target. Caution with particulate steroid in high-risk arterial territories according to local safety practice."},{"h":"Work-up","items":["Clinical pain pattern + MRI/CT correlation; antithrombotic review and neurological baseline."],"text":"Work-up Clinical pain pattern + MRI/CT correlation; antithrombotic review and neurological baseline."},{"h":"Planning & technique","items":["Use image guidance and contrast confirmation where appropriate before therapeutic injectate.","Avoid intravascular/intrathecal injection; use small test injection and local spinal safety protocol."],"text":"Planning & technique Use image guidance and contrast confirmation where appropriate before therapeutic injectate. Avoid intravascular/intrathecal injection; use small test injection and local spinal safety protocol."},{"h":"Immediate post-care","items":["Short observation; document neuro status and post-injection warning symptoms."],"text":"Immediate post-care Short observation; document neuro status and post-injection warning symptoms."},{"h":"Follow-up","items":["Assess diagnostic and therapeutic response; avoid repetitive procedures without benefit."],"text":"Follow-up Assess diagnostic and therapeutic response; avoid repetitive procedures without benefit."},{"h":"Complications & rescue","items":["Epidural haematoma/abscess, nerve injury, inadvertent intrathecal or arterial injection, steroid effects."],"text":"Complications & rescue Epidural haematoma/abscess, nerve injury, inadvertent intrathecal or arterial injection, steroid effects."},{"h":"EBIR pearls","items":["A diagnostic block is only useful if the pre- and post-block clinical question is defined."],"text":"EBIR pearls A diagnostic block is only useful if the pre- and post-block clinical question is defined."}],"text":"spinal injection / nerve root / facet intervention e · msk · 2.2.4.5.2 targeted diagnostic or therapeutic spinal injection with strict attention to level, needle position and drug safety. indications selected radicular or facet-mediated pain where image-guided injection is clinically appropriate. contraindications / cautions local/systemic infection, uncorrectable coagulopathy, no clinical-radiologic target. caution with particulate steroid in high-risk arterial territories according to local safety practice. work-up clinical pain pattern + mri/ct correlation; antithrombotic review and neurological baseline. planning & technique use image guidance and contrast confirmation where appropriate before therapeutic injectate. avoid intravascular/intrathecal injection; use small test injection and local spinal safety protocol. immediate post-care short observation; document neuro status and post-injection warning symptoms. follow-up assess diagnostic and therapeutic response; avoid repetitive procedures without benefit. complications & rescue epidural haematoma/abscess, nerve injury, inadvertent intrathecal or arterial injection, steroid effects. ebir pearls a diagnostic block is only useful if the pre- and post-block clinical question is defined.","oncall":false,"high":false},{"id":"p-F-0","cat":"F","title":"TACE","sub":"F · Interventional oncology · 2.2.5.2 · HIGH-YIELD","summary":"Arterial locoregional therapy balancing tumour control with preservation of non-tumour liver and integration with systemic/surgical options.","blocks":[{"h":"Indications","items":["Commonly used for selected unresectable liver-dominant tumours, especially HCC according to stage, liver reserve and MDT strategy.","Can be used in selected metastatic disease depending on tumour biology and treatment pathway."],"text":"Indications Commonly used for selected unresectable liver-dominant tumours, especially HCC according to stage, liver reserve and MDT strategy. Can be used in selected metastatic disease depending on tumour biology and treatment pathway."},{"h":"Contraindications / cautions","items":["Decompensated liver failure, severe portal-flow compromise without a safe strategy, uncontrolled infection, extensive tumour burden where benefit is unlikely.","Relative: severe renal dysfunction, biliary-enteric anastomosis/high infection risk, poor performance status."],"text":"Contraindications / cautions Decompensated liver failure, severe portal-flow compromise without a safe strategy, uncontrolled infection, extensive tumour burden where benefit is unlikely. Relative: severe renal dysfunction, biliary-enteric anastomosis/high infection risk, poor performance status."},{"h":"Work-up","items":["MDT indication; multiphase CT/MRI, tumour distribution and arterial anatomy.","Liver reserve: bilirubin/albumin/INR, ascites/encephalopathy, renal function, FBC; performance status.","Review portal vein patency and prior biliary intervention; prophylactic antibiotic strategy in high-risk biliary colonisation."],"text":"Work-up MDT indication; multiphase CT/MRI, tumour distribution and arterial anatomy. Liver reserve: bilirubin/albumin/INR, ascites/encephalopathy, renal function, FBC; performance status. Review portal vein patency and prior biliary intervention; prophylactic antibiotic strategy in high-risk biliary colonisation."},{"h":"Planning & technique","items":["Selective/superselective catheterisation whenever feasible.","Deliver conventional or drug-eluting chemoembolisation strategy according to tumour and local protocol; avoid reflux/non-target flow.","Endpoint is adequate tumour arterial devascularisation/near stasis without excessive normal-liver embolisation."],"text":"Planning & technique Selective/superselective catheterisation whenever feasible. Deliver conventional or drug-eluting chemoembolisation strategy according to tumour and local protocol; avoid reflux/non-target flow. Endpoint is adequate tumour arterial devascularisation/near stasis without excessive normal-liver embolisation."},{"h":"Immediate post-care","items":["Pain/antiemetic care; monitor post-embolisation syndrome, LFTs, fever and hepatic decompensation."],"text":"Immediate post-care Pain/antiemetic care; monitor post-embolisation syndrome, LFTs, fever and hepatic decompensation."},{"h":"Follow-up","items":["Cross-sectional response assessment using enhancement-based criteria and liver function, commonly around 4–8 weeks depending on pathway.","Retreat only if residual viable tumour and liver reserve/overall strategy support it."],"text":"Follow-up Cross-sectional response assessment using enhancement-based criteria and liver function, commonly around 4–8 weeks depending on pathway. Retreat only if residual viable tumour and liver reserve/overall strategy support it."},{"h":"Complications & rescue","items":["Post-embolisation syndrome, liver failure, abscess (higher with biliary instrumentation), cholecystitis, pancreatitis, non-target GI injury, arterial damage."],"text":"Complications & rescue Post-embolisation syndrome, liver failure, abscess (higher with biliary instrumentation), cholecystitis, pancreatitis, non-target GI injury, arterial damage."},{"h":"EBIR pearls","items":["Tumour response is about viable enhancement, not just size.","Superselective treatment preserves future liver options."],"text":"EBIR pearls Tumour response is about viable enhancement, not just size. Superselective treatment preserves future liver options."}],"text":"tace f · interventional oncology · 2.2.5.2 · high-yield arterial locoregional therapy balancing tumour control with preservation of non-tumour liver and integration with systemic/surgical options. indications commonly used for selected unresectable liver-dominant tumours, especially hcc according to stage, liver reserve and mdt strategy. can be used in selected metastatic disease depending on tumour biology and treatment pathway. contraindications / cautions decompensated liver failure, severe portal-flow compromise without a safe strategy, uncontrolled infection, extensive tumour burden where benefit is unlikely. relative: severe renal dysfunction, biliary-enteric anastomosis/high infection risk, poor performance status. work-up mdt indication; multiphase ct/mri, tumour distribution and arterial anatomy. liver reserve: bilirubin/albumin/inr, ascites/encephalopathy, renal function, fbc; performance status. review portal vein patency and prior biliary intervention; prophylactic antibiotic strategy in high-risk biliary colonisation. planning & technique selective/superselective catheterisation whenever feasible. deliver conventional or drug-eluting chemoembolisation strategy according to tumour and local protocol; avoid reflux/non-target flow. endpoint is adequate tumour arterial devascularisation/near stasis without excessive normal-liver embolisation. immediate post-care pain/antiemetic care; monitor post-embolisation syndrome, lfts, fever and hepatic decompensation. follow-up cross-sectional response assessment using enhancement-based criteria and liver function, commonly around 4–8 weeks depending on pathway. retreat only if residual viable tumour and liver reserve/overall strategy support it. complications & rescue post-embolisation syndrome, liver failure, abscess (higher with biliary instrumentation), cholecystitis, pancreatitis, non-target gi injury, arterial damage. ebir pearls tumour response is about viable enhancement, not just size. superselective treatment preserves future liver options.","oncall":false,"high":true},{"id":"p-F-1","cat":"F","title":"Y-90 radioembolisation / TARE","sub":"F · Interventional oncology · 2.2.5.2 · HIGH-YIELD","summary":"Internal radiotherapy requiring mapping, extrahepatic protection, dosimetry and liver-reserve assessment.","blocks":[{"h":"Indications","items":["Selected HCC, intrahepatic cholangiocarcinoma or liver-dominant metastases in an MDT-defined setting; radiation segmentectomy/lobectomy concepts may be used."],"text":"Indications Selected HCC, intrahepatic cholangiocarcinoma or liver-dominant metastases in an MDT-defined setting; radiation segmentectomy/lobectomy concepts may be used."},{"h":"Contraindications / cautions","items":["Uncorrectable significant extrahepatic shunting/deposition or lung shunt beyond safe device/dosimetry limits.","Severely impaired liver reserve or unsuitable vascular anatomy."],"text":"Contraindications / cautions Uncorrectable significant extrahepatic shunting/deposition or lung shunt beyond safe device/dosimetry limits. Severely impaired liver reserve or unsuitable vascular anatomy."},{"h":"Work-up","items":["Multiphase CT/MRI, tumour/treated-liver volumes, liver function/performance status.","Mapping angiography with identification/protection of extrahepatic branches and Tc-99m MAA (or validated local mapping method) for distribution/shunt assessment.","Patient-specific dosimetry planning; review prior systemic/radiation therapy."],"text":"Work-up Multiphase CT/MRI, tumour/treated-liver volumes, liver function/performance status. Mapping angiography with identification/protection of extrahepatic branches and Tc-99m MAA (or validated local mapping method) for distribution/shunt assessment. Patient-specific dosimetry planning; review prior systemic/radiation therapy."},{"h":"Planning & technique","items":["Reproduce mapping catheter position; meticulous avoidance of non-target flow.","Administer planned activity according to dosimetry/device protocol; measure residual activity and document delivered dose."],"text":"Planning & technique Reproduce mapping catheter position; meticulous avoidance of non-target flow. Administer planned activity according to dosimetry/device protocol; measure residual activity and document delivered dose."},{"h":"Immediate post-care","items":["Radiation safety instructions; monitor fatigue, pain, nausea and liver function."],"text":"Immediate post-care Radiation safety instructions; monitor fatigue, pain, nausea and liver function."},{"h":"Follow-up","items":["Imaging + labs at defined interval; expect delayed radiographic response and post-radiation changes."],"text":"Follow-up Imaging + labs at defined interval; expect delayed radiographic response and post-radiation changes."},{"h":"Complications & rescue","items":["Radioembolisation-induced liver disease, radiation gastritis/ulcer, cholecystitis, pneumonitis, biliary injury, non-target deposition."],"text":"Complications & rescue Radioembolisation-induced liver disease, radiation gastritis/ulcer, cholecystitis, pneumonitis, biliary injury, non-target deposition."},{"h":"EBIR pearls","items":["Mapping is part of the treatment, not a preliminary angiogram.","Know the difference between activity (GBq) and absorbed dose (Gy)."],"text":"EBIR pearls Mapping is part of the treatment, not a preliminary angiogram. Know the difference between activity (GBq) and absorbed dose (Gy)."}],"text":"y-90 radioembolisation / tare f · interventional oncology · 2.2.5.2 · high-yield internal radiotherapy requiring mapping, extrahepatic protection, dosimetry and liver-reserve assessment. indications selected hcc, intrahepatic cholangiocarcinoma or liver-dominant metastases in an mdt-defined setting; radiation segmentectomy/lobectomy concepts may be used. contraindications / cautions uncorrectable significant extrahepatic shunting/deposition or lung shunt beyond safe device/dosimetry limits. severely impaired liver reserve or unsuitable vascular anatomy. work-up multiphase ct/mri, tumour/treated-liver volumes, liver function/performance status. mapping angiography with identification/protection of extrahepatic branches and tc-99m maa (or validated local mapping method) for distribution/shunt assessment. patient-specific dosimetry planning; review prior systemic/radiation therapy. planning & technique reproduce mapping catheter position; meticulous avoidance of non-target flow. administer planned activity according to dosimetry/device protocol; measure residual activity and document delivered dose. immediate post-care radiation safety instructions; monitor fatigue, pain, nausea and liver function. follow-up imaging + labs at defined interval; expect delayed radiographic response and post-radiation changes. complications & rescue radioembolisation-induced liver disease, radiation gastritis/ulcer, cholecystitis, pneumonitis, biliary injury, non-target deposition. ebir pearls mapping is part of the treatment, not a preliminary angiogram. know the difference between activity (gbq) and absorbed dose (gy).","oncall":false,"high":true},{"id":"p-F-2","cat":"F","title":"Bland hepatic embolisation","sub":"F · Interventional oncology · 2.2.5.2","summary":"Tumour ischaemia using embolic particles without chemotherapy, often used for hypervascular liver metastases such as neuroendocrine tumours.","blocks":[{"h":"Indications","items":["Selected hypervascular liver-dominant tumours when arterial embolisation is appropriate within the oncologic strategy."],"text":"Indications Selected hypervascular liver-dominant tumours when arterial embolisation is appropriate within the oncologic strategy."},{"h":"Contraindications / cautions","items":["Poor liver reserve, unsafe arterial anatomy, uncontrolled infection; portal compromise increases risk."],"text":"Contraindications / cautions Poor liver reserve, unsafe arterial anatomy, uncontrolled infection; portal compromise increases risk."},{"h":"Work-up","items":["Same core liver reserve/tumour distribution work-up as TACE; understand tumour biology and alternative systemic/locoregional options."],"text":"Work-up Same core liver reserve/tumour distribution work-up as TACE; understand tumour biology and alternative systemic/locoregional options."},{"h":"Planning & technique","items":["Selective tumour-bearing arterial embolisation to controlled stasis; preserve non-tumour liver."],"text":"Planning & technique Selective tumour-bearing arterial embolisation to controlled stasis; preserve non-tumour liver."},{"h":"Immediate post-care","items":["Post-embolisation syndrome and liver function monitoring."],"text":"Immediate post-care Post-embolisation syndrome and liver function monitoring."},{"h":"Follow-up","items":["Enhancement-based response and clinical symptom response (e.g. functional NET syndrome where relevant)."],"text":"Follow-up Enhancement-based response and clinical symptom response (e.g. functional NET syndrome where relevant)."},{"h":"Complications & rescue","items":["Liver failure, abscess, non-target ischaemia, cholecystitis, post-embolisation syndrome."],"text":"Complications & rescue Liver failure, abscess, non-target ischaemia, cholecystitis, post-embolisation syndrome."},{"h":"EBIR pearls","items":["“Bland” describes the embolic, not a low-risk procedure."],"text":"EBIR pearls “Bland” describes the embolic, not a low-risk procedure."}],"text":"bland hepatic embolisation f · interventional oncology · 2.2.5.2 tumour ischaemia using embolic particles without chemotherapy, often used for hypervascular liver metastases such as neuroendocrine tumours. indications selected hypervascular liver-dominant tumours when arterial embolisation is appropriate within the oncologic strategy. contraindications / cautions poor liver reserve, unsafe arterial anatomy, uncontrolled infection; portal compromise increases risk. work-up same core liver reserve/tumour distribution work-up as tace; understand tumour biology and alternative systemic/locoregional options. planning & technique selective tumour-bearing arterial embolisation to controlled stasis; preserve non-tumour liver. immediate post-care post-embolisation syndrome and liver function monitoring. follow-up enhancement-based response and clinical symptom response (e.g. functional net syndrome where relevant). complications & rescue liver failure, abscess, non-target ischaemia, cholecystitis, post-embolisation syndrome. ebir pearls “bland” describes the embolic, not a low-risk procedure.","oncall":false,"high":false},{"id":"p-F-3","cat":"F","title":"Percutaneous liver tumour ablation","sub":"F · Interventional oncology · 2.2.5.3.1 · HIGH-YIELD","summary":"Image-guided thermal ablation with margin-based planning and protection of bile ducts, bowel, diaphragm and other vulnerable structures.","blocks":[{"h":"Indications","items":["Selected primary or metastatic liver tumours where local ablation offers curative, consolidative or palliative benefit within MDT strategy."],"text":"Indications Selected primary or metastatic liver tumours where local ablation offers curative, consolidative or palliative benefit within MDT strategy."},{"h":"Contraindications / cautions","items":["No safe ablation margin due to critical structures without a protective technique; decompensated liver failure; uncontrolled infection.","Caution: central bile ducts, bowel, gallbladder, diaphragm, large-vessel heat-sink depending on modality."],"text":"Contraindications / cautions No safe ablation margin due to critical structures without a protective technique; decompensated liver failure; uncontrolled infection. Caution: central bile ducts, bowel, gallbladder, diaphragm, large-vessel heat-sink depending on modality."},{"h":"Work-up","items":["Contrast MRI/CT to define lesion number/size/location and prior therapy; staging imaging.","Liver/renal function, FBC/coagulation, tumour markers as relevant; anaesthetic assessment.","Plan probe trajectory, ablation geometry and target margin; consider hydro/pneumodissection, biliary cooling or artificial ascites."],"text":"Work-up Contrast MRI/CT to define lesion number/size/location and prior therapy; staging imaging. Liver/renal function, FBC/coagulation, tumour markers as relevant; anaesthetic assessment. Plan probe trajectory, ablation geometry and target margin; consider hydro/pneumodissection, biliary cooling or artificial ascites."},{"h":"Planning & technique","items":["Place probe(s) to cover tumour + intended circumferential margin.","Use CT/US/fusion/CBCT as appropriate; monitor vulnerable structures and reposition/protect if required.","Immediate contrast assessment when feasible to detect residual enhancement and complications."],"text":"Planning & technique Place probe(s) to cover tumour + intended circumferential margin. Use CT/US/fusion/CBCT as appropriate; monitor vulnerable structures and reposition/protect if required. Immediate contrast assessment when feasible to detect residual enhancement and complications."},{"h":"Immediate post-care","items":["Pain, bleeding, fever, LFTs; watch for diaphragmatic/pleural injury and biliary complications."],"text":"Immediate post-care Pain, bleeding, fever, LFTs; watch for diaphragmatic/pleural injury and biliary complications."},{"h":"Follow-up","items":["Contrast CT/MRI at institutional interval (often ~4–6 weeks) for complete non-enhancing ablation zone and adequate margin; then oncologic surveillance."],"text":"Follow-up Contrast CT/MRI at institutional interval (often ~4–6 weeks) for complete non-enhancing ablation zone and adequate margin; then oncologic surveillance."},{"h":"Complications & rescue","items":["Bleeding, abscess, biliary stricture/biloma, bowel perforation, diaphragmatic injury, pleural effusion, liver failure, tumour seeding (rare)."],"text":"Complications & rescue Bleeding, abscess, biliary stricture/biloma, bowel perforation, diaphragmatic injury, pleural effusion, liver failure, tumour seeding (rare)."},{"h":"EBIR pearls","items":["Ablation success is a 3-D margin problem, not “the probe went through the lesion”."],"text":"EBIR pearls Ablation success is a 3-D margin problem, not “the probe went through the lesion”."}],"text":"percutaneous liver tumour ablation f · interventional oncology · 2.2.5.3.1 · high-yield image-guided thermal ablation with margin-based planning and protection of bile ducts, bowel, diaphragm and other vulnerable structures. indications selected primary or metastatic liver tumours where local ablation offers curative, consolidative or palliative benefit within mdt strategy. contraindications / cautions no safe ablation margin due to critical structures without a protective technique; decompensated liver failure; uncontrolled infection. caution: central bile ducts, bowel, gallbladder, diaphragm, large-vessel heat-sink depending on modality. work-up contrast mri/ct to define lesion number/size/location and prior therapy; staging imaging. liver/renal function, fbc/coagulation, tumour markers as relevant; anaesthetic assessment. plan probe trajectory, ablation geometry and target margin; consider hydro/pneumodissection, biliary cooling or artificial ascites. planning & technique place probe(s) to cover tumour + intended circumferential margin. use ct/us/fusion/cbct as appropriate; monitor vulnerable structures and reposition/protect if required. immediate contrast assessment when feasible to detect residual enhancement and complications. immediate post-care pain, bleeding, fever, lfts; watch for diaphragmatic/pleural injury and biliary complications. follow-up contrast ct/mri at institutional interval (often ~4–6 weeks) for complete non-enhancing ablation zone and adequate margin; then oncologic surveillance. complications & rescue bleeding, abscess, biliary stricture/biloma, bowel perforation, diaphragmatic injury, pleural effusion, liver failure, tumour seeding (rare). ebir pearls ablation success is a 3-d margin problem, not “the probe went through the lesion”.","oncall":false,"high":true},{"id":"p-F-4","cat":"F","title":"Renal tumour ablation","sub":"F · Interventional oncology · 2.2.5.3.1 · HIGH-YIELD","summary":"Nephron-sparing local treatment for selected renal tumours using hydrodissection and collecting-system/nerve protection.","blocks":[{"h":"Indications","items":["Selected small renal masses, particularly in patients favouring nephron preservation or at higher surgical risk; hereditary/multiple tumours may particularly benefit."],"text":"Indications Selected small renal masses, particularly in patients favouring nephron preservation or at higher surgical risk; hereditary/multiple tumours may particularly benefit."},{"h":"Contraindications / cautions","items":["No safe percutaneous window or tumour anatomy where surgery/active surveillance is clearly preferred.","Caution: central/hilar lesions, collecting system/ureter, bowel, genitofemoral nerve."],"text":"Contraindications / cautions No safe percutaneous window or tumour anatomy where surgery/active surveillance is clearly preferred. Caution: central/hilar lesions, collecting system/ureter, bowel, genitofemoral nerve."},{"h":"Work-up","items":["Renal protocol CT/MRI and staging; renal function/FBC/coagulation.","Confirm histology strategy—biopsy before or at ablation according to local oncologic pathway.","Plan patient position and displacement/protection of bowel and ureter."],"text":"Work-up Renal protocol CT/MRI and staging; renal function/FBC/coagulation. Confirm histology strategy—biopsy before or at ablation according to local oncologic pathway. Plan patient position and displacement/protection of bowel and ureter."},{"h":"Planning & technique","items":["Cryo offers visible ice ball; MWA/RFA are alternatives depending on lesion/location and expertise.","Hydrodissection/pneumodissection; pyeloperfusion or ureteric protection for collecting-system risk when used locally.","Cover tumour with adequate margin."],"text":"Planning & technique Cryo offers visible ice ball; MWA/RFA are alternatives depending on lesion/location and expertise. Hydrodissection/pneumodissection; pyeloperfusion or ureteric protection for collecting-system risk when used locally. Cover tumour with adequate margin."},{"h":"Immediate post-care","items":["Monitor haematuria, pain, Hb and renal function."],"text":"Immediate post-care Monitor haematuria, pain, Hb and renal function."},{"h":"Follow-up","items":["Contrast CT/MRI for residual enhancement, then long-term renal oncologic surveillance."],"text":"Follow-up Contrast CT/MRI for residual enhancement, then long-term renal oncologic surveillance."},{"h":"Complications & rescue","items":["Perirenal haematoma/haemorrhage, urinary leak/stricture, bowel injury, neuropathy, infection, renal function loss."],"text":"Complications & rescue Perirenal haematoma/haemorrhage, urinary leak/stricture, bowel injury, neuropathy, infection, renal function loss."},{"h":"EBIR pearls","items":["For anterior renal tumours, bowel displacement is often the key technical step."],"text":"EBIR pearls For anterior renal tumours, bowel displacement is often the key technical step."}],"text":"renal tumour ablation f · interventional oncology · 2.2.5.3.1 · high-yield nephron-sparing local treatment for selected renal tumours using hydrodissection and collecting-system/nerve protection. indications selected small renal masses, particularly in patients favouring nephron preservation or at higher surgical risk; hereditary/multiple tumours may particularly benefit. contraindications / cautions no safe percutaneous window or tumour anatomy where surgery/active surveillance is clearly preferred. caution: central/hilar lesions, collecting system/ureter, bowel, genitofemoral nerve. work-up renal protocol ct/mri and staging; renal function/fbc/coagulation. confirm histology strategy—biopsy before or at ablation according to local oncologic pathway. plan patient position and displacement/protection of bowel and ureter. planning & technique cryo offers visible ice ball; mwa/rfa are alternatives depending on lesion/location and expertise. hydrodissection/pneumodissection; pyeloperfusion or ureteric protection for collecting-system risk when used locally. cover tumour with adequate margin. immediate post-care monitor haematuria, pain, hb and renal function. follow-up contrast ct/mri for residual enhancement, then long-term renal oncologic surveillance. complications & rescue perirenal haematoma/haemorrhage, urinary leak/stricture, bowel injury, neuropathy, infection, renal function loss. ebir pearls for anterior renal tumours, bowel displacement is often the key technical step.","oncall":false,"high":true},{"id":"p-F-5","cat":"F","title":"Lung tumour ablation","sub":"F · Interventional oncology · 2.2.5.3.1 · HIGH-YIELD","summary":"Percutaneous ablation of selected primary or metastatic lung tumours with pleural, airway and pulmonary-reserve planning.","blocks":[{"h":"Indications","items":["Selected early primary lung cancer in non-surgical candidates and oligometastatic/oligoprogressive lung disease within MDT strategy."],"text":"Indications Selected early primary lung cancer in non-surgical candidates and oligometastatic/oligoprogressive lung disease within MDT strategy."},{"h":"Contraindications / cautions","items":["Insufficient pulmonary reserve, uncontrolled infection, uncorrectable coagulopathy; central/hilar lesions may carry unacceptable airway/vessel risk."],"text":"Contraindications / cautions Insufficient pulmonary reserve, uncontrolled infection, uncorrectable coagulopathy; central/hilar lesions may carry unacceptable airway/vessel risk."},{"h":"Work-up","items":["Thin-slice CT/PET-CT staging as appropriate; pulmonary function and anaesthetic risk.","FBC/coagulation; review anticoagulation and target relation to pleura, fissures, vessels, bronchi, diaphragm."],"text":"Work-up Thin-slice CT/PET-CT staging as appropriate; pulmonary function and anaesthetic risk. FBC/coagulation; review anticoagulation and target relation to pleura, fissures, vessels, bronchi, diaphragm."},{"h":"Planning & technique","items":["Plan shortest safe route avoiding fissures/bullae when possible.","Ablate tumour with adequate margin; modality choice depends on size/location and expertise.","Immediate CT to assess pneumothorax/haemorrhage and technical coverage."],"text":"Planning & technique Plan shortest safe route avoiding fissures/bullae when possible. Ablate tumour with adequate margin; modality choice depends on size/location and expertise. Immediate CT to assess pneumothorax/haemorrhage and technical coverage."},{"h":"Immediate post-care","items":["Serial respiratory observations; treat pneumothorax based on size/symptoms and progression; analgesia."],"text":"Immediate post-care Serial respiratory observations; treat pneumothorax based on size/symptoms and progression; analgesia."},{"h":"Follow-up","items":["CT/PET pattern evolves after ablation; assess for marginal nodular enhancement/growth rather than expecting immediate size reduction."],"text":"Follow-up CT/PET pattern evolves after ablation; assess for marginal nodular enhancement/growth rather than expecting immediate size reduction."},{"h":"Complications & rescue","items":["Pneumothorax, pulmonary haemorrhage/haemoptysis, pleural effusion, bronchopleural fistula, infection, rare air embolism."],"text":"Complications & rescue Pneumothorax, pulmonary haemorrhage/haemoptysis, pleural effusion, bronchopleural fistula, infection, rare air embolism."},{"h":"EBIR pearls","items":["Post-ablation inflammation can look bigger before it looks better."],"text":"EBIR pearls Post-ablation inflammation can look bigger before it looks better."}],"text":"lung tumour ablation f · interventional oncology · 2.2.5.3.1 · high-yield percutaneous ablation of selected primary or metastatic lung tumours with pleural, airway and pulmonary-reserve planning. indications selected early primary lung cancer in non-surgical candidates and oligometastatic/oligoprogressive lung disease within mdt strategy. contraindications / cautions insufficient pulmonary reserve, uncontrolled infection, uncorrectable coagulopathy; central/hilar lesions may carry unacceptable airway/vessel risk. work-up thin-slice ct/pet-ct staging as appropriate; pulmonary function and anaesthetic risk. fbc/coagulation; review anticoagulation and target relation to pleura, fissures, vessels, bronchi, diaphragm. planning & technique plan shortest safe route avoiding fissures/bullae when possible. ablate tumour with adequate margin; modality choice depends on size/location and expertise. immediate ct to assess pneumothorax/haemorrhage and technical coverage. immediate post-care serial respiratory observations; treat pneumothorax based on size/symptoms and progression; analgesia. follow-up ct/pet pattern evolves after ablation; assess for marginal nodular enhancement/growth rather than expecting immediate size reduction. complications & rescue pneumothorax, pulmonary haemorrhage/haemoptysis, pleural effusion, bronchopleural fistula, infection, rare air embolism. ebir pearls post-ablation inflammation can look bigger before it looks better.","oncall":false,"high":true},{"id":"p-F-6","cat":"F","title":"Bone tumour ablation ± cement / fixation","sub":"F · Interventional oncology · 2.2.5.3.4","summary":"Percutaneous pain palliation or local control combining ablation with structural augmentation when fracture risk requires it.","blocks":[{"h":"Indications","items":["Painful bone metastasis refractory to standard therapy, oligometastatic local control, selected benign painful tumours."],"text":"Indications Painful bone metastasis refractory to standard therapy, oligometastatic local control, selected benign painful tumours."},{"h":"Contraindications / cautions","items":["Impending/pathologic fracture requiring surgical stabilisation rather than percutaneous treatment alone; uncontrolled infection.","Caution: lesions near spinal cord, major nerves, articular cartilage or growth plate."],"text":"Contraindications / cautions Impending/pathologic fracture requiring surgical stabilisation rather than percutaneous treatment alone; uncontrolled infection. Caution: lesions near spinal cord, major nerves, articular cartilage or growth plate."},{"h":"Work-up","items":["CT/MRI ± PET; assess fracture risk, mechanical instability and neural proximity; coordinate oncology/radiotherapy/orthopaedics.","FBC/coagulation and analgesia/anaesthesia plan."],"text":"Work-up CT/MRI ± PET; assess fracture risk, mechanical instability and neural proximity; coordinate oncology/radiotherapy/orthopaedics. FBC/coagulation and analgesia/anaesthesia plan."},{"h":"Planning & technique","items":["Choose modality based on lesion and critical structures; cryo allows visible ice-ball monitoring.","Use thermocouples, hydrodissection, CO₂ or other protection as appropriate.","Add cementoplasty/screw fixation when mechanical support is required."],"text":"Planning & technique Choose modality based on lesion and critical structures; cryo allows visible ice-ball monitoring. Use thermocouples, hydrodissection, CO₂ or other protection as appropriate. Add cementoplasty/screw fixation when mechanical support is required."},{"h":"Immediate post-care","items":["Neurovascular exam, pain management and weight-bearing plan."],"text":"Immediate post-care Neurovascular exam, pain management and weight-bearing plan."},{"h":"Follow-up","items":["Pain score/function and imaging for local control/structural integrity."],"text":"Follow-up Pain score/function and imaging for local control/structural integrity."},{"h":"Complications & rescue","items":["Nerve injury, skin necrosis, fracture, cement leak, bleeding, infection, thermal injury to joint/cord."],"text":"Complications & rescue Nerve injury, skin necrosis, fracture, cement leak, bleeding, infection, thermal injury to joint/cord."},{"h":"EBIR pearls","items":["Tumour kill and mechanical stability are separate endpoints—address both."],"text":"EBIR pearls Tumour kill and mechanical stability are separate endpoints—address both."}],"text":"bone tumour ablation ± cement / fixation f · interventional oncology · 2.2.5.3.4 percutaneous pain palliation or local control combining ablation with structural augmentation when fracture risk requires it. indications painful bone metastasis refractory to standard therapy, oligometastatic local control, selected benign painful tumours. contraindications / cautions impending/pathologic fracture requiring surgical stabilisation rather than percutaneous treatment alone; uncontrolled infection. caution: lesions near spinal cord, major nerves, articular cartilage or growth plate. work-up ct/mri ± pet; assess fracture risk, mechanical instability and neural proximity; coordinate oncology/radiotherapy/orthopaedics. fbc/coagulation and analgesia/anaesthesia plan. planning & technique choose modality based on lesion and critical structures; cryo allows visible ice-ball monitoring. use thermocouples, hydrodissection, co₂ or other protection as appropriate. add cementoplasty/screw fixation when mechanical support is required. immediate post-care neurovascular exam, pain management and weight-bearing plan. follow-up pain score/function and imaging for local control/structural integrity. complications & rescue nerve injury, skin necrosis, fracture, cement leak, bleeding, infection, thermal injury to joint/cord. ebir pearls tumour kill and mechanical stability are separate endpoints—address both.","oncall":false,"high":false},{"id":"p-F-7","cat":"F","title":"Portal vein embolisation / liver venous deprivation","sub":"F · Interventional oncology · 2.2.5.2 · HIGH-YIELD","summary":"Preoperative liver regeneration therapy based on future liver remnant volume/function and planned surgical resection.","blocks":[{"h":"Indications","items":["Planned major hepatectomy with insufficient predicted future liver remnant volume/function for the patient’s liver quality."],"text":"Indications Planned major hepatectomy with insufficient predicted future liver remnant volume/function for the patient’s liver quality."},{"h":"Contraindications / cautions","items":["Unresectable/progressive disease where hypertrophy will not lead to surgery; portal vein thrombosis/anatomy preventing safe intended strategy."],"text":"Contraindications / cautions Unresectable/progressive disease where hypertrophy will not lead to surgery; portal vein thrombosis/anatomy preventing safe intended strategy."},{"h":"Work-up","items":["High-quality portal/hepatic venous CT/MRI and surgical plan.","Calculate FLR volume indexed to patient/liver; functional assessment when appropriate (e.g. hepatobiliary scintigraphy).","Liver function/FBC/coagulation and tumour progression risk."],"text":"Work-up High-quality portal/hepatic venous CT/MRI and surgical plan. Calculate FLR volume indexed to patient/liver; functional assessment when appropriate (e.g. hepatobiliary scintigraphy). Liver function/FBC/coagulation and tumour progression risk."},{"h":"Planning & technique","items":["Embolise portal branches feeding the liver to be resected while preserving FLR portal inflow.","LVD/DVE adds hepatic venous embolisation in selected pathways to increase hypertrophy.","Avoid non-target FLR embolisation and portal thrombosis."],"text":"Planning & technique Embolise portal branches feeding the liver to be resected while preserving FLR portal inflow. LVD/DVE adds hepatic venous embolisation in selected pathways to increase hypertrophy. Avoid non-target FLR embolisation and portal thrombosis."},{"h":"Immediate post-care","items":["Pain/fever and liver function; monitor for portal thrombosis or liver decompensation."],"text":"Immediate post-care Pain/fever and liver function; monitor for portal thrombosis or liver decompensation."},{"h":"Follow-up","items":["Repeat volumetric ± functional assessment typically after a defined regeneration interval; reassess resectability and interval tumour progression."],"text":"Follow-up Repeat volumetric ± functional assessment typically after a defined regeneration interval; reassess resectability and interval tumour progression."},{"h":"Complications & rescue","items":["Non-target portal embolisation, portal vein thrombosis, haemorrhage, infection, liver failure, tumour progression during interval."],"text":"Complications & rescue Non-target portal embolisation, portal vein thrombosis, haemorrhage, infection, liver failure, tumour progression during interval."},{"h":"EBIR pearls","items":["The target is an adequate functional FLR, not a percentage hypertrophy for its own sake."],"text":"EBIR pearls The target is an adequate functional FLR, not a percentage hypertrophy for its own sake."}],"text":"portal vein embolisation / liver venous deprivation f · interventional oncology · 2.2.5.2 · high-yield preoperative liver regeneration therapy based on future liver remnant volume/function and planned surgical resection. indications planned major hepatectomy with insufficient predicted future liver remnant volume/function for the patient’s liver quality. contraindications / cautions unresectable/progressive disease where hypertrophy will not lead to surgery; portal vein thrombosis/anatomy preventing safe intended strategy. work-up high-quality portal/hepatic venous ct/mri and surgical plan. calculate flr volume indexed to patient/liver; functional assessment when appropriate (e.g. hepatobiliary scintigraphy). liver function/fbc/coagulation and tumour progression risk. planning & technique embolise portal branches feeding the liver to be resected while preserving flr portal inflow. lvd/dve adds hepatic venous embolisation in selected pathways to increase hypertrophy. avoid non-target flr embolisation and portal thrombosis. immediate post-care pain/fever and liver function; monitor for portal thrombosis or liver decompensation. follow-up repeat volumetric ± functional assessment typically after a defined regeneration interval; reassess resectability and interval tumour progression. complications & rescue non-target portal embolisation, portal vein thrombosis, haemorrhage, infection, liver failure, tumour progression during interval. ebir pearls the target is an adequate functional flr, not a percentage hypertrophy for its own sake.","oncall":false,"high":true},{"id":"p-F-8","cat":"F","title":"Tumour-related biliary intervention","sub":"F · Interventional oncology · 2.2.5.3.2","summary":"Biliary drainage/stenting specifically integrated with oncologic goals, future liver remnant and systemic/surgical treatment.","blocks":[{"h":"Indications","items":["Malignant obstruction causing cholangitis, symptomatic jaundice or preventing planned surgery/systemic therapy."],"text":"Indications Malignant obstruction causing cholangitis, symptomatic jaundice or preventing planned surgery/systemic therapy."},{"h":"Contraindications / cautions","items":["Drainage that will not improve symptoms, treatment eligibility or infection control; indiscriminate drainage of atrophic/nonfunctional segments."],"text":"Contraindications / cautions Drainage that will not improve symptoms, treatment eligibility or infection control; indiscriminate drainage of atrophic/nonfunctional segments."},{"h":"Work-up","items":["Define hilar level, lobar atrophy and functional liver; coordinate with HPB surgery/oncology before crossing ducts.","LFT/bilirubin, infection, renal/coagulation; biliary cultures/antibiotic plan."],"text":"Work-up Define hilar level, lobar atrophy and functional liver; coordinate with HPB surgery/oncology before crossing ducts. LFT/bilirubin, infection, renal/coagulation; biliary cultures/antibiotic plan."},{"h":"Planning & technique","items":["Drain functional liver that needs decompression; minimise contrast contamination of ducts that cannot be drained.","Choose unilateral/bilateral, external/internal and stent configuration according to anatomy and treatment plan."],"text":"Planning & technique Drain functional liver that needs decompression; minimise contrast contamination of ducts that cannot be drained. Choose unilateral/bilateral, external/internal and stent configuration according to anatomy and treatment plan."},{"h":"Immediate post-care","items":["Sepsis and drain/stent function monitoring."],"text":"Immediate post-care Sepsis and drain/stent function monitoring."},{"h":"Follow-up","items":["Bilirubin response and systemic/surgical treatment readiness; manage recurrent obstruction."],"text":"Follow-up Bilirubin response and systemic/surgical treatment readiness; manage recurrent obstruction."},{"h":"Complications & rescue","items":["Cholangitis, haemobilia, bile leak, stent occlusion/migration, liver abscess."],"text":"Complications & rescue Cholangitis, haemobilia, bile leak, stent occlusion/migration, liver abscess."},{"h":"EBIR pearls","items":["In hilar malignancy, drainage strategy should match the oncologic/surgical plan before the needle touches the liver."],"text":"EBIR pearls In hilar malignancy, drainage strategy should match the oncologic/surgical plan before the needle touches the liver."}],"text":"tumour-related biliary intervention f · interventional oncology · 2.2.5.3.2 biliary drainage/stenting specifically integrated with oncologic goals, future liver remnant and systemic/surgical treatment. indications malignant obstruction causing cholangitis, symptomatic jaundice or preventing planned surgery/systemic therapy. contraindications / cautions drainage that will not improve symptoms, treatment eligibility or infection control; indiscriminate drainage of atrophic/nonfunctional segments. work-up define hilar level, lobar atrophy and functional liver; coordinate with hpb surgery/oncology before crossing ducts. lft/bilirubin, infection, renal/coagulation; biliary cultures/antibiotic plan. planning & technique drain functional liver that needs decompression; minimise contrast contamination of ducts that cannot be drained. choose unilateral/bilateral, external/internal and stent configuration according to anatomy and treatment plan. immediate post-care sepsis and drain/stent function monitoring. follow-up bilirubin response and systemic/surgical treatment readiness; manage recurrent obstruction. complications & rescue cholangitis, haemobilia, bile leak, stent occlusion/migration, liver abscess. ebir pearls in hilar malignancy, drainage strategy should match the oncologic/surgical plan before the needle touches the liver.","oncall":false,"high":false}],"vivas":[["A patient with acute limb ischaemia has sensory loss beyond the toes and mild motor weakness. What is the key management implication?","This is a immediately threatened limb (Rutherford IIb). Revascularisation must be rapid; prolonged catheter-directed thrombolysis alone may be too slow. Mechanical/hybrid/surgical strategies and vascular-surgical coordination are prioritised."],["What are the two most important concepts when embolising a visceral pseudoaneurysm?","Exclude both inflow and outflow/collateral back-filling (“sandwich” concept where anatomy allows), and preserve non-target organ perfusion."],["Why can BRTO worsen oesophageal varices or ascites?","It closes a spontaneous portosystemic decompressive shunt, which can raise portal pressure even while treating gastric varices or shunt-related encephalopathy."],["What is the feared complication of bronchial artery embolisation and how do you reduce risk?","Spinal cord ischaemia. Identify spinal arterial supply, catheterise distal to dangerous branches when safe, use careful embolic selection/technique, and stop for any concern about non-target spinal flow."],["What is the conceptual endpoint of TIPS?","Adequate portal decompression (documented by pressure-gradient reduction and clinical goal) while avoiding excessive shunting that increases encephalopathy/liver/cardiac failure."],["For liver ablation, what is a better technical endpoint than “the lesion was covered”?","A planned circumferential 3-D ablation margin around the tumour, while protecting vulnerable adjacent structures."],["What is the classic indication for an IVC filter?","Acute VTE when therapeutic anticoagulation is contraindicated (or cannot be continued because of a major complication), with a plan for retrieval once the contraindication resolves."],["In hilar malignant obstruction, why should you avoid opacifying ducts you cannot drain?","Contrast injection can contaminate/pressurise an obstructed undrained segment and precipitate cholangitis. Drain functional target liver and limit unnecessary cholangiography."],["Why is AVS a protocol problem as much as a catheter problem?","The result depends on bilateral selective sampling, correct timing (e.g. with/without stimulation), precise labelling and interpretation using the local selectivity/lateralisation criteria."],["What should you look for when a dialysis access thrombosis has been cleared?","The underlying haemodynamically significant stenosis. Thrombectomy without treating the causative lesion is incomplete and predisposes to immediate rethrombosis."],["Which complications in the modified CIRSE classification distinguish grade 1a from 1b?","Both are resolved during the procedure; in 1a the intended therapy is completed, whereas in 1b the complication prevents completion of the intended therapy."],["What is the single most important follow-up principle for percutaneous drains?","Active ownership. Trend output and clinical response, keep the catheter functional, investigate persistent output/non-resolution, and define the criteria/pathway for removal or exchange."]]};
async function loadSource(){ state.procedures=SOURCE_DATA.procedures; state.vivas=SOURCE_DATA.vivas; }
function navs(){
