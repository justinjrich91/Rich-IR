olisation pelvic pain/dysuria, uti, urinary retention, haematuria/haematospermia. non-target rectal/bladder/penile ischaemia is the key preventable complication. ebir pearls pae is a clinical service, not just bilateral embolisation: exclude cancer and quantify symptoms. cbct can be more valuable for avoiding non-target embolisation than for showing off anatomy.","oncall":false,"high":true},{"id":"p-B-11","cat":"B","title":"Priapism embolisation","sub":"B · Vascular · 2.2.1.2.1","summary":"Selective embolisation for high-flow (non-ischaemic) priapism after differentiating it from the urologic emergency of low-flow priapism.","blocks":[{"h":"Indications","items":["Persistent high-flow priapism with arterial-cavernosal fistula/pseudoaneurysm after trauma or iatrogenic injury, especially if conservative management fails."],"text":"Indications Persistent high-flow priapism with arterial-cavernosal fistula/pseudoaneurysm after trauma or iatrogenic injury, especially if conservative management fails."},{"h":"Contraindications / cautions","items":["Low-flow/ischaemic priapism → urgent urologic aspiration/alpha-agonist pathway, not arterial embolisation."],"text":"Contraindications / cautions Low-flow/ischaemic priapism → urgent urologic aspiration/alpha-agonist pathway, not arterial embolisation."},{"h":"Work-up","items":["History: trauma, pain, duration; exam.","Cavernosal blood gas and Doppler ultrasound to distinguish low vs high flow; CTA/angiography selectively."],"text":"Work-up History: trauma, pain, duration; exam. Cavernosal blood gas and Doppler ultrasound to distinguish low vs high flow; CTA/angiography selectively."},{"h":"Planning & technique","items":["Superselect internal pudendal/cavernosal artery and embolise fistula using temporary or permanent agent tailored to anatomy and recurrence risk.","Preserve erectile tissue perfusion."],"text":"Planning & technique Superselect internal pudendal/cavernosal artery and embolise fistula using temporary or permanent agent tailored to anatomy and recurrence risk. Preserve erectile tissue perfusion."},{"h":"Immediate post-care","items":["Observe detumescence, pain and access site; urology review."],"text":"Immediate post-care Observe detumescence, pain and access site; urology review."},{"h":"Follow-up","items":["Assess recurrence and erectile function."],"text":"Follow-up Assess recurrence and erectile function."},{"h":"Complications & rescue","items":["Erectile dysfunction, recurrence/recanalisation, non-target penile ischaemia."],"text":"Complications & rescue Erectile dysfunction, recurrence/recanalisation, non-target penile ischaemia."},{"h":"EBIR pearls","items":["First distinguish high-flow from low-flow. The latter is a time-critical ischaemic emergency."],"text":"EBIR pearls First distinguish high-flow from low-flow. The latter is a time-critical ischaemic emergency."}],"text":"priapism embolisation b · vascular · 2.2.1.2.1 selective embolisation for high-flow (non-ischaemic) priapism after differentiating it from the urologic emergency of low-flow priapism. indications persistent high-flow priapism with arterial-cavernosal fistula/pseudoaneurysm after trauma or iatrogenic injury, especially if conservative management fails. contraindications / cautions low-flow/ischaemic priapism → urgent urologic aspiration/alpha-agonist pathway, not arterial embolisation. work-up history: trauma, pain, duration; exam. cavernosal blood gas and doppler ultrasound to distinguish low vs high flow; cta/angiography selectively. planning & technique superselect internal pudendal/cavernosal artery and embolise fistula using temporary or permanent agent tailored to anatomy and recurrence risk. preserve erectile tissue perfusion. immediate post-care observe detumescence, pain and access site; urology review. follow-up assess recurrence and erectile function. complications & rescue erectile dysfunction, recurrence/recanalisation, non-target penile ischaemia. ebir pearls first distinguish high-flow from low-flow. the latter is a time-critical ischaemic emergency.","oncall":false,"high":false},{"id":"p-B-12","cat":"B","title":"Iliofemoral DVT thrombectomy / venous stenting","sub":"B · Vascular · 2.2.1.3.1 · HIGH-YIELD","summary":"Selected thrombus-removal and venous reconstruction for severe acute iliofemoral DVT or chronic iliocaval obstruction.","blocks":[{"h":"Indications","items":["Selected acute iliofemoral DVT with severe symptoms, low bleeding risk and good functional status where thrombus removal is expected to add benefit.","Phlegmasia / threatened limb.","Symptomatic chronic iliocaval obstruction with significant venous hypertension."],"text":"Indications Selected acute iliofemoral DVT with severe symptoms, low bleeding risk and good functional status where thrombus removal is expected to add benefit. Phlegmasia / threatened limb. Symptomatic chronic iliocaval obstruction with significant venous hypertension."},{"h":"Contraindications / cautions","items":["High bleeding risk when lysis is planned; limited life expectancy/functional benefit; asymptomatic disease.","Caution: renal failure, active infection, inability to maintain anticoagulation."],"text":"Contraindications / cautions High bleeding risk when lysis is planned; limited life expectancy/functional benefit; asymptomatic disease. Caution: renal failure, active infection, inability to maintain anticoagulation."},{"h":"Work-up","items":["Duplex + CT/MR venography as needed; determine acute vs chronic extent and IVC involvement.","FBC/coagulation/renal function; anticoagulation history and bleeding risk.","Assess for underlying compressive lesion and malignancy when appropriate."],"text":"Work-up Duplex + CT/MR venography as needed; determine acute vs chronic extent and IVC involvement. FBC/coagulation/renal function; anticoagulation history and bleeding risk. Assess for underlying compressive lesion and malignancy when appropriate."},{"h":"Planning & technique","items":["Venous access via popliteal/femoral/jugular route according to anatomy.","Aspiration/mechanical thrombectomy ± limited lysis; use IVUS where available to define iliac obstruction and landing zones.","Stent fixed iliocaval obstruction with adequate inflow/outflow; avoid leaving untreated residual disease."],"text":"Planning & technique Venous access via popliteal/femoral/jugular route according to anatomy. Aspiration/mechanical thrombectomy ± limited lysis; use IVUS where available to define iliac obstruction and landing zones. Stent fixed iliocaval obstruction with adequate inflow/outflow; avoid leaving untreated residual disease."},{"h":"Immediate post-care","items":["Therapeutic anticoagulation per thrombosis/venous stent protocol; compression and mobilisation when appropriate."],"text":"Immediate post-care Therapeutic anticoagulation per thrombosis/venous stent protocol; compression and mobilisation when appropriate."},{"h":"Follow-up","items":["Clinical review and duplex/venous imaging for patency; investigate recurrent swelling."],"text":"Follow-up Clinical review and duplex/venous imaging for patency; investigate recurrent swelling."},{"h":"Complications & rescue","items":["Bleeding/PE, venous rupture, stent thrombosis/migration, contralateral iliac compromise."],"text":"Complications & rescue Bleeding/PE, venous rupture, stent thrombosis/migration, contralateral iliac compromise."},{"h":"EBIR pearls","items":["Do not stent acute thrombus; clear thrombus, define the fixed lesion, then stent.","Adequate inflow is crucial for venous stent patency."],"text":"EBIR pearls Do not stent acute thrombus; clear thrombus, define the fixed lesion, then stent. Adequate inflow is crucial for venous stent patency."}],"text":"iliofemoral dvt thrombectomy / venous stenting b · vascular · 2.2.1.3.1 · high-yield selected thrombus-removal and venous reconstruction for severe acute iliofemoral dvt or chronic iliocaval obstruction. indications selected acute iliofemoral dvt with severe symptoms, low bleeding risk and good functional status where thrombus removal is expected to add benefit. phlegmasia / threatened limb. symptomatic chronic iliocaval obstruction with significant venous hypertension. contraindications / cautions high bleeding risk when lysis is planned; limited life expectancy/functional benefit; asymptomatic disease. caution: renal failure, active infection, inability to maintain anticoagulation. work-up duplex + ct/mr venography as needed; determine acute vs chronic extent and ivc involvement. fbc/coagulation/renal function; anticoagulation history and bleeding risk. assess for underlying compressive lesion and malignancy when appropriate. planning & technique venous access via popliteal/femoral/jugular route according to anatomy. aspiration/mechanical thrombectomy ± limited lysis; use ivus where available to define iliac obstruction and landing zones. stent fixed iliocaval obstruction with adequate inflow/outflow; avoid leaving untreated residual disease. immediate post-care therapeutic anticoagulation per thrombosis/venous stent protocol; compression and mobilisation when appropriate. follow-up clinical review and duplex/venous imaging for patency; investigate recurrent swelling. complications & rescue bleeding/pe, venous rupture, stent thrombosis/migration, contralateral iliac compromise. ebir pearls do not stent acute thrombus; clear thrombus, define the fixed lesion, then stent. adequate inflow is crucial for venous stent patency.","oncall":false,"high":true},{"id":"p-B-13","cat":"B","title":"Pulmonary embolism catheter therapy","sub":"B · Vascular · 2.2.1.3.2 · HIGH-YIELD · ON-CALL","summary":"Risk-stratified catheter-directed therapy for acute pulmonary embolism as part of a multidisciplinary PE response pathway.","blocks":[{"h":"Indications","items":["High-risk PE with haemodynamic instability when systemic thrombolysis is contraindicated/failed or a catheter strategy is chosen by the treating team.","Selected intermediate-high-risk PE with deterioration or high-risk features after multidisciplinary assessment."],"text":"Indications High-risk PE with haemodynamic instability when systemic thrombolysis is contraindicated/failed or a catheter strategy is chosen by the treating team. Selected intermediate-high-risk PE with deterioration or high-risk features after multidisciplinary assessment."},{"h":"Contraindications / cautions","items":["No meaningful thrombus target or patient whose instability is not primarily due to PE.","Thrombolysis contraindications matter if catheter-directed lytic is used; mechanical thrombectomy may avoid lytic."],"text":"Contraindications / cautions No meaningful thrombus target or patient whose instability is not primarily due to PE. Thrombolysis contraindications matter if catheter-directed lytic is used; mechanical thrombectomy may avoid lytic."},{"h":"Work-up","items":["Confirm CTPA clot burden and RV strain; clinical risk stratification, oxygen/haemodynamics.","ECG/troponin/BNP and echo where useful; FBC/coagulation/renal function; therapeutic anticoagulation unless contraindicated."],"text":"Work-up Confirm CTPA clot burden and RV strain; clinical risk stratification, oxygen/haemodynamics. ECG/troponin/BNP and echo where useful; FBC/coagulation/renal function; therapeutic anticoagulation unless contraindicated."},{"h":"Planning & technique","items":["Femoral/jugular venous access; pulmonary angiography selectively.","Use aspiration/mechanical thrombectomy and/or local lysis according to anatomy, physiology and device availability.","Endpoint is haemodynamic/clinical improvement with safe thrombus reduction—not angiographic perfection."],"text":"Planning & technique Femoral/jugular venous access; pulmonary angiography selectively. Use aspiration/mechanical thrombectomy and/or local lysis according to anatomy, physiology and device availability. Endpoint is haemodynamic/clinical improvement with safe thrombus reduction—not angiographic perfection."},{"h":"Immediate post-care","items":["Monitored/ICU setting; continue anticoagulation; observe access, Hb, oxygenation and RV status."],"text":"Immediate post-care Monitored/ICU setting; continue anticoagulation; observe access, Hb, oxygenation and RV status."},{"h":"Follow-up","items":["Define duration/cause of anticoagulation; evaluate persistent dyspnoea for chronic thromboembolic disease."],"text":"Follow-up Define duration/cause of anticoagulation; evaluate persistent dyspnoea for chronic thromboembolic disease."},{"h":"Complications & rescue","items":["Pulmonary artery injury/haemoptysis, bleeding, arrhythmia, haemodynamic collapse, access complications."],"text":"Complications & rescue Pulmonary artery injury/haemoptysis, bleeding, arrhythmia, haemodynamic collapse, access complications."},{"h":"EBIR pearls","items":["PE treatment is risk-stratified; “large clot on CT” alone is not an indication.","In unstable PE, the endpoint is restoring physiology quickly."],"text":"EBIR pearls PE treatment is risk-stratified; “large clot on CT” alone is not an indication. In unstable PE, the endpoint is restoring physiology quickly."}],"text":"pulmonary embolism catheter therapy b · vascular · 2.2.1.3.2 · high-yield · on-call risk-stratified catheter-directed therapy for acute pulmonary embolism as part of a multidisciplinary pe response pathway. indications high-risk pe with haemodynamic instability when systemic thrombolysis is contraindicated/failed or a catheter strategy is chosen by the treating team. selected intermediate-high-risk pe with deterioration or high-risk features after multidisciplinary assessment. contraindications / cautions no meaningful thrombus target or patient whose instability is not primarily due to pe. thrombolysis contraindications matter if catheter-directed lytic is used; mechanical thrombectomy may avoid lytic. work-up confirm ctpa clot burden and rv strain; clinical risk stratification, oxygen/haemodynamics. ecg/troponin/bnp and echo where useful; fbc/coagulation/renal function; therapeutic anticoagulation unless contraindicated. planning & technique femoral/jugular venous access; pulmonary angiography selectively. use aspiration/mechanical thrombectomy and/or local lysis according to anatomy, physiology and device availability. endpoint is haemodynamic/clinical improvement with safe thrombus reduction—not angiographic perfection. immediate post-care monitored/icu setting; continue anticoagulation; observe access, hb, oxygenation and rv status. follow-up define duration/cause of anticoagulation; evaluate persistent dyspnoea for chronic thromboembolic disease. complications & rescue pulmonary artery injury/haemoptysis, bleeding, arrhythmia, haemodynamic collapse, access complications. ebir pearls pe treatment is risk-stratified; “large clot on ct” alone is not an indication. in unstable pe, the endpoint is restoring physiology quickly.","oncall":true,"high":true},{"id":"p-B-14","cat":"B","title":"IVC filter placement / retrieval","sub":"B · Vascular · 2.2.1.3.2","summary":"Temporary mechanical PE protection in narrow indications, with an explicit retrieval plan at the time of insertion.","blocks":[{"h":"Indications","items":["Acute VTE with an absolute contraindication to therapeutic anticoagulation or major complication of anticoagulation; selected other indications are highly context dependent."],"text":"Indications Acute VTE with an absolute contraindication to therapeutic anticoagulation or major complication of anticoagulation; selected other indications are highly context dependent."},{"h":"Contraindications / cautions","items":["No valid indication or inability to access a suitable cava.","Caution: caval thrombosis, congenital variants, pregnancy, very large cava depending on device."],"text":"Contraindications / cautions No valid indication or inability to access a suitable cava. Caution: caval thrombosis, congenital variants, pregnancy, very large cava depending on device."},{"h":"Work-up","items":["Confirm VTE and reason anticoagulation cannot be used; document intended duration.","Review CT for caval anatomy/diameter, renal veins, duplication or thrombus; coagulation/FBC as appropriate."],"text":"Work-up Confirm VTE and reason anticoagulation cannot be used; document intended duration. Review CT for caval anatomy/diameter, renal veins, duplication or thrombus; coagulation/FBC as appropriate."},{"h":"Planning & technique","items":["US-guided jugular/femoral access; cavography when needed; deploy below renal veins unless specific indication requires otherwise.","At retrieval: assess tilt, penetration, thrombus and dwell-time complexity; use advanced techniques if required."],"text":"Planning & technique US-guided jugular/femoral access; cavography when needed; deploy below renal veins unless specific indication requires otherwise. At retrieval: assess tilt, penetration, thrombus and dwell-time complexity; use advanced techniques if required."},{"h":"Immediate post-care","items":["Restart anticoagulation when safe; create a trackable retrieval referral before discharge."],"text":"Immediate post-care Restart anticoagulation when safe; create a trackable retrieval referral before discharge."},{"h":"Follow-up","items":["Actively retrieve when PE risk/contraindication resolves; do not rely on passive recall."],"text":"Follow-up Actively retrieve when PE risk/contraindication resolves; do not rely on passive recall."},{"h":"Complications & rescue","items":["Caval thrombosis, migration, tilt, penetration, fracture/embolisation, difficult retrieval."],"text":"Complications & rescue Caval thrombosis, migration, tilt, penetration, fracture/embolisation, difficult retrieval."},{"h":"EBIR pearls","items":["The best filter is often the one that is retrieved promptly.","“Contraindication to anticoagulation” is the classic EBIR indication."],"text":"EBIR pearls The best filter is often the one that is retrieved promptly. “Contraindication to anticoagulation” is the classic EBIR indication."}],"text":"ivc filter placement / retrieval b · vascular · 2.2.1.3.2 temporary mechanical pe protection in narrow indications, with an explicit retrieval plan at the time of insertion. indications acute vte with an absolute contraindication to therapeutic anticoagulation or major complication of anticoagulation; selected other indications are highly context dependent. contraindications / cautions no valid indication or inability to access a suitable cava. caution: caval thrombosis, congenital variants, pregnancy, very large cava depending on device. work-up confirm vte and reason anticoagulation cannot be used; document intended duration. review ct for caval anatomy/diameter, renal veins, duplication or thrombus; coagulation/fbc as appropriate. planning & technique us-guided jugular/femoral access; cavography when needed; deploy below renal veins unless specific indication requires otherwise. at retrieval: assess tilt, penetration, thrombus and dwell-time complexity; use advanced techniques if required. immediate post-care restart anticoagulation when safe; create a trackable retrieval referral before discharge. follow-up actively retrieve when pe risk/contraindication resolves; do not rely on passive recall. complications & rescue caval thrombosis, migration, tilt, penetration, fracture/embolisation, difficult retrieval. ebir pearls the best filter is often the one that is retrieved promptly. “contraindication to anticoagulation” is the classic ebir indication.","oncall":false,"high":false},{"id":"p-B-15","cat":"B","title":"TIPS","sub":"B · Vascular · 2.2.1.3.4.1 · HIGH-YIELD","summary":"Portosystemic decompression for selected portal-hypertension complications with careful liver, cardiac and encephalopathy assessment.","blocks":[{"h":"Indications","items":["Acute variceal bleeding in selected high-risk/failed endoscopic cases and rescue situations.","Refractory/recurrent ascites or hydrothorax in appropriately selected patients.","Selected portal hypertensive complications."],"text":"Indications Acute variceal bleeding in selected high-risk/failed endoscopic cases and rescue situations. Refractory/recurrent ascites or hydrothorax in appropriately selected patients. Selected portal hypertensive complications."},{"h":"Contraindications / cautions","items":["Severe right-heart failure or severe pulmonary hypertension, uncontrolled systemic infection, severe liver failure where TIPS would be futile/harmful.","Relative: recurrent/refractory encephalopathy, biliary obstruction, extensive hepatic malignancy or anatomy that makes safe creation difficult."],"text":"Contraindications / cautions Severe right-heart failure or severe pulmonary hypertension, uncontrolled systemic infection, severe liver failure where TIPS would be futile/harmful. Relative: recurrent/refractory encephalopathy, biliary obstruction, extensive hepatic malignancy or anatomy that makes safe creation difficult."},{"h":"Work-up","items":["Clinical: indication, encephalopathy, ascites, transplant candidacy, infection.","Labs: FBC, INR, LFT/albumin/bilirubin, renal function/electrolytes; calculate MELD-type risk assessment.","Doppler/CT/MRI portal/hepatic vein anatomy and patency; echocardiographic cardiac assessment."],"text":"Work-up Clinical: indication, encephalopathy, ascites, transplant candidacy, infection. Labs: FBC, INR, LFT/albumin/bilirubin, renal function/electrolytes; calculate MELD-type risk assessment. Doppler/CT/MRI portal/hepatic vein anatomy and patency; echocardiographic cardiac assessment."},{"h":"Planning & technique","items":["Right IJ access → hepatic vein → portal puncture; portal venography and pressure measurements.","Deploy covered stent-graft, dilate to achieve adequate decompression while balancing encephalopathy risk.","Recheck portosystemic gradient and exclude complications."],"text":"Planning & technique Right IJ access → hepatic vein → portal puncture; portal venography and pressure measurements. Deploy covered stent-graft, dilate to achieve adequate decompression while balancing encephalopathy risk. Recheck portosystemic gradient and exclude complications."},{"h":"Immediate post-care","items":["Monitor bleeding, haemodynamics, liver/renal function and encephalopathy.","Doppler baseline according to institutional protocol; adjust diuretics/encephalopathy therapy with hepatology."],"text":"Immediate post-care Monitor bleeding, haemodynamics, liver/renal function and encephalopathy. Doppler baseline according to institutional protocol; adjust diuretics/encephalopathy therapy with hepatology."},{"h":"Follow-up","items":["Clinical response + Doppler surveillance; investigate recurrent portal-hypertension symptoms for stenosis/thrombosis."],"text":"Follow-up Clinical response + Doppler surveillance; investigate recurrent portal-hypertension symptoms for stenosis/thrombosis."},{"h":"Complications & rescue","items":["Hepatic encephalopathy, liver failure, heart failure, haemoperitoneum/capsular puncture, biliary fistula, haemolysis, stent dysfunction."],"text":"Complications & rescue Hepatic encephalopathy, liver failure, heart failure, haemoperitoneum/capsular puncture, biliary fistula, haemolysis, stent dysfunction."},{"h":"EBIR pearls","items":["Pre-TIPS cardiac assessment is not optional.","State the pressure-gradient concept and balance decompression against encephalopathy."],"text":"EBIR pearls Pre-TIPS cardiac assessment is not optional. State the pressure-gradient concept and balance decompression against encephalopathy."}],"text":"tips b · vascular · 2.2.1.3.4.1 · high-yield portosystemic decompression for selected portal-hypertension complications with careful liver, cardiac and encephalopathy assessment. indications acute variceal bleeding in selected high-risk/failed endoscopic cases and rescue situations. refractory/recurrent ascites or hydrothorax in appropriately selected patients. selected portal hypertensive complications. contraindications / cautions severe right-heart failure or severe pulmonary hypertension, uncontrolled systemic infection, severe liver failure where tips would be futile/harmful. relative: recurrent/refractory encephalopathy, biliary obstruction, extensive hepatic malignancy or anatomy that makes safe creation difficult. work-up clinical: indication, encephalopathy, ascites, transplant candidacy, infection. labs: fbc, inr, lft/albumin/bilirubin, renal function/electrolytes; calculate meld-type risk assessment. doppler/ct/mri portal/hepatic vein anatomy and patency; echocardiographic cardiac assessment. planning & technique right ij access → hepatic vein → portal puncture; portal venography and pressure measurements. deploy covered stent-graft, dilate to achieve adequate decompression while balancing encephalopathy risk. recheck portosystemic gradient and exclude complications. immediate post-care monitor bleeding, haemodynamics, liver/renal function and encephalopathy. doppler baseline according to institutional protocol; adjust diuretics/encephalopathy therapy with hepatology. follow-up clinical response + doppler surveillance; investigate recurrent portal-hypertension symptoms for stenosis/thrombosis. complications & rescue hepatic encephalopathy, liver failure, heart failure, haemoperitoneum/capsular puncture, biliary fistula, haemolysis, stent dysfunction. ebir pearls pre-tips cardiac assessment is not optional. state the pressure-gradient concept and balance decompression against encephalopathy.","oncall":false,"high":true},{"id":"p-B-16","cat":"B","title":"BRTO / retrograde variceal obliteration","sub":"B · Vascular · 2.2.1.3.4.1","summary":"Obliteration of gastric varices through a spontaneous portosystemic shunt, often complementary to rather than interchangeable with TIPS.","blocks":[{"h":"Indications","items":["Gastric variceal bleeding or high-risk gastric varices with a suitable gastrorenal/splenorenal shunt.","Selected hepatic encephalopathy driven by a large spontaneous portosystemic shunt."],"text":"Indications Gastric variceal bleeding or high-risk gastric varices with a suitable gastrorenal/splenorenal shunt. Selected hepatic encephalopathy driven by a large spontaneous portosystemic shunt."},{"h":"Contraindications / cautions","items":["No accessible shunt anatomy.","Portal/mesenteric venous thrombosis or severe portal hypertension may make shunt occlusion hazardous; assess individually."],"text":"Contraindications / cautions No accessible shunt anatomy. Portal/mesenteric venous thrombosis or severe portal hypertension may make shunt occlusion hazardous; assess individually."},{"h":"Work-up","items":["Portal venous CT/MRI: varices, shunt anatomy, portal patency, ascites.","Liver/renal function, FBC/coagulation; endoscopic/hepatology context."],"text":"Work-up Portal venous CT/MRI: varices, shunt anatomy, portal patency, ascites. Liver/renal function, FBC/coagulation; endoscopic/hepatology context."},{"h":"Planning & technique","items":["Retrograde shunt catheterisation; occlude outflow and embolise/sclerose variceal complex using local BRTO/PARTO/CARTO technique.","Confirm no dangerous systemic escape pathways."],"text":"Planning & technique Retrograde shunt catheterisation; occlude outflow and embolise/sclerose variceal complex using local BRTO/PARTO/CARTO technique. Confirm no dangerous systemic escape pathways."},{"h":"Immediate post-care","items":["Monitor haemoglobin, haemolysis/renal effects where sclerosants used, portal-hypertension symptoms."],"text":"Immediate post-care Monitor haemoglobin, haemolysis/renal effects where sclerosants used, portal-hypertension symptoms."},{"h":"Follow-up","items":["Endoscopic/imaging follow-up; watch for worsening oesophageal varices/ascites due to increased portal pressure."],"text":"Follow-up Endoscopic/imaging follow-up; watch for worsening oesophageal varices/ascites due to increased portal pressure."},{"h":"Complications & rescue","items":["Haemoglobinuria/renal injury with some sclerosants, PE/non-target embolisation, worsening ascites/oesophageal varices, portal thrombosis."],"text":"Complications & rescue Haemoglobinuria/renal injury with some sclerosants, PE/non-target embolisation, worsening ascites/oesophageal varices, portal thrombosis."},{"h":"EBIR pearls","items":["TIPS decreases portal pressure; BRTO occludes a decompressive shunt and may increase it."],"text":"EBIR pearls TIPS decreases portal pressure; BRTO occludes a decompressive shunt and may increase it."}],"text":"brto / retrograde variceal obliteration b · vascular · 2.2.1.3.4.1 obliteration of gastric varices through a spontaneous portosystemic shunt, often complementary to rather than interchangeable with tips. indications gastric variceal bleeding or high-risk gastric varices with a suitable gastrorenal/splenorenal shunt. selected hepatic encephalopathy driven by a large spontaneous portosystemic shunt. contraindications / cautions no accessible shunt anatomy. portal/mesenteric venous thrombosis or severe portal hypertension may make shunt occlusion hazardous; assess individually. work-up portal venous ct/mri: varices, shunt anatomy, portal patency, ascites. liver/renal function, fbc/coagulation; endoscopic/hepatology context. planning & technique retrograde shunt catheterisation; occlude outflow and embolise/sclerose variceal complex using local brto/parto/carto technique. confirm no dangerous systemic escape pathways. immediate post-care monitor haemoglobin, haemolysis/renal effects where sclerosants used, portal-hypertension symptoms. follow-up endoscopic/imaging follow-up; watch for worsening oesophageal varices/ascites due to increased portal pressure. complications & rescue haemoglobinuria/renal injury with some sclerosants, pe/non-target embolisation, worsening ascites/oesophageal varices, portal thrombosis. ebir pearls tips decreases portal pressure; brto occludes a decompressive shunt and may increase it.","oncall":false,"high":false},{"id":"p-B-17","cat":"B","title":"Budd–Chiari intervention","sub":"B · Vascular · 2.2.1.3.4.2","summary":"Step-up endovascular management of hepatic venous outflow obstruction, from angioplasty/stenting to TIPS.","blocks":[{"h":"Indications","items":["Symptomatic hepatic vein/IVC obstruction with a treatable short stenosis/occlusion; TIPS for diffuse hepatic venous occlusion or failure of lesser therapy."],"text":"Indications Symptomatic hepatic vein/IVC obstruction with a treatable short stenosis/occlusion; TIPS for diffuse hepatic venous occlusion or failure of lesser therapy."},{"h":"Contraindications / cautions","items":["End-stage liver failure requiring transplant rather than endovascular salvage; uncontrolled infection."],"text":"Contraindications / cautions End-stage liver failure requiring transplant rather than endovascular salvage; uncontrolled infection."},{"h":"Work-up","items":["Doppler + CT/MRI to define hepatic vein/IVC obstruction, collaterals and portal patency.","Liver/renal function, coagulation/FBC; thrombophilia/myeloproliferative work-up with hepatology/haematology."],"text":"Work-up Doppler + CT/MRI to define hepatic vein/IVC obstruction, collaterals and portal patency. Liver/renal function, coagulation/FBC; thrombophilia/myeloproliferative work-up with hepatology/haematology."},{"h":"Planning & technique","items":["Venography/pressure measurements; recanalise and angioplasty ± stent focal obstruction.","TIPS/DIPS may be needed for diffuse disease."],"text":"Planning & technique Venography/pressure measurements; recanalise and angioplasty ± stent focal obstruction. TIPS/DIPS may be needed for diffuse disease."},{"h":"Immediate post-care","items":["Anticoagulation when appropriate; monitor liver function, bleeding and stent patency."],"text":"Immediate post-care Anticoagulation when appropriate; monitor liver function, bleeding and stent patency."},{"h":"Follow-up","items":["Doppler surveillance and underlying prothrombotic disease treatment."],"text":"Follow-up Doppler surveillance and underlying prothrombotic disease treatment."},{"h":"Complications & rescue","items":["Bleeding, capsular perforation, stent thrombosis, liver failure, encephalopathy after TIPS."],"text":"Complications & rescue Bleeding, capsular perforation, stent thrombosis, liver failure, encephalopathy after TIPS."},{"h":"EBIR pearls","items":["Think step-up: anticoagulation → recanalisation/angioplasty → TIPS → transplant depending on anatomy and response."],"text":"EBIR pearls Think step-up: anticoagulation → recanalisation/angioplasty → TIPS → transplant depending on anatomy and response."}],"text":"budd–chiari intervention b · vascular · 2.2.1.3.4.2 step-up endovascular management of hepatic venous outflow obstruction, from angioplasty/stenting to tips. indications symptomatic hepatic vein/ivc obstruction with a treatable short stenosis/occlusion; tips for diffuse hepatic venous occlusion or failure of lesser therapy. contraindications / cautions end-stage liver failure requiring transplant rather than endovascular salvage; uncontrolled infection. work-up doppler + ct/mri to define hepatic vein/ivc obstruction, collaterals and portal patency. liver/renal function, coagulation/fbc; thrombophilia/myeloproliferative work-up with hepatology/haematology. planning & technique venography/pressure measurements; recanalise and angioplasty ± stent focal obstruction. tips/dips may be needed for diffuse disease. immediate post-care anticoagulation when appropriate; monitor liver function, bleeding and stent patency. follow-up doppler surveillance and underlying prothrombotic disease treatment. complications & rescue bleeding, capsular perforation, stent thrombosis, liver failure, encephalopathy after tips. ebir pearls think step-up: anticoagulation → recanalisation/angioplasty → tips → transplant depending on anatomy and response.","oncall":false,"high":false},{"id":"p-B-18","cat":"B","title":"Dialysis fistula/graft intervention","sub":"B · Vascular · 2.2.1.3.6 · HIGH-YIELD","summary":"Salvage of dysfunctional haemodialysis access by treating the haemodynamically significant lesion and preserving future access options.","blocks":[{"h":"Indications","items":["Clinical dialysis dysfunction with corresponding stenosis: poor flows, high venous pressures, difficult cannulation, prolonged bleeding, recirculation or thrombosis."],"text":"Indications Clinical dialysis dysfunction with corresponding stenosis: poor flows, high venous pressures, difficult cannulation, prolonged bleeding, recirculation or thrombosis."},{"h":"Contraindications / cautions","items":["Infected graft/access usually requires surgical/infectious management.","No clinical dysfunction plus incidental stenosis generally does not justify routine angioplasty."],"text":"Contraindications / cautions Infected graft/access usually requires surgical/infectious management. No clinical dysfunction plus incidental stenosis generally does not justify routine angioplasty."},{"h":"Work-up","items":["Examine access: pulse/thrill, aneurysm, infection, collateral veins, arm swelling.","Review dialysis flow/pressure trends; duplex when useful; potassium and coagulation as clinically indicated."],"text":"Work-up Examine access: pulse/thrill, aneurysm, infection, collateral veins, arm swelling. Review dialysis flow/pressure trends; duplex when useful; potassium and coagulation as clinically indicated."},{"h":"Planning & technique","items":["Fistulography from arterial inflow through central veins as indicated.","Angioplasty causative stenosis; high-pressure/cutting/scoring or stent-graft for selected resistant/recurrent lesions.","For thrombosis: thrombectomy + correct underlying stenosis before declaring success."],"text":"Planning & technique Fistulography from arterial inflow through central veins as indicated. Angioplasty causative stenosis; high-pressure/cutting/scoring or stent-graft for selected resistant/recurrent lesions. For thrombosis: thrombectomy + correct underlying stenosis before declaring success."},{"h":"Immediate post-care","items":["Check thrill, haemostasis, distal hand perfusion and ability to dialyse."],"text":"Immediate post-care Check thrill, haemostasis, distal hand perfusion and ability to dialyse."},{"h":"Follow-up","items":["Dialysis-unit clinical monitoring; repeat imaging/intervention based on recurrent dysfunction, not scheduled angiography alone."],"text":"Follow-up Dialysis-unit clinical monitoring; repeat imaging/intervention based on recurrent dysfunction, not scheduled angiography alone."},{"h":"Complications & rescue","items":["Venous rupture → balloon tamponade ± stent-graft.","Arterial embolisation, access thrombosis, steal/hand ischaemia, haematoma."],"text":"Complications & rescue Venous rupture → balloon tamponade ± stent-graft. Arterial embolisation, access thrombosis, steal/hand ischaemia, haematoma."},{"h":"EBIR pearls","items":["A thrombosed access nearly always has a causative stenosis—thrombus removal alone is incomplete treatment."],"text":"EBIR pearls A thrombosed access nearly always has a causative stenosis—thrombus removal alone is incomplete treatment."}],"text":"dialysis fistula/graft intervention b · vascular · 2.2.1.3.6 · high-yield salvage of dysfunctional haemodialysis access by treating the haemodynamically significant lesion and preserving future access options. indications clinical dialysis dysfunction with corresponding stenosis: poor flows, high venous pressures, difficult cannulation, prolonged bleeding, recirculation or thrombosis. contraindications / cautions infected graft/access usually requires surgical/infectious management. no clinical dysfunction plus incidental stenosis generally does not justify routine angioplasty. work-up examine access: pulse/thrill, aneurysm, infection, collateral veins, arm swelling. review dialysis flow/pressure trends; duplex when useful; potassium and coagulation as clinically indicated. planning & technique fistulography from arterial inflow through central veins as indicated. angioplasty causative stenosis; high-pressure/cutting/scoring or stent-graft for selected resistant/recurrent lesions. for thrombosis: thrombectomy + correct underlying stenosis before declaring success. immediate post-care check thrill, haemostasis, distal hand perfusion and ability to dialyse. follow-up dialysis-unit clinical monitoring; repeat imaging/intervention based on recurrent dysfunction, not scheduled angiography alone. complications & rescue venous rupture → balloon tamponade ± stent-graft. arterial embolisation, access thrombosis, steal/hand ischaemia, haematoma. ebir pearls a thrombosed access nearly always has a causative stenosis—thrombus removal alone is incomplete treatment.","oncall":false,"high":true},{"id":"p-B-19","cat":"B","title":"Central venous access / SVC stenting","sub":"B · Vascular · 2.2.1.3.7","summary":"Safe image-guided venous access and treatment of symptomatic central venous obstruction.","blocks":[{"h":"Indications","items":["Reliable venous access for therapy/dialysis when clinically indicated.","SVC/central venous obstruction causing significant symptoms, often malignant or device-related."],"text":"Indications Reliable venous access for therapy/dialysis when clinically indicated. SVC/central venous obstruction causing significant symptoms, often malignant or device-related."},{"h":"Contraindications / cautions","items":["Active infection at proposed tunnel/pocket; no suitable venous route; uncorrectable coagulation issue depending on procedure."],"text":"Contraindications / cautions Active infection at proposed tunnel/pocket; no suitable venous route; uncorrectable coagulation issue depending on procedure."},{"h":"Work-up","items":["Confirm indication, expected duration and infusion/device requirements.","US venous patency; review prior devices and CT for central obstruction when relevant.","FBC/coagulation and infection status as appropriate."],"text":"Work-up Confirm indication, expected duration and infusion/device requirements. US venous patency; review prior devices and CT for central obstruction when relevant. FBC/coagulation and infection status as appropriate."},{"h":"Planning & technique","items":["Real-time US puncture; fluoroscopic tip position; sterile tunnel/pocket technique.","For SVC obstruction: venography ± CT road map; angioplasty/stent across symptomatic obstruction while preserving key inflow."],"text":"Planning & technique Real-time US puncture; fluoroscopic tip position; sterile tunnel/pocket technique. For SVC obstruction: venography ± CT road map; angioplasty/stent across symptomatic obstruction while preserving key inflow."},{"h":"Immediate post-care","items":["Chest imaging only when clinically/technically indicated by access route/local protocol.","Line function, pocket/tunnel and arm/neck swelling review."],"text":"Immediate post-care Chest imaging only when clinically/technically indicated by access route/local protocol. Line function, pocket/tunnel and arm/neck swelling review."},{"h":"Follow-up","items":["Line care and prompt assessment for infection/thrombosis; stent re-evaluation if symptoms recur."],"text":"Follow-up Line care and prompt assessment for infection/thrombosis; stent re-evaluation if symptoms recur."},{"h":"Complications & rescue","items":["Pneumothorax/haemothorax, arterial puncture, malposition, infection, thrombosis, pinch-off/fracture, air embolism.","SVC stent migration/rupture and cardiac tamponade are rare but severe."],"text":"Complications & rescue Pneumothorax/haemothorax, arterial puncture, malposition, infection, thrombosis, pinch-off/fracture, air embolism. SVC stent migration/rupture and cardiac tamponade are rare but severe."},{"h":"EBIR pearls","items":["Ultrasound-guided IJ access avoids many historic line complications.","For SVC syndrome, treat symptoms and anatomy; not every radiologic stenosis needs a stent."],"text":"EBIR pearls Ultrasound-guided IJ access avoids many historic line complications. For SVC syndrome, treat symptoms and anatomy; not every radiologic stenosis needs a stent."}],"text":"central venous access / svc stenting b · vascular · 2.2.1.3.7 safe image-guided venous access and treatment of symptomatic central venous obstruction. indications reliable venous access for therapy/dialysis when clinically indicated. svc/central venous obstruction causing significant symptoms, often malignant or device-related. contraindications / cautions active infection at proposed tunnel/pocket; no suitable venous route; uncorrectable coagulation issue depending on procedure. work-up confirm indication, expected duration and infusion/device requirements. us venous patency; review prior devices and ct for central obstruction when relevant. fbc/coagulation and infection status as appropriate. planning & technique real-time us puncture; fluoroscopic tip position; sterile tunnel/pocket technique. for svc obstruction: venography ± ct road map; angioplasty/stent across symptomatic obstruction while preserving key inflow. immediate post-care chest imaging only when clinically/technically indicated by access route/local protocol. line function, pocket/tunnel and arm/neck swelling review. follow-up line care and prompt assessment for infection/thrombosis; stent re-evaluation if symptoms recur. complications & rescue pneumothorax/haemothorax, arterial puncture, malposition, infection, thrombosis, pinch-off/fracture, air embolism. svc stent migration/rupture and cardiac tamponade are rare but severe. ebir pearls ultrasound-guided ij access avoids many historic line complications. for svc syndrome, treat symptoms and anatomy; not every radiologic stenosis needs a stent.","oncall":false,"high":false},{"id":"p-B-20","cat":"B","title":"Adrenal venous sampling","sub":"B · Vascular · 2.2.1.3.8","summary":"Functional lateralisation test for primary aldosteronism requiring protocol discipline and technically successful bilateral sampling.","blocks":[{"h":"Indications","items":["Biochemically confirmed primary aldosteronism when lateralisation will alter management and imaging alone is insufficient."],"text":"Indications Biochemically confirmed primary aldosteronism when lateralisation will alter management and imaging alone is insufficient."},{"h":"Contraindications / cautions","items":["Patient not a surgical candidate or result will not change management."],"text":"Contraindications / cautions Patient not a surgical candidate or result will not change management."},{"h":"Work-up","items":["Endocrine confirmation and medication/potassium optimisation per endocrine protocol.","Review adrenal CT for masses and right adrenal vein anatomy.","Know whether cosyntropin-stimulated or unstimulated protocol is used and exact timed sample requirements."],"text":"Work-up Endocrine confirmation and medication/potassium optimisation per endocrine protocol. Review adrenal CT for masses and right adrenal vein anatomy. Know whether cosyntropin-stimulated or unstimulated protocol is used and exact timed sample requirements."},{"h":"Planning & technique","items":["Right adrenal vein is the technical challenge; use careful venography with minimal injection.","Sample bilateral adrenal veins and peripheral vein according to protocol; label immediately and unambiguously."],"text":"Planning & technique Right adrenal vein is the technical challenge; use careful venography with minimal injection. Sample bilateral adrenal veins and peripheral vein according to protocol; label immediately and unambiguously."},{"h":"Immediate post-care","items":["Short access-site observation."],"text":"Immediate post-care Short access-site observation."},{"h":"Follow-up","items":["Interpret with endocrinology using selectivity and lateralisation indices appropriate to the local protocol."],"text":"Follow-up Interpret with endocrinology using selectivity and lateralisation indices appropriate to the local protocol."},{"h":"Complications & rescue","items":["Adrenal vein rupture/haemorrhage, thrombosis, access complications; failed/nonselective sampling."],"text":"Complications & rescue Adrenal vein rupture/haemorrhage, thrombosis, access complications; failed/nonselective sampling."},{"h":"EBIR pearls","items":["A beautifully placed catheter is irrelevant if the sample is mislabeled or timing is wrong."],"text":"EBIR pearls A beautifully placed catheter is irrelevant if the sample is mislabeled or timing is wrong."}],"text":"adrenal venous sampling b · vascular · 2.2.1.3.8 functional lateralisation test for primary aldosteronism requiring protocol discipline and technically successful bilateral sampling. indications biochemically confirmed primary aldosteronism when lateralisation will alter management and imaging alone is insufficient. contraindications / cautions patient not a surgical candidate or result will not change management. work-up endocrine confirmation and medication/potassium optimisation per endocrine protocol. review adrenal ct for masses and right adrenal vein anatomy. know whether cosyntropin-stimulated or unstimulated protocol is used and exact timed sample requirements. planning & technique right adrenal vein is the technical challenge; use careful venography with minimal injection. sample bilateral adrenal veins and peripheral vein according to protocol; label immediately and unambiguously. immediate post-care short access-site observation. follow-up interpret with endocrinology using selectivity and lateralisation indices appropriate to the local protocol. complications & rescue adrenal vein rupture/haemorrhage, thrombosis, access complications; failed/nonselective sampling. ebir pearls a beautifully placed catheter is irrelevant if the sample is mislabeled or timing is wrong.","oncall":false,"high":false},{"id":"p-C-0","cat":"C","title":"Image-guided percutaneous biopsy","sub":"C · Non-vascular · 2.2.2.1 · HIGH-YIELD","summary":"Tissue acquisition planned around diagnostic yield, safe trajectory, pathology requirements and management of haemorrhage/pneumothorax.","blocks":[{"h":"Indications","items":["Tissue diagnosis will change staging, treatment or management and there is a safely accessible target."],"text":"Indications Tissue diagnosis will change staging, treatment or management and there is a safely accessible target."},{"h":"Contraindications / cautions","items":["No management consequence, inaccessible target, or uncorrectable bleeding risk for the chosen organ/route.","Caution: severe pulmonary hypertension/poor respiratory reserve for lung biopsy, highly vascular lesions, suspected pheochromocytoma without preparation."],"text":"Contraindications / cautions No management consequence, inaccessible target, or uncorrectable bleeding risk for the chosen organ/route. Caution: severe pulmonary hypertension/poor respiratory reserve for lung biopsy, highly vascular lesions, suspected pheochromocytoma without preparation."},{"h":"Work-up","items":["Review all imaging and choose viable target, safest route and modality.","Clarify pathology requirements: histology, cytology, microbiology, molecular testing, lymphoma flow cytometry etc.","FBC/coagulation according to bleeding risk; antithrombotic plan; consent organ-specific risks."],"text":"Work-up Review all imaging and choose viable target, safest route and modality. Clarify pathology requirements: histology, cytology, microbiology, molecular testing, lymphoma flow cytometry etc. FBC/coagulation according to bleeding risk; antithrombotic plan; consent organ-specific risks."},{"h":"Planning & technique","items":["Use coaxial technique for repeated cores where appropriate.","Avoid pleura, bowel, major vessels and tumour seeding pathways; for suspected sarcoma coordinate biopsy tract with surgical team.","Confirm specimen adequacy/handling before ending the case when possible."],"text":"Planning & technique Use coaxial technique for repeated cores where appropriate. Avoid pleura, bowel, major vessels and tumour seeding pathways; for suspected sarcoma coordinate biopsy tract with surgical team. Confirm specimen adequacy/handling before ending the case when possible."},{"h":"Immediate post-care","items":["Organ-specific monitoring: chest imaging/US for lung, haemoglobin/pain for solid organs.","Provide escalation instructions for dyspnoea, bleeding, fever or severe pain."],"text":"Immediate post-care Organ-specific monitoring: chest imaging/US for lung, haemoglobin/pain for solid organs. Provide escalation instructions for dyspnoea, bleeding, fever or severe pain."},{"h":"Follow-up","items":["Track pathology result and adequacy; repeat biopsy if non-diagnostic only after reviewing why it failed."],"text":"Follow-up Track pathology result and adequacy; repeat biopsy if non-diagnostic only after reviewing why it failed."},{"h":"Complications & rescue","items":["Bleeding/haematoma/haemoperitoneum, pneumothorax/air embolism (lung), infection, adjacent-organ injury, tumour seeding (rare)."],"text":"Complications & rescue Bleeding/haematoma/haemoperitoneum, pneumothorax/air embolism (lung), infection, adjacent-organ injury, tumour seeding (rare)."},{"h":"EBIR pearls","items":["The diagnostic question determines the specimen—not the needle you happen to have.","For sarcoma, biopsy trajectory is part of the future resection."],"text":"EBIR pearls The diagnostic question determines the specimen—not the needle you happen to have. For sarcoma, biopsy trajectory is part of the future resection."}],"text":"image-guided percutaneous biopsy c · non-vascular · 2.2.2.1 · high-yield tissue acquisition planned around diagnostic yield, safe trajectory, pathology requirements and management of haemorrhage/pneumothorax. indications tissue diagnosis will change staging, treatment or management and there is a safely accessible target. contraindications / cautions no management consequence, inaccessible target, or uncorrectable bleeding risk for the chosen organ/route. caution: severe pulmonary hypertension/poor respiratory reserve for lung biopsy, highly vascular lesions, suspected pheochromocytoma without preparation. work-up review all imaging and choose viable target, safest route and modality. clarify pathology requirements: histology, cytology, microbiology, molecular testing, lymphoma flow cytometry etc. fbc/coagulation according to bleeding risk; antithrombotic plan; consent organ-specific risks. planning & technique use coaxial technique for repeated cores where appropriate. avoid pleura, bowel, major vessels and tumour seeding pathways; for suspected sarcoma coordinate biopsy tract with surgical team. confirm specimen adequacy/handling before ending the case when possible. immediate post-care organ-specific monitoring: chest imaging/us for lung, haemoglobin/pain for solid organs. provide escalation instructions for dyspnoea, bleeding, fever or severe pain. follow-up track pathology result and adequacy; repeat biopsy if non-diagnostic only after reviewing why it failed. complications & rescue bleeding/haematoma/haemoperitoneum, pneumothorax/air embolism (lung), infection, adjacent-organ injury, tumour seeding (rare). ebir pearls the diagnostic question determines the specimen—not the needle you happen to have. for sarcoma, biopsy trajectory is part of the future resection.","oncall":false,"high":true},{"id":"p-C-1","cat":"C","title":"Abscess / collection drainage","sub":"C · Non-vascular · 2.2.2.3 · HIGH-YIELD · ON-CALL","summary":"Source-control procedure requiring a safe access route, appropriate catheter strategy, microbiology and active drain follow-up.","blocks":[{"h":"Indications","items":["Drainable infected or symptomatic collection where percutaneous source control is appropriate.","Diagnostic aspiration when the nature of a collection will change management."],"text":"Indications Drainable infected or symptomatic collection where percutaneous source control is appropriate. Diagnostic aspiration when the nature of a collection will change management."},{"h":"Contraindications / cautions","items":["No safe route, non-drainable phlegmon, or collection unlikely to benefit from drainage.","Coagulopathy and sepsis are optimised in parallel according to urgency."],"text":"Contraindications / cautions No safe route, non-drainable phlegmon, or collection unlikely to benefit from drainage. Coagulopathy and sepsis are optimised in parallel according to urgency."},{"h":"Work-up","items":["Review imaging for size, loculation, contents and bowel/pleural/vascular relationships.","FBC/CRP, coagulation, cultures/antibiotics; ensure specimen plan.","Choose US/CT/fluoro guidance and transorgan route only when justified."],"text":"Work-up Review imaging for size, loculation, contents and bowel/pleural/vascular relationships. FBC/CRP, coagulation, cultures/antibiotics; ensure specimen plan. Choose US/CT/fluoro guidance and transorgan route only when justified."},{"h":"Planning & technique","items":["Seldinger or trocar depending on target; place sideholes fully within collection.","Send aspirate promptly for microbiology; consider multiple drains, larger calibre, flushing or fibrinolytic strategy for complex cavities."],"text":"Planning & technique Seldinger or trocar depending on target; place sideholes fully within collection. Send aspirate promptly for microbiology; consider multiple drains, larger calibre, flushing or fibrinolytic strategy for complex cavities."},{"h":"Immediate post-care","items":["Record output and character; prescribe flush regimen and securement.","Monitor sepsis response, bleeding and drain-related pain."],"text":"Immediate post-care Record output and character; prescribe flush regimen and securement. Monitor sepsis response, bleeding and drain-related pain."},{"h":"Follow-up","items":["Clinical/lab response + drain output; CT/US if non-resolving.","Remove when source controlled and output/imaging criteria are met; check for fistula when output persists."],"text":"Follow-up Clinical/lab response + drain output; CT/US if non-resolving. Remove when source controlled and output/imaging criteria are met; check for fistula when output persists."},{"h":"Complications & rescue","items":["Bleeding, bowel/solid-organ injury, pleural transgression/empyema, septic shock, drain dislodgement/occlusion, fistula."],"text":"Complications & rescue Bleeding, bowel/solid-organ injury, pleural transgression/empyema, septic shock, drain dislodgement/occlusion, fistula."},{"h":"EBIR pearls","items":["Drain management after insertion is part of the procedure.","Persistent output may be telling you there is a fistula, not that the catheter is “working well”."],"text":"EBIR pearls Drain management after insertion is part of the procedure. Persistent output may be telling you there is a fistula, not that the catheter is “working well”."}],"text":"abscess / collection drainage c · non-vascular · 2.2.2.3 · high-yield · on-call source-control procedure requiring a safe access route, appropriate catheter strategy, microbiology and active drain follow-up. indications drainable infected or symptomatic collection where percutaneous source control is appropriate. diagnostic aspiration when the nature of a collection will change management. contraindications / cautions no safe route, non-drainable phlegmon, or collection unlikely to benefit from drainage. coagulopathy and sepsis are optimised in parallel according to urgency. work-up review imaging for size, loculation, contents and bowel/pleural/vascular relationships. fbc/crp, coagulation, cultures/antibiotics; ensure specimen plan. choose us/ct/fluoro guidance and transorgan route only when justified. planning & technique seldinger or trocar depending on target; place sideholes fully within collection. send aspirate promptly for microbiology; consider multiple drains, larger calibre, flushing or fibrinolytic strategy for complex cavities. immediate post-care record output and character; prescribe flush regimen and securement. monitor sepsis response, bleeding and drain-related pain. follow-up clinical/lab response + drain output; ct/us if non-resolving. remove when source controlled and output/imaging criteria are met; check for fistula when output persists. complications & rescue bleeding, bowel/solid-organ injury, pleural transgression/empyema, septic shock, drain dislodgement/occlusion, fistula. ebir pearls drain management after insertion is part of the procedure. persistent output may be telling you there is a fistula, not that the catheter is “working well”.","oncall":true,"high":true},{"id":"p-C-2","cat":"C","title":"Pleural drain / chest tube","sub":"C · Non-vascular · 2.2.2.3 · ON-CALL","summary":"Image-guided pleural drainage with attention to indication, safe triangle/trajectory, drainage system and persistent air leak.","blocks":[{"h":"Indications","items":["Symptomatic or clinically significant pleural fluid, empyema/complicated parapneumonic effusion, pneumothorax requiring drainage."],"text":"Indications Symptomatic or clinically significant pleural fluid, empyema/complicated parapneumonic effusion, pneumothorax requiring drainage."},{"h":"Contraindications / cautions","items":["Very small/asymptomatic collection not requiring drainage; no safe window.","Coagulopathy considered according to urgency and route."],"text":"Contraindications / cautions Very small/asymptomatic collection not requiring drainage; no safe window. Coagulopathy considered according to urgency and route."},{"h":"Work-up","items":["US immediately before fluid drainage; CT for loculated/complex collections.","Review FBC/coagulation and respiratory status; decide fluid tests."],"text":"Work-up US immediately before fluid drainage; CT for loculated/complex collections. Review FBC/coagulation and respiratory status; decide fluid tests."},{"h":"Planning & technique","items":["Enter above rib to avoid neurovascular bundle; ultrasound guidance for fluid.","Place sideholes within pleural space and connect to appropriate water-seal/suction system."],"text":"Planning & technique Enter above rib to avoid neurovascular bundle; ultrasound guidance for fluid. Place sideholes within pleural space and connect to appropriate water-seal/suction system."},{"h":"Immediate post-care","items":["Monitor respiratory status, drain swing/bubbling/output and pain; chest imaging as clinically required."],"text":"Immediate post-care Monitor respiratory status, drain swing/bubbling/output and pain; chest imaging as clinically required."},{"h":"Follow-up","items":["Evaluate persistent air leak, loculations and lung re-expansion; remove according to clinical/output/air-leak criteria."],"text":"Follow-up Evaluate persistent air leak, loculations and lung re-expansion; remove according to clinical/output/air-leak criteria."},{"h":"Complications & rescue","items":["Intercostal vessel injury/haemothorax, lung injury, infection, re-expansion pulmonary oedema, subcutaneous drain placement."],"text":"Complications & rescue Intercostal vessel injury/haemothorax, lung injury, infection, re-expansion pulmonary oedema, subcutaneous drain placement."},{"h":"EBIR pearls","items":["A drain is a system: catheter + sideholes + connections + bottle + patient position."],"text":"EBIR pearls A drain is a system: catheter + sideholes + connections + bottle + patient position."}],"text":"pleural drain / chest tube c · non-vascular · 2.2.2.3 · on-call image-guided pleural drainage with attention to indication, safe triangle/trajectory, drainage system and persistent air leak. indications symptomatic or clinically significant pleural fluid, empyema/complicated parapneumonic effusion, pneumothorax requiring drainage. contraindications / cautions very small/asymptomatic collection not requiring drainage; no safe window. coagulopathy considered according to urgency and route. work-up us immediately before fluid drainage; ct for loculated/complex collections. review fbc/coagulation and respiratory status; decide fluid tests. planning & technique enter above rib to avoid neurovascular bundle; ultrasound guidance for fluid. place sideholes within pleural space and connect to appropriate water-seal/suction system. immediate post-care monitor respiratory status, drain swing/bubbling/output and pain; chest imaging as clinically required. follow-up evaluate persistent air leak, loculations and lung re-expansion; remove according to clinical/output/air-leak criteria. complications & rescue intercostal vessel injury/haemothorax, lung injury, infection, re-expansion pulmonary oedema, subcutaneous drain placement. ebir pearls a drain is a system: catheter + sideholes + connections + bottle + patient position.","oncall":true,"high":false},{"id":"p-C-3","cat":"C","title":"Lymphangiography / lymphatic embolisation","sub":"C · Non-vascular · 2.2.2.2","summary":"Intranodal lymphangiography and targeted embolisation for postoperative or spontaneous lymphatic leaks.","blocks":[{"h":"Indications","items":["Persistent high-output chylothorax/chylous ascites or localised postoperative lymphatic leak not resolving with conservative measures."],"text":"Indications Persistent high-output chylothorax/chylous ascites or localised postoperative lymphatic leak not resolving with conservative measures."},{"h":"Contraindications / cautions","items":["No clear clinical indication; caution in severe respiratory compromise where oil-based contrast load may be poorly tolerated."],"text":"Contraindications / cautions No clear clinical indication; caution in severe respiratory compromise where oil-based contrast load may be poorly tolerated."},{"h":"Work-up","items":["Confirm chylous nature where relevant (triglycerides/chylomicrons); review operative history and cross-sectional imaging.","Plan intranodal access and likely leak level."],"text":"Work-up Confirm chylous nature where relevant (triglycerides/chylomicrons); review operative history and cross-sectional imaging. Plan intranodal access and likely leak level."},{"h":"Planning & technique","items":["Bilateral inguinal intranodal lymphangiography using controlled oil-based contrast injection.","Identify leak; thoracic duct/cisterna chyli access via transabdominal or retrograde route when needed; embolise leak/outflow."],"text":"Planning & technique Bilateral inguinal intranodal lymphangiography using controlled oil-based contrast injection. Identify leak; thoracic duct/cisterna chyli access via transabdominal or retrograde route when needed; embolise leak/outflow."},{"h":"Immediate post-care","items":["Monitor respiratory status and embolisation-related symptoms; continue dietary/medical therapy until output falls."],"text":"Immediate post-care Monitor respiratory status and embolisation-related symptoms; continue dietary/medical therapy until output falls."},{"h":"Follow-up","items":["Drain-output trend and imaging as needed; repeat intervention for persistent leak."],"text":"Follow-up Drain-output trend and imaging as needed; repeat intervention for persistent leak."},{"h":"Complications & rescue","items":["Oil embolisation, infection, access bleeding, non-target embolisation, rare neurologic/pulmonary complications."],"text":"Complications & rescue Oil embolisation, infection, access bleeding, non-target embolisation, rare neurologic/pulmonary complications."},{"h":"EBIR pearls","items":["Diagnostic lymphangiography alone can be therapeutic in some leaks."],"text":"EBIR pearls Diagnostic lymphangiography alone can be therapeutic in some leaks."}],"text":"lymphangiography / lymphatic embolisation c · non-vascular · 2.2.2.2 intranodal lymphangiography and targeted embolisation for postoperative or spontaneous lymphatic leaks. indications persistent high-output chylothorax/chylous ascites or localised postoperative lymphatic leak not resolving with conservative measures. contraindications / cautions no clear clinical indication; caution in severe respiratory compromise where oil-based contrast load may be poorly tolerated. work-up confirm chylous nature where relevant (triglycerides/chylomicrons); review operative history and cross-sectional imaging. plan intranodal access and likely leak level. planning & technique bilateral inguinal intranodal lymphangiography using controlled oil-based contrast injection. identify leak; thoracic duct/cisterna chyli access via transabdominal or retrograde route when needed; embolise leak/outflow. immediate post-care monitor respiratory status and embolisation-related symptoms; continue dietary/medical therapy until output falls. follow-up drain-output trend and imaging as needed; repeat intervention for persistent leak. complications & rescue oil embolisation, infection, access bleeding, non-target embolisation, rare neurologic/pulmonary complications. ebir pearls diagnostic lymphangiography alone can be therapeutic in some leaks.","oncall":false,"high":false},{"id":"p-C-4","cat":"C","title":"Percutaneous gastrostomy / gastrojejunostomy","sub":"C · Non-vascular · 2.2.2.4.1 · HIGH-YIELD","summary":"Image-guided enteral access with pre-procedure assessment of anatomy, aspiration risk, gastropexy and tube-care pathway.","blocks":[{"h":"Indications","items":["Long-term enteral nutrition or decompression when oral intake is inadequate and stomach/jejunum is accessible."],"text":"Indications Long-term enteral nutrition or decompression when oral intake is inadequate and stomach/jejunum is accessible."},{"h":"Contraindications / cautions","items":["No safe gastric access, uncontrolled peritonitis, severe uncorrectable coagulopathy.","Relative: massive ascites, interposed colon/liver, gastric varices, severe gastroparesis/aspiration risk may alter approach."],"text":"Contraindications / cautions No safe gastric access, uncontrolled peritonitis, severe uncorrectable coagulopathy. Relative: massive ascites, interposed colon/liver, gastric varices, severe gastroparesis/aspiration risk may alter approach."},{"h":"Work-up","items":["Review CT/US for stomach, liver and colon position; consider NG insufflation.","FBC/coagulation; antibiotics per local protocol; nutrition/SLT input and goals of care."],"text":"Work-up Review CT/US for stomach, liver and colon position; consider NG insufflation. FBC/coagulation; antibiotics per local protocol; nutrition/SLT input and goals of care."},{"h":"Planning & technique","items":["Insufflate stomach, select safe puncture, gastropexy where used, serial dilatation and tube placement under fluoroscopy.","For GJ, ensure jejunal tip beyond ligament of Treitz when feasible and avoid excessive intragastric loop."],"text":"Planning & technique Insufflate stomach, select safe puncture, gastropexy where used, serial dilatation and tube placement under fluoroscopy. For GJ, ensure jejunal tip beyond ligament of Treitz when feasible and avoid excessive intragastric loop."},{"h":"Immediate post-care","items":["Follow local fasting/commencement-of-feeds protocol; inspect site and educate on tube care."],"text":"Immediate post-care Follow local fasting/commencement-of-feeds protocol; inspect site and educate on tube care."},{"h":"Follow-up","items":["Tube exchange/maintenance pathway; review leakage, granulation, blockage and dislodgement."],"text":"Follow-up Tube exchange/maintenance pathway; review leakage, granulation, blockage and dislodgement."},{"h":"Complications & rescue","items":["Peritonitis from intraperitoneal placement/leak, bleeding, aspiration, infection, buried/dislodged tube, transcolonic placement."],"text":"Complications & rescue Peritonitis from intraperitoneal placement/leak, bleeding, aspiration, infection, buried/dislodged tube, transcolonic placement."},{"h":"EBIR pearls","items":["Interposed colon is a preventable catastrophe—prove your access route."],"text":"EBIR pearls Interposed colon is a preventable catastrophe—prove your access route."}],"text":"percutaneous gastrostomy / gastrojejunostomy c · non-vascular · 2.2.2.4.1 · high-yield image-guided enteral access with pre-procedure assessment of anatomy, aspiration risk, gastropexy and tube-care pathway. indications long-term enteral nutrition or decompression when oral intake is inadequate and stomach/jejunum is accessible. contraindications / cautions no safe gastric access, uncontrolled peritonitis, severe uncorrectable coagulopathy. relative: massive ascites, interposed colon/liver, gastric varices, severe gastroparesis/aspiration risk may alter approach. work-up review ct/us for stomach, liver and colon position; consider ng insufflation. fbc/coagulation; antibiotics per local protocol; nutrition/slt input and goals of care. planning & technique insufflate stomach, select safe puncture, gastropexy where used, serial dilatation and tube placement under fluoroscopy. for gj, ensure jejunal tip beyond ligament of treitz when feasible and avoid excessive intragastric loop. immediate post-care follow local fasting/commencement-of-feeds protocol; inspect site and educate on tube care. follow-up tube exchange/maintenance pathway; review leakage, granulation, blockage and dislodgement. complications & rescue peritonitis from intraperitoneal placement/leak, bleeding, aspiration, infection, buried/dislodged tube, transcolonic placement. ebir pearls interposed colon is a preventable catastrophe—prove your access route.","oncall":false,"high":true},{"id":"p-C-5","cat":"C","title":"Oesophageal / gastroduodenal stenting","sub":"C · Non-vascular · 2.2.2.4.2","summary":"Palliation or selected bridge therapy for malignant GI obstruction using lesion-length, migration and perforation-aware planning.","blocks":[{"h":"Indications","items":["Malignant dysphagia or gastroduodenal obstruction where rapid luminal palliation is appropriate.","Selected benign indications only after multidisciplinary consideration."],"text":"Indications Malignant dysphagia or gastroduodenal obstruction where rapid luminal palliation is appropriate. Selected benign indications only after multidisciplinary consideration."},{"h":"Contraindications / cautions","items":["Perforation/peritonitis, inability to cross lesion safely, obstruction better served by surgery/endoscopy."],"text":"Contraindications / cautions Perforation/peritonitis, inability to cross lesion safely, obstruction better served by surgery/endoscopy."},{"h":"Work-up","items":["Endoscopy/CT to define level, length, fistula, adjacent anatomy and tumour extent.","Assess aspiration risk, nutrition and goals of care."],"text":"Work-up Endoscopy/CT to define level, length, fistula, adjacent anatomy and tumour extent. Assess aspiration risk, nutrition and goals of care."},{"h":"Planning & technique","items":["Cross lesion gently with wire/catheter; define proximal/distal margins.","Choose covered vs uncovered stent based on tumour ingrowth, migration and fistula considerations; ensure adequate overlap."],"text":"Planning & technique Cross lesion gently with wire/catheter; define proximal/distal margins. Choose covered vs uncovered stent based on tumour ingrowth, migration and fistula considerations; ensure adequate overlap."},{"h":"Immediate post-care","items":["Diet progression and aspiration precautions; manage pain/reflux."],"text":"Immediate post-care Diet progression and aspiration precautions; manage pain/reflux."},{"h":"Follow-up","items":["Clinical review for recurrent dysphagia/obstruction; evaluate migration, food bolus or tumour ingrowth/overgrowth."],"text":"Follow-up Clinical review for recurrent dysphagia/obstruction; evaluate migration, food bolus or tumour ingrowth/overgrowth."},{"h":"Complications & rescue","items":["Perforation, bleeding, migration, reflux, fistula, airway compression, re-obstruction."],"text":"Complications & rescue Perforation, bleeding, migration, reflux, fistula, airway compression, re-obstruction."},{"h":"EBIR pearls","items":["Stent choice is a trade-off: covered resists ingrowth but migrates more."],"text":"EBIR pearls Stent choice is a trade-off: covered resists ingrowth but migrates more."}],"text":"oesophageal / gastroduodenal stenting c · non-vascular · 2.2.2.4.2 palliation or selected bridge therapy for malignant gi obstruction using lesion-length, migration and perforation-aware planning. indications malignant dysphagia or gastroduodenal obstruction where rapid luminal palliation is appropriate. selected benign indications only after multidisciplinary consideration. contraindications / cautions perforation/peritonitis, inability to cross lesion safely, obstruction better served by surgery/endoscopy. work-up endoscopy/ct to define level, length, fistula, adjacent anatomy and tumour extent. assess aspiration risk, nutrition and goals of care. planning & technique cross lesion gently with wire/catheter; define proximal/distal margins. choose covered vs uncovered stent based on tumour ingrowth, migration and fistula considerations; ensure adequate overlap. immediate post-care diet progression and aspiration precautions; manage pain/reflux. follow-up clinical review for recurrent dysphagia/obstruction; evaluate migration, food bolus or tumour ingrowth/overgrowth. complications & rescue perforation, bleeding, migration, reflux, fistula, airway compression, re-obstruction. ebir pearls stent choice is a trade-off: covered resists ingrowth but migrates more.","oncall":false,"high":false},{"id":"p-C-6","cat":"C","title":"PTC / biliary drainage / stenting","sub":"C · Non-vascular · 2.2.2.5 · HIGH-YIELD · ON-CALL","summary":"Percutaneous decompression of malignant/benign biliary obstruction with sepsis control, segmental planning and staged internalisation when appropriate.","blocks":[{"h":"Indications","items":["Obstructed biliary system requiring decompression when endoscopic drainage is failed, unavailable or inappropriate.","Cholangitis requiring urgent source control; malignant palliation or bridge to surgery."],"text":"Indications Obstructed biliary system requiring decompression when endoscopic drainage is failed, unavailable or inappropriate. Cholangitis requiring urgent source control; malignant palliation or bridge to surgery."},{"h":"Contraindications / cautions","items":["No absolute contraindication in life-threatening cholangitis; coagulopathy/ascites increase risk and should be optimised where possible."],"text":"Contraindications / cautions No absolute contraindication in life-threatening cholangitis; coagulopathy/ascites increase risk and should be optimised where possible."},{"h":"Work-up","items":["Review contrast imaging: level of obstruction, ducts that need drainage, lobar atrophy, portal patency and planned surgical resection.","FBC, INR/platelets, LFT/bilirubin, renal function, sepsis markers/blood cultures; antibiotic coverage.","Decide external vs internal-external vs primary stenting and which segments actually require drainage."],"text":"Work-up Review contrast imaging: level of obstruction, ducts that need drainage, lobar atrophy, portal patency and planned surgical resection. FBC, INR/platelets, LFT/bilirubin, renal function, sepsis markers/blood cultures; antibiotic coverage. Decide external vs internal-external vs primary stenting and which segments actually require drainage."},{"h":"Planning & technique","items":["US-guided peripheral duct puncture; avoid central hilar puncture where possible.","Cross obstruction when safe; cholangiography should be limited in infected obstruction to avoid pressurising undrained ducts.","Secure drain with sideholes spanning intended segments; staged metallic stenting for malignant obstruction when indicated."],"text":"Planning & technique US-guided peripheral duct puncture; avoid central hilar puncture where possible. Cross obstruction when safe; cholangiography should be limited in infected obstruction to avoid pressurising undrained ducts. Secure drain with sideholes spanning intended segments; staged metallic stenting for malignant obstruction when indicated."},{"h":"Immediate post-care","items":["Monitor sepsis, bile output, fluid/electrolyte loss, haemobilia and drain position.","Flush/cap only according to documented protocol and clinical condition."],"text":"Immediate post-care Monitor sepsis, bile output, fluid/electrolyte loss, haemobilia and drain position. Flush/cap only according to documented protocol and clinical condition."},{"h":"Follow-up","items":["Trend bilirubin/LFTs and symptoms; cholangiogram/exchange/stent pathway.","Persistent fever after unilateral hilar drainage may mean an undrained infected segment."],"text":"Follow-up Trend bilirubin/LFTs and symptoms; cholangiogram/exchange/stent pathway. Persistent fever after unilateral hilar drainage may mean an undrained infected segment."},{"h":"Complications & rescue","items":["Sepsis/cholangitis, haemobilia/arterial injury, bile leak/peritonitis, pleural transgression, drain dislodgement, pancreatitis."],"text":"Complications & rescue Sepsis/cholangitis, haemobilia/arterial injury, bile leak/peritonitis, pleural transgression, drain dislodgement, pancreatitis."},{"h":"EBIR pearls","items":["In hilar obstruction, “drain the liver” is too simplistic—drain functional segments and avoid contaminating undrained ducts."],"text":"EBIR pearls In hilar obstruction, “drain the liver” is too simplistic—drain functional segments and avoid contaminating undrained ducts."}],"text":"ptc / biliary drainage / stenting c · non-vascular · 2.2.2.5 · high-yield · on-call percutaneous decompression of malignant/benign biliary obstruction with sepsis control, segmental planning and staged internalisation when appropriate. indications obstructed biliary system requiring decompression when endoscopic drainage is failed, unavailable or inappropriate. cholangitis requiring urgent source control; malignant palliation or bridge to surgery. contraindications / cautions no absolute contraindication in life-threatening cholangitis; coagulopathy/ascites increase risk and should be optimised where possible. work-up review contrast imaging: level of obstruction, ducts that need drainage, lobar atrophy, portal patency and planned surgical res
